<script>
(function(){
"use strict";

/* ---------------- palette / constants ---------------- */
var CATEGORY_VAR = {
  "Presentación":"--teal", "Experiencia":"--blue", "Competencias":"--purple",
  "Situacional":"--amber", "Motivación y cultura":"--green", "Cierre":"--muted",
  "Repregunta":"--purple"
};
var CATEGORY_TINT = {
  "Presentación":"--teal-tint", "Experiencia":"--blue-tint", "Competencias":"--purple-tint",
  "Situacional":"--amber-tint", "Motivación y cultura":"--green-tint", "Cierre":"--border-soft",
  "Repregunta":"--purple-tint"
};
var LANG_LABEL = { es:"ES", en:"EN", pt:"PT" };
var RECOG_LANG = { es:"es-AR", en:"en-US", pt:"pt-BR" };
var LEVELS = ["Junior","Semi-Senior","Senior","Gerencial"];
var LANGS = [["es","Español"],["en","Inglés"],["pt","Português"]];

function fmt(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function makeCode(){ var A="ABCDEFGHJKMNPQRSTUVWXYZ23456789", c=""; for(var i=0;i<6;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }

function extForAnswer(a){
  var m = (a && a.mime) || "";
  if (!m && a && a.blobUrl && a.blobUrl.indexOf("data:") === 0){
    var mt = a.blobUrl.match(/^data:([^;,]+)/);
    if (mt) m = mt[1];
  }
  if (m.indexOf("mp4") >= 0) return ".m4a";
  if (m.indexOf("ogg") >= 0) return ".ogg";
  return ".webm";
}
function plainBrowserDownload(blobUrl, filename){
  try{
    var a = document.createElement("a");
    a.href = blobUrl; a.download = filename || "audio.webm";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch(e){}
}
async function downloadAudio(blobUrl, filename){
  try{
    if (!window.claude || !window.claude.use){ plainBrowserDownload(blobUrl, filename); return; }
    var downloads = await window.claude.use("downloads");
    if (!downloads){ plainBrowserDownload(blobUrl, filename); return; }
    var resp = await fetch(blobUrl);
    var blob = await resp.blob();
    await downloads.save({ filename: filename, data: blob });
  } catch(e){ /* the artifact viewer sandbox blocks a plain download here — nothing more we can do */ }
}

/* ---------------- Gmail send via the mcp capability ---------------- */
function probeGmailOnce(){
  if (rt.gmailProbed) return;
  rt.gmailProbed = true;
  state.gmailStatus = "checking";
  (async function(){
    try{
      if (!window.claude || !window.claude.use){ state.gmailStatus = "unavailable"; render(); return; }
      var mcp = await window.claude.use("mcp");
      if (!mcp){ state.gmailStatus = "unavailable"; render(); return; }
      var res = await mcp.listTools();
      var g = (res.servers || []).filter(function(s){ return s.server === "Gmail"; })[0];
      if (g && g.authStatus === "connected" && (g.tools || []).some(function(t){ return t.name === "send_message"; })){
        state.gmailStatus = "available";
      } else if (g && g.authStatus === "needs_reauth"){
        state.gmailStatus = "needs_reauth";
      } else {
        state.gmailStatus = "unavailable";
      }
    } catch(e){ state.gmailStatus = "unavailable"; }
    render();
  })();
}
function mapGmailError(err){
  var code = (err && err.code) || "upstream_error";
  var msgs = {
    needs_reauth: "Tu conexión con Gmail venció. Reconectala en claude.ai → Configuración → Conectores y volvé a intentar.",
    server_not_connected: "No encontramos Gmail conectado en tu cuenta. Conectalo en claude.ai → Configuración → Conectores.",
    selection_required: "Tenés más de una cuenta de Gmail conectada. Elegí una en el aviso de claude.ai y volvé a intentar.",
    blocked_by_policy: "Tu organización no permite enviar esto desde Gmail. Usá “Copiar mensaje”.",
    approval_required: "Este envío necesita aprobación de tu organización. Usá “Copiar mensaje” mientras tanto.",
    tool_error: "Gmail no pudo enviar el mensaje" + (err && err.message ? (": " + err.message) : "") + ".",
    server_unavailable: "Gmail no respondió a tiempo. Podés reintentar en unos segundos.",
    not_granted: "Esta vista no tiene permiso para usar conectores.",
    capability_disabled: "El envío por Gmail no está disponible acá ahora.",
    no_email: "Ingresá el email del entrevistado antes de enviar."
  };
  return { code: code, message: msgs[code] || "No pudimos enviarlo por Gmail ahora. Probá de nuevo o usá “Copiar mensaje”.", retryable: !!(err && err.retryable) };
}
function sendViaGmail(){
  if (!state.candidateEmail || !state.candidateEmail.trim()){
    state.sendState = "error"; state.sendError = mapGmailError({code:"no_email"}); render(); return;
  }
  state.sendState = "sending"; state.sendError = null; render();
  (async function(){
    try{
      if (!window.claude || !window.claude.use) throw {code:"capability_disabled"};
      var mcp = await window.claude.use("mcp");
      if (!mcp) throw {code:"capability_disabled"};
      var c = state.config;
      var result = await mcp.callTool("Gmail", "send_message", {
        to: [state.candidateEmail.trim()],
        subject: inviteSubject(),
        body: buildShareMessage()
      });
      state.sendState = "sent";
      var payload = result && result.payload;
      state.sentMessageId = (payload && payload.id) ? payload.id : null;
      render();
    } catch(err){
      state.sendState = "error";
      state.sendError = mapGmailError(err);
      render();
    }
  })();
}

/* ---------------- speech / hesitancy signals (pure heuristics) ---------------- */
var FILLERS = /(\beh+\b|\bem+\b|\bmmm+\b|\beste\b|\bo sea\b|\bosea\b|\bdigamos\b|\bviste\b|\bcomo que\b|\bponele\b|\bum+\b|\byou know\b|\blike\b|\bkind of\b)/gi;
function speechMetrics(text){
  text = text || "";
  var words = (text.trim().match(/\S+/g) || []).length;
  var fillers = (text.match(FILLERS) || []).length;
  return { words: words, fillers: fillers, fillerRatio: words ? fillers/words : 0 };
}
function isHesitant(a){
  a = a || {};
  var s = a.signals || {};
  var m = speechMetrics(a.transcript || "");
  if ((s.durationSec||0) < 3) return false;
  if (s.spoke === false) return true;
  if ((s.longestSilence||0) >= 3) return true;
  if (m.words >= 4 && m.fillerRatio > 0.15) return true;
  var wpm = s.durationSec ? m.words/(s.durationSec/60) : 0;
  if (m.words >= 6 && wpm > 0 && wpm < 55) return true;
  return false;
}

function lset(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; } catch(e){ return false; } }

/* ---------------- un solo uso (best-effort, por dispositivo) ---------------- */
function isInterviewUsed(code){ if(!code) return false; return !!lget("voz_used_"+String(code).toUpperCase()); }
function markInterviewUsed(code, email){ if(!code) return; lset("voz_used_"+String(code).toUpperCase(), { at: Date.now(), email: email||"" }); }

function supaFetch(path, opts){
  opts = opts || {};
  var s = getSession();
  var headers = { apikey:SUPABASE_ANON_KEY, "Content-Type":"application/json" };
  if (opts.headers) for (var k in opts.headers) headers[k]=opts.headers[k];
  if (s && s.access_token) headers["Authorization"] = "Bearer "+s.access_token;
  var o = { method:opts.method||"GET", headers:headers };
  if (opts.body) o.body = opts.body;
  return fetch(supaBase()+path, o).then(function(r){
    if (r.status === 401 && s && s.refresh_token){
      return supaRefresh().then(function(ok){
        if(!ok) return r;
        var s2=getSession(); headers["Authorization"]="Bearer "+s2.access_token;

    }

}

/* Extrae el texto de un PDF en el navegador (reutiliza pdf.js). Devuelve "" si no puede. */
function extractPdfText(file){
  return new Promise(function(resolve){
    try{
      if (!window.pdfjsLib){ resolve(""); return; }
      var rd = new FileReader();
      rd.onload = function(){
        pdfjsLib.getDocument({ data: rd.result }).promise.then(function(pdf){
          var pages = []; var max = Math.min(pdf.numPages, 10);
          function readPage(i){
            if (i > max){ resolve(pages.join("\n").replace(/\s+\n/g,"\n").trim().slice(0,15000)); return; }
            pdf.getPage(i).then(function(p){ return p.getTextContent(); }).then(function(c){
              pages.push(c.items.map(function(it){ return it.str; }).join(" ")); readPage(i+1);
            }).catch(function(){ readPage(i+1); });
          }
          readPage(1);
        }).catch(function(){ resolve(""); });
      };
      rd.onerror = function(){ resolve(""); };
      rd.readAsArrayBuffer(file);
    }catch(e){ resolve(""); }
  });
}

/* Sube uno o varios CVs (PDF) al repositorio. */
function uploadCVFiles(fileList){
  var files = Array.prototype.slice.call(fileList||[]).filter(function(f){ return /pdf/i.test(f.type)||/\.pdf$/i.test(f.name); });
  if(!files.length){ state.cvbank.msg="Subí archivos PDF."; render(); return; }
  state.cvbank.uploading=true; state.cvbank.msg="Procesando "+files.length+" archivo(s)…"; render();
  var done=0, okc=0;
  var chain=Promise.resolve();
  files.forEach(function(file){
    chain=chain.then(function(){
      if(file.size>10*1024*1024){ done++; return; }
      state.cvbank.msg="Procesando "+(done+1)+"/"+files.length+": "+file.name+"…"; render();
      return extractPdfText(file).then(function(txt){
        var up = audioUploadConfigured() ? uploadAudioToCloudinary(file).catch(function(){ return ""; }) : Promise.resolve("");
        return up.then(function(url){
          var base=file.name.replace(/\.[^.]+$/,"");
          return dbCreateCV({ candidate_name:base, file_name:file.name, cv_url:url||null, cv_text:txt||"" })
            .then(function(){ okc++; done++; }).catch(function(){ done++; });
        });
      });
    });
  });
  chain.then(function(){
    state.cvbank.uploading=false;
    state.cvbank.msg=okc+" CV(s) agregados"+(okc<files.length?(" · "+(files.length-okc)+" no se pudieron leer"):"")+".";
    dbListCVs().then(function(items){ state.cvbank.cvs=items; render(); }).catch(function(){ render(); });
  });
}

/* Crea una búsqueda nueva y la analiza. */
function doAnalyzeNewSearch(){
  var ns=state.newsearch;
  var title=(ns.title||"").trim(); var desc=(ns.description||"").trim();
  var must=(ns.must||"").trim(); var nice=(ns.nice||"").trim();
  if(!title){ state.searches.error2="Poné el puesto a cubrir."; render(); return; }
  var cvs=state.cvbank.cvs||[];
  var payload=cvPayloadFrom(cvs);
  if(!payload.length){ state.searches.error2="No hay CVs con texto legible para analizar. Cargá algunos primero."; render(); return; }
  state.searches.note=(cvs.length>25)?("Se analizaron los primeros 25 de "+cvs.length+" CVs (por límite de una tanda). Podés dividir en más búsquedas si necesitás."):null;
  state.searches.analyzing=true; state.searches.error2=null; render();
  dbCreateSearch({ title:title, description:desc, must_have:must||null, nice_to_have:nice||null }).then(function(row){
    return screenCVsAPI(title, desc, payload, must, nice).then(function(res){
      if(!res || !res.ok) throw new Error((res&&res.error)||"analyze_failed");
      var when=new Date().toISOString();
      return dbUpdateSearch(row.id, { results:res.ranking, analyzed_at:when }).then(function(updated){
        state.searches.analyzing=false;
        state.searches.current = updated || Object.assign({}, row, { results:res.ranking, analyzed_at:when });
        state.newsearch={ title:"", description:"", must:"", nice:"" };
        state.searches.items=null;
        state.screen="cv-ranking"; render();
      });
    });
  }).catch(function(e){
    state.searches.analyzing=false;
    state.searches.error2=(e&&e.message==="network")?"No pude conectar. Revisá tu conexión.":"No pude completar el análisis. Probá de nuevo en un momento.";
    render();
  });
}
/* Re-analiza la búsqueda actual con los CVs actuales del repo. */
function doReanalyze(){
  var x=state.searches.current; if(!x) return;
  var run=function(cvs){
    var payload=cvPayloadFrom(cvs);
    if(!payload.length){ state.searches.error2="No hay CVs con texto para analizar."; render(); return; }
    state.searches.note=(cvs.length>25)?("Se analizaron los primeros 25 de "+cvs.length+" CVs."):null;
    state.searches.analyzing=true; state.searches.error2=null; render();
    screenCVsAPI(x.title||"", x.description||"", payload, x.must_have||"", x.nice_to_have||"").then(function(res){
      if(!res || !res.ok) throw new Error((res&&res.error)||"fail");
      var when=new Date().toISOString();
      return dbUpdateSearch(x.id, { results:res.ranking, analyzed_at:when }).then(function(updated){
        state.searches.analyzing=false;
        state.searches.current = updated || Object.assign({}, x, { results:res.ranking, analyzed_at:when });
        state.searches.items=null; render();
      });
    }).catch(function(){ state.searches.analyzing=false; state.searches.error2="No pude analizar. Probá de nuevo."; render(); });
  };
  if(state.cvbank.cvs) run(state.cvbank.cvs);
  else dbListCVs().then(function(items){ state.cvbank.cvs=items; run(items); }).catch(function(){ state.searches.error2="No pude cargar los CVs."; render(); });
}

/* ---------------- self-contained invite link (works on any device, no server) ---------------- */
function encodePayload(obj){
  try{
    var json = JSON.stringify(obj);
    var b64 = btoa(unescape(encodeURIComponent(json)));
    return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  } catch(e){ return ""; }
}
function decodePayload(str){
  try{
    var b64 = String(str).replace(/-/g,'+').replace(/_/g,'/');
    while (b64.length % 4) b64 += '=';
    var json = decodeURIComponent(escape(atob(b64)));
    return JSON.parse(json);
  } catch(e){ return null; }
}
function stripQuestions(qs){
  return qs.map(function(q){ return { id:q.id, text:q.text, category:q.category, seconds:q.seconds, lang:q.lang, isFollowup:!!q.isFollowup, rootId:q.rootId, depth:q.depth||0, reason:q.reason||"" }; });

  return {
    v:1, code:state.code, id:state.interviewId||"",

    recruiterEmail:c.recruiterEmail||"",

/* Dominio de producción por defecto. Se usa solo cuando la página no corre
   sobre una URL pública propia (por ej. la previsualización dentro de claude.ai).
   Cuando la app corre en su sitio real, se usa ESE dominio automáticamente,
   así que si cambiás de dominio no hace falta tocar nada acá. */
var PROD_BASE = "https://entrevistas-two.vercel.app/";
function pageBaseUrl(){
  if (typeof window==="undefined" || !window.location) return "";
  var loc = window.location;
  if (!/^https?:$/.test(loc.protocol)) return "";
  if (/(^|\.)vercel\.app$/.test(loc.hostname) || loc.hostname === "localhost" || /^127\./.test(loc.hostname) || loc.hostname.indexOf(".") > 0){
    return loc.origin + loc.pathname;
  }
  return "";
}
function computeInviteLink(){
  var base = pageBaseUrl() || PROD_BASE;
  var token = encodePayload(buildInvitePayload());
  if (!token) return state.shareLink || "";
  return base + "#e=" + token;
}

/* El reloj arranca cuando APARECE la pregunta, así que al tiempo de respuesta
   le sumamos un margen para leer y pensar la consigna, proporcional a su largo. */
function readingBuffer(text){
  var words = (String(text||"").trim().match(/\S+/g) || []).length;
  return Math.round(14 + Math.min(20, words * 0.5));
}
function questionTime(q, forCandidate){
  var base = (q && q.seconds) || 90;
  return forCandidate ? base + readingBuffer(q && q.text) : base;
}

function shortEmpresa(s){
  s = (s||"").trim().split("\n")[0];
  if (s.length > 60) s = s.slice(0,57).trim() + "…";
  return s || "la empresa";
}
function fillTpl(tpl, cfg){
  var focoLine = cfg.focus ? ("Dijiste que uno de los focos a evaluar es \"" + cfg.focus + "\". Contame una situación concreta donde lo hayas puesto en práctica.") : "";
  return tpl
    .replace(/\{puesto\}/g, cfg.position || "este puesto")
    .replace(/\{empresaShort\}/g, shortEmpresa(cfg.company))
    .replace(/\{focoLine\}/g, focoLine);
}
function pickTemplates(lang, cat, n, cfg){
  var bank = (QBANK[lang] && QBANK[lang][cat]) ? QBANK[lang][cat].slice() : QBANK.es[cat].slice();
  var out = [], used = {};
  for (var i=0; i<n; i++){
    var pool = bank.filter(function(t,idx){ return !used[idx]; });
    if (!pool.length){ pool = bank; used = {}; }
    var idx = bank.indexOf(pick(pool));
    used[idx] = true;
    var text = fillTpl(bank[idx], cfg);
    if (!text.trim()) { i--; continue; }
    out.push(text);
  }
  return out;
}

function buildQuestions(cfg){
  var n;
  if (cfg.count === "auto"){
    n = cfg.level === "Junior" ? 7 : cfg.level === "Senior" ? 8 : cfg.level === "Gerencial" ? 9 : 7;
  } else { n = parseInt(cfg.count,10) || 7; }
  n = clamp(n, 5, 12);

  var middle = ["Experiencia","Competencias","Situacional","Motivación y cultura"];
  var seq = ["Presentación"];
  var ci = 0;
  while (seq.length < n-1){ seq.push(middle[ci % middle.length]); ci++; }
  seq.push("Cierre");

  var mainLang = cfg.language;
  var englishSlots = [];
  if (mainLang === "es" && cfg.includeEnglish){
    var mid = [];
    for (var i=1;i<seq.length-1;i++) mid.push(i);
    while (englishSlots.length < 2 && mid.length){
      var pi = Math.floor(Math.random()*mid.length);
      englishSlots.push(mid[pi]); mid.splice(pi,1);
    }
  }

  var counters = {};
  var qs = seq.map(function(cat, i){
    counters[cat] = (counters[cat]||0);
    var lang = englishSlots.indexOf(i) >= 0 ? "en" : mainLang;
    var tplLang = lang === "es" ? "es" : lang;
    var text = pickTemplates(tplLang, cat, counters[cat]+1, cfg)[counters[cat]];
    counters[cat]++;
    return {
      id: "q"+i,
      text: text,
      category: cat,
      seconds: SECONDS_BY_CAT[cat] || 90,
      lang: lang
    };
  });
  return qs;
}

function makeFollowup(q, reasonKind){
  var lang = q.lang === "es" ? "es" : (FOLLOWUP[q.lang] ? q.lang : "es");
  var bank = FOLLOWUP[lang] || FOLLOWUP.es;
  var text = pick(reasonKind === "delivery" ? bank.delivery : bank.content);
  var reason = reasonKind === "delivery"
    ? "Se detectaron pausas largas o muletillas; conviene pedir que lo resuma con claridad."
    : "La respuesta fue breve o genérica; conviene pedir un ejemplo concreto.";
  var root = q.rootId || q.id;
  return {
    id: root + "-f" + Date.now() + Math.floor(Math.random()*99),
    text: text, category: "Repregunta",
    seconds: 135, lang: q.lang,
    isFollowup: true, rootId: root, depth: (q.depth||0)+1, reason: reason
  };
}

/* ---------------- local heuristic evaluation (no network / no LLM) ----------------
   Puntaje EXIGENTE y honesto. Mide completitud, desarrollo y fluidez de cada
   respuesta — NO comprende el contenido (eso requeriría una IA). Arranca de cero
   y cada respuesta suma según cuánto se desarrolló; las respuestas vacías, de una
   palabra o genéricas casi no suman. */
function answerQuality(a){
  // Devuelve 0..1 para una respuesta y una etiqueta de estado.
  if (!a || (!a.transcript && !a.blobUrl)) return { q:0, status:"sin responder" };
  var text = a.transcript || "";
  var m = speechMetrics(text);
  var w = m.words;
  var dur = (a.signals && a.signals.durationSec) || 0;
  // Sin transcripción utilizable: si grabó algo audible, crédito mínimo; si no, casi nada.
  if (w < 3){
    if (a.blobUrl && a.signals && a.signals.spoke && dur >= 4) return { q:0.12, status:"muy breve" };
    return { q:0, status:"insuficiente" };
  }
  var base;
  if (w < 8) base = 0.12;
  else if (w < 18) base = 0.32;
  else if (w < 35) base = 0.55;
  else if (w < 60) base = 0.78;
  else if (w < 110) base = 0.92;
  else base = 1.0;
  // Penalizaciones por muletillas y dudas.
  base -= Math.min(0.30, m.fillerRatio * 1.6);
  if (isHesitant(a)) base -= 0.15;
  // Respuestas larguísimas pero muy dubitativas no deberían quedar altas.
  base = clamp(base, 0, 1);
  var status = base >= 0.7 ? "sólida" : base >= 0.45 ? "aceptable" : base >= 0.2 ? "floja" : "muy breve";
  return { q:base, status:status };
}
function evaluateLocally(questions, answers, cfg){
  var per = questions.map(function(q){ var r = answerQuality(answers[q.id]); r.q_id=q.id; r.text=q.text; r.category=q.category; return r; });
  var n = questions.length || 1;
  var answeredN = per.filter(function(r){ return r.status !== "sin responder"; }).length;
  var insufficientN = per.filter(function(r){ return r.q < 0.2; }).length; // incluye sin responder + insuficientes
  var solidN = per.filter(function(r){ return r.q >= 0.7; }).length;
  var totalQ = per.reduce(function(s,r){ return s + r.q; }, 0);
  var overallQuality = totalQ / n; // 0..1, las no respondidas cuentan como 0

  // Puntaje de 1 a 10, exigente: 0 desarrollo => 1 ; desarrollo pleno => 10.
  var score = clamp(Math.round((1 + 9 * overallQuality) * 2) / 2, 1, 10);

  // Métricas de expresión (solo sobre lo efectivamente respondido).
  var respondedTexts = per.filter(function(r){ return r.status !== "sin responder"; });
  var fillerArr = respondedTexts.map(function(r){ return speechMetrics(answers[r.q_id].transcript||"").fillerRatio; });
  var avgFiller = fillerArr.length ? fillerArr.reduce(function(a,b){return a+b;},0)/fillerArr.length : 0;
  var hesitantN = per.filter(function(r){ var a=answers[r.q_id]; return a && isHesitant(a); }).length;
  var hesitantRate = answeredN ? hesitantN/answeredN : 0;

  var recommendation = score >= 7.5 ? "Avanzar" : score >= 5 ? "Con reservas" : "No avanzar";

  var strengths = [];
  if (solidN >= Math.ceil(n*0.6)) strengths.push("Desarrolló con buen nivel de detalle la mayoría de las respuestas.");
  else if (solidN >= 2) strengths.push("Algunas respuestas (" + solidN + ") fueron sólidas y desarrolladas.");
  if (answeredN === n && insufficientN === 0) strengths.push("Respondió todas las preguntas con contenido suficiente.");
  if (avgFiller < 0.05 && answeredN) strengths.push("Se expresa con fluidez, sin muletillas frecuentes.");
  if (hesitantRate < 0.2 && answeredN) strengths.push("Se mostró seguro/a y sin dudas marcadas al hablar.");
  if (!strengths.length) strengths.push("No se identificaron fortalezas destacables a partir de las respuestas registradas.");

  var improve = [];
  if (insufficientN > 0) improve.push(insufficientN + " de " + n + " respuestas quedaron sin responder o sin desarrollar (respuestas vacías o de muy pocas palabras).");
  if (answeredN < n) improve.push("Dejó " + (n - answeredN) + " pregunta(s) sin responder.");
  if (overallQuality < 0.35) improve.push("El nivel de desarrollo general fue bajo: las respuestas no alcanzan para evaluar competencias con seriedad.");
  if (avgFiller >= 0.12) improve.push("Uso frecuente de muletillas (eh, este, o sea); conviene trabajar la fluidez.");
  if (hesitantRate >= 0.35) improve.push("Pausas largas o dudas en varias respuestas, posible inseguridad con los temas.");
  if (!improve.length) improve.push("No se detectaron debilidades relevantes en las respuestas registradas.");

  // Repreguntas sugeridas: las respuestas más flojas (pero respondidas) primero.
  var weakest = per.filter(function(r){ return r.status !== "sin responder"; }).sort(function(a,b){ return a.q - b.q; });
  var probes = weakest.slice(0,2).map(function(r){
    return "Volver a preguntar sobre “" + r.text.slice(0,70) + (r.text.length>70?"…":"") + "” pidiendo un ejemplo concreto y medible.";
  });
  if (!probes.length) probes.push("Profundizar con un caso práctico vinculado al puesto en la próxima instancia.");

  var nivel = overallQuality >= 0.7 ? "alto" : overallQuality >= 0.45 ? "moderado" : overallQuality >= 0.2 ? "bajo" : "insuficiente";
  var overall;
  if (overallQuality < 0.2){
    overall = "Entrevista insuficiente para evaluar: respondió " + answeredN + " de " + n + " preguntas y el desarrollo fue mínimo (respuestas vacías o de muy pocas palabras). No hay material para una valoración seria del perfil.";
  } else {
    overall = "Respondió " + answeredN + " de " + n + " preguntas, con un nivel de desarrollo " + nivel + ". " +
      (insufficientN>0 ? (insufficientN + " respuesta(s) quedaron sin desarrollar. ") : "") +
      (hesitantRate>=0.3 ? "Mostró pausas o dudas en varias respuestas." : "Se mostró, en general, seguro/a al responder.");
  }

  return { overall: overall, score: score, recommendation: recommendation, strengths: strengths, improve: improve, probes: probes,
           meta: { answeredN:answeredN, total:n, insufficientN:insufficientN, solidN:solidN, overallQuality:Math.round(overallQuality*100) } };
}

function AdminPanel(){
  if (!isAdminUser()) return '';
  var a = state.admin;
  var html = '<div class="card" style="margin-bottom:20px;border:1px solid var(--teal)">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px">' +
      '<div style="display:flex;align-items:center;gap:8px;color:var(--teal)">'+ic('shield',18)+'<h3 style="font-size:15px;color:var(--ink)">Administración de reclutadores</h3></div>' +
      '<button class="btn btn-ghost btn-sm" data-action="reload-admin">'+ic('rotate',13)+'</button>' +
    '</div>';
  if (a.loading || a.items===null){ html += '<p style="font-size:13px;color:var(--muted);margin:0">Cargando…</p>'; }
  else if (a.error){ html += Note("err","No pude cargar la lista ("+esc(a.error)+")."); }
  else if (!a.items.length){ html += '<p style="font-size:13px;color:var(--muted);margin:0">No hay reclutadores registrados.</p>'; }
  else {
    var pending = a.items.filter(function(p){return !p.approved;});
    var approved = a.items.filter(function(p){return p.approved;});
    if (pending.length){
      html += '<p style="font-size:12.5px;font-weight:700;color:var(--amber);margin:0 0 8px">Pendientes ('+pending.length+')</p><div style="display:grid;gap:8px;margin-bottom:14px">';
      pending.forEach(function(p){
        html += '<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--amber-tint);border-radius:10px">' +
          '<span style="flex:1;min-width:0;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(p.email||p.id)+'</span>' +
          '<button class="btn btn-teal btn-sm" data-action="approve-rec" data-id="'+esc(p.id)+'">'+ic('check',13)+' Aprobar</button>' +
        '</div>';
      });
      html += '</div>';
    }
    html += '<p style="font-size:12.5px;font-weight:700;color:var(--green);margin:0 0 8px">Aprobados ('+approved.length+')</p><div style="display:grid;gap:6px">';
    approved.forEach(function(p){
      html += '<div style="display:flex;align-items:center;gap:10px;padding:6px 10px;font-size:12.5px;color:var(--muted)">' +
        '<span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(p.email||p.id)+'</span>' +
        (isAdminUser() && currentUser() && p.email && String(p.email).toLowerCase()===String(currentUser().email).toLowerCase() ? '<span style="font-size:11px;color:var(--teal)">vos</span>' : '<button class="dl-audio" data-action="revoke-rec" data-id="'+esc(p.id)+'" style="background:none;border:none;color:var(--brick);cursor:pointer;font-size:11px">revocar</button>') +
      '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function scoreColorVar(sc){ return sc>=7?"var(--green)":sc>=5?"var(--amber)":"var(--brick)"; }
function scoreTintVar(sc){ return sc>=7?"var(--green-tint)":sc>=5?"var(--amber-tint)":"var(--brick-tint)"; }
function fmtDate(iso){ if(!iso) return ""; try{ var d=new Date(iso); return d.toLocaleDateString('es-AR')+" "+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ""; } }

function DashboardList(){
  var d = state.dash;
  if (d.loading || d.items===null) return '<div class="center-block">'+ic('loader',26,'spin')+'<p>Cargando entrevistas…</p></div>';
  if (d.error) return Note("err", esc(d.error)) + '<button class="btn btn-ghost btn-sm" data-action="reload-dash">'+ic('rotate',14)+' Reintentar</button>';
  if (!d.items.length) return '<div class="center-block" style="padding:30px 12px">'+ic('list',26)+'<h2 style="font-size:16px">Todavía no hay entrevistas</h2><p>Creá tu primera entrevista y compartí el enlace al candidato.</p></div>';
  var completed = d.items.filter(function(x){return x.status==='completed';});
  var pend = d.items.filter(function(x){return x.status!=='completed';});
  var html = '';
  html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">' +
    '<span class="pill-time" style="background:var(--green-tint);color:var(--green)">'+completed.filter(function(x){return x.score>=7;}).length+' aprobados</span>' +
    '<span class="pill-time" style="background:var(--amber-tint);color:var(--amber)">'+completed.filter(function(x){return x.score>=5&&x.score<7;}).length+' medios</span>' +
    '<span class="pill-time" style="background:var(--brick-tint);color:var(--brick)">'+completed.filter(function(x){return x.score<5;}).length+' desaprobados</span>' +
    '<span class="pill-time">'+pend.length+' pendientes</span>' +
  '</div>';
  html += '<div style="display:grid;gap:10px">';
  d.items.forEach(function(x){
    var done = x.status==='completed';
    var sc = (typeof x.score==='number')?x.score:null;
    var name = x.candidate_name || (done?'(sin nombre)':'Pendiente');
    var badge = done && sc!=null
      ? '<span style="flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;background:'+scoreTintVar(sc)+';color:'+scoreColorVar(sc)+'" class="mono">'+sc+'</span>'
      : '<span style="flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted)">'+ic('clock',18)+'</span>';
    html += '<div class="qa-item" '+(done?'data-action="open-detail" data-id="'+esc(x.id)+'" style="cursor:pointer;display:flex;align-items:center;gap:14px"':'style="display:flex;align-items:center;gap:14px;opacity:.85"')+'>' +
      badge +
      '<div style="flex:1;min-width:0">' +
        '<p style="margin:0;font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(name)+'</p>' +
        '<p style="margin:2px 0 0;font-size:12.5px;color:var(--muted)">'+esc(x.position||'')+(done?(' · '+esc(x.recommendation||'')):' · pendiente')+'</p>' +
        '<p style="margin:2px 0 0;font-size:11.5px;color:var(--muted)">'+esc(fmtDate(x.completed_at||x.created_at))+' · código '+esc(x.code||'')+'</p>' +
      '</div>' +
      (done ? ic('chevron',16) : '<button class="dl-audio" data-action="del-interview" data-id="'+esc(x.id)+'" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px">quitar</button>') +

  return html;

function buildResultsMessage(){
  var c = state.config, r = state.report;
  var L = [];
  L.push("Respuestas de entrevista por voz");
  L.push("Puesto: " + (c.position||"-"));
  L.push("Candidato: " + (state.candidateName || "(sin nombre)"));
  L.push("Email: " + (state.candidateEmail || "(sin email)"));
  if (state.code) L.push("Código: " + state.code);
  L.push("");
  var perMap = {};
  if (r && r.ai && r.perQuestion){ r.perQuestion.forEach(function(p){ if (p && p.n!=null) perMap[p.n] = p; }); }
  if (r){
    L.push(r.ai ? "=== EVALUACIÓN CON IA (entrevistador senior) ===" : "=== EVALUACIÓN AUTOMÁTICA (por reglas) ===");
    L.push("Puntaje: " + r.score + "/10  ·  " + r.recommendation);
    if (r.overall) L.push(r.overall);
    L.push("");
    if (r.strengths && r.strengths.length){ L.push("Fortalezas:"); r.strengths.forEach(function(s){ L.push("  • " + s); }); L.push(""); }
    if (r.improve && r.improve.length){ L.push("A mejorar:"); r.improve.forEach(function(s){ L.push("  • " + s); }); L.push(""); }
    if (r.probes && r.probes.length){ L.push("Repreguntas sugeridas:"); r.probes.forEach(function(s){ L.push("  • " + s); }); L.push(""); }
  }
  var hasAudio = state.audioUrls && Object.keys(state.audioUrls).length > 0;
  L.push(hasAudio ? "=== RESPUESTAS (audios para escuchar) ===" : "=== RESPUESTAS (transcripción aproximada) ===");
  state.questions.forEach(function(q,i){
    var a = state.answers[q.id];
    var url = state.audioUrls && state.audioUrls[q.id];
    L.push((i+1) + ". " + q.text);
    if (url) L.push("   Audio: " + url);
    else if (a && a.transcript) L.push("   Transcripción aprox.: " + a.transcript);
    else L.push("   (sin respuesta)");
    var p = perMap[i+1];
    if (p && (p.assessment || p.rating)) L.push("   IA: " + (p.rating?("["+p.rating+"] "):"") + (p.assessment||""));
    if (a && a.signals) L.push("   [duró " + (a.signals.durationSec||0) + "s · pausa máx " + (a.signals.longestSilence||0) + "s]");
    L.push("");
  });
  if (r && r.ai) L.push("— Evaluación realizada por IA (entrevistador senior) sobre las respuestas transcriptas. " + (hasAudio ? "Escuchá los audios con los enlaces de arriba para tu valoración final." : ""));

  return L.join("\n");
}

var AI_ANALYZE_ENDPOINT = "/api/analyze";
function analyzeWithAI(){
  var payload = {
    position: state.config.position, company: state.config.company, focus: state.config.focus,
    level: state.config.level, language: state.config.language,
    questions: state.questions.map(function(q,i){

      return { n:i+1, text:q.text, category:q.category, lang:q.lang||"es", transcript:(a.transcript||""), durationSec:(a.signals&&a.signals.durationSec)||0 };
    })
  };
  return fetch(AI_ANALYZE_ENDPOINT, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j && j.ok && j.analysis) return j.analysis; throw new Error((j && j.error) || "sin_analisis"); });
}
function generateQuestions(){
  var c = state.config;
  var target = c.count === "auto" ? (c.level==="Junior"?7:c.level==="Senior"?8:c.level==="Gerencial"?9:7) : (parseInt(c.count,10)||7);
  var payload = { task:"questions", position:c.position, company:c.company, focus:c.focus, companyUrl:(c.companyUrl||""), level:c.level, language:c.language, count:target, includeEnglish: !!c.includeEnglish };
  if (rt.cvText && rt.cvText.length > 40) payload.cvText = rt.cvText;
  else if (rt.cvData && rt.cvData.data) payload.cv = { data: rt.cvData.data, mimeType: rt.cvData.mimeType };
  return fetch(AI_ANALYZE_ENDPOINT, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j && j.ok && Array.isArray(j.questions) && j.questions.length) return j.questions; var er=new Error((j && j.error) || "sin_preguntas"); er.detail=(j && j.detail)||""; throw er; });
}
function mapAIQuestions(list, lang){
  return list.slice(0,14).map(function(q,i){
    var cat = q.category || "Experiencia";
    if (!SECONDS_BY_CAT[cat]) cat = "Experiencia";
    var ql = (q.lang==="en") ? "en" : (lang||"es");
    return { id:"q"+i, text:String(q.text||"").trim(), category:cat, seconds: SECONDS_BY_CAT[cat]||120, lang: ql };
  }).filter(function(q){ return q.text; });
}
function reportFromAI(ai){
  function arr(x){ return Array.isArray(x) ? x.filter(function(v){ return v!=null && String(v).trim(); }).map(String) : []; }
  var sc = Number(ai.score); if (!(sc>=1 && sc<=10)) sc = 1; sc = Math.round(sc*2)/2;
  var per = Array.isArray(ai.perQuestion) ? ai.perQuestion.map(function(p){ return { n:p.n, rating:String(p.rating||""), assessment:String(p.assessment||"") }; }) : [];
  return {
    score: sc,
    recommendation: ai.recommendation || (sc>=7.5?"Avanzar":sc>=5?"Con reservas":"No avanzar"),
    overall: String(ai.overall||""),
    strengths: arr(ai.strengths),
    improve: arr(ai.improve),
    probes: arr(ai.probes),
    perQuestion: per,
    language: (ai.language && typeof ai.language==="object") ? {
      lang: String(ai.language.lang||""),
      level: String(ai.language.level||""),
      answeredInLanguage: ai.language.answeredInLanguage,
      comment: String(ai.language.comment||"")
    } : null,
    ai: true
  };
}

/* ---------------- audios: subida a Cloudinary (unsigned, sin backend) ----------------
   Completá estos dos datos de tu cuenta gratuita de Cloudinary para que los audios
   del candidato se suban y te lleguen como enlaces para escuchar. Si quedan vacíos,
   el mail cae a la transcripción como respaldo. */
var CLOUDINARY_CLOUD_NAME = "memtugeu";
var CLOUDINARY_UPLOAD_PRESET = "ml_default";
function audioUploadConfigured(){ return !!(CLOUDINARY_CLOUD_NAME && CLOUDINARY_UPLOAD_PRESET); }
function uploadAudioToCloudinary(blob){
  var fd = new FormData();
  fd.append("file", blob);
  fd.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  return fetch("https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/auto/upload", { method:"POST", body: fd })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j && j.secure_url) return j.secure_url; throw new Error((j && j.error && j.error.message) || "Falló la subida del audio"); });
}
/* Sube todos los audios grabados y guarda las URLs en state.audioUrls (best-effort). */
function uploadAllAudios(){
  rt.audioError = "";
  if (!audioUploadConfigured()) { rt.audioError = "Cloudinary no está configurado para subir audios."; return Promise.resolve(); }
  var qs = state.questions.slice();
  var chain = Promise.resolve();
  state.audioUrls = state.audioUrls || {};
  qs.forEach(function(q){
    var a = state.answers[q.id];
    if (!a) return;
    var hasBlob = (typeof Blob !== "undefined") && (a.blob instanceof Blob);
    var hasUrl = a.blobUrl && a.blobUrl.indexOf("blob:") === 0;
    if (!hasBlob && !hasUrl) return;
    chain = chain.then(function(){
      // Preferimos el Blob en memoria (más robusto: Safari a veces pierde la blob: URL).
      var getBlob = hasBlob ? Promise.resolve(a.blob) : fetch(a.blobUrl).then(function(r){ return r.blob(); });
      return getBlob.then(function(blob){
        var ext = /mp4/.test(blob.type) ? ".mp4" : /ogg/.test(blob.type) ? ".ogg" : ".webm";
        var named = blob;
        try{ named = new File([blob], "respuesta-"+q.id+ext, { type: blob.type || "audio/webm" }); }catch(e){}
        return uploadAudioToCloudinary(named).then(function(url){ state.audioUrls[q.id] = url; })
          .catch(function(e){ if(!rt.audioError) rt.audioError = (e && e.message) || "Falló la subida del audio."; });
      }).catch(function(e){ if(!rt.audioError) rt.audioError = (e && e.message) || "No pude leer el audio grabado."; });
    });
  });
  return chain;
}

Screens.interview = function(){

  var nextIsFollowup = !!(nx && nx.isFollowup && nx.rootId === root);

  var timedOut = !!(answer && answer.noAnswer);
  var isCandidate = state.interviewMode === "candidate";

    (q.lang!=="es" ? Badge(LANG_LABEL[q.lang], q.lang==="en"?"Inglés":"Otro idioma") : '') +

  html += '<p style="font-size:17px;line-height:1.55;font-family:Fraunces,Georgia,serif;font-weight:500;margin:0">'+esc(q.text)+'</p>';

  html += '<div class="rec-wrap"><div class="rec-ring">' +
    '<svg width="168" height="168" viewBox="0 0 128 128">' +

    html += '<div class="rec-btn rec-done" style="color:var(--brick)">'+ic('alert',24)+'<span style="font-size:11px;font-weight:600">Sin respuesta</span></div>';
  } else if (state.micDenied){
    html += '<button class="rec-btn rec-idle" data-action="retry-rec" style="color:var(--brick)">'+ic('mic',22)+'<span style="font-size:11px;font-weight:600">Reintentar</span></button>';
  } else {
    html += '<button class="rec-btn rec-idle" data-action="start-rec">'+ic('mic',22)+'<span style="font-size:12px;font-weight:600">Grabar</span></button>';
  }
  html += '</div>';
  // Reloj visible (el tiempo corre desde que apareció la pregunta)
  if (state.qTiming && !state.recording && !answered && !timedOut){
    html += '<p class="rec-hint" style="font-weight:700;color:'+(overtime?'var(--brick)':'var(--ink)')+'"><span class="mono">'+fmt(state.timeLeft)+'</span> restantes — tocá <strong>Grabar</strong> cuando estés listo</p>';
  }
  var hintTxt;
  if (state.recording) hintTxt = isCandidate ? "Grabando. Tocá el cuadrado cuando termines de responder." : "Grabando… tocá el cuadrado para terminar antes.";
  else if (answered) hintTxt = isCandidate ? "Respuesta guardada. No se puede volver a grabar; continuá con la siguiente." : "Podés escuchar tu respuesta o volver a grabar.";
  else if (timedOut) hintTxt = "Se acabó el tiempo de esta pregunta sin una respuesta grabada. Podés continuar.";
  else if (state.micDenied) hintTxt = "Necesitamos el micrófono para grabar. Dale permiso al navegador y tocá Reintentar.";
  else if (isCandidate) hintTxt = "El tiempo ya corre. Leé y pensá la respuesta; cuando estés listo tocá Grabar. No se puede regrabar.";
  else hintTxt = "Tocá el micrófono y el cronómetro arranca. Se corta solo al llegar a 0.";
  html += '<p class="rec-hint">' + hintTxt + '</p></div>';

  if (answer && answer.blobUrl && !state.recording && !isCandidate){
    html += '<div class="transcript-box"><audio controls src="'+answer.blobUrl+'"></audio>';
    if (answer.transcript) html += '<div style="margin-top:12px"><div class="transcript-label">'+ic('msg',12)+' Transcripción aproximada</div><p style="margin:0;font-size:13.5px">'+esc(answer.transcript)+'</p></div>';
    html += '</div>';
  }
  if (state.recording && state.live) html += '<div class="transcript-box" style="margin-top:12px;color:var(--muted)">'+esc(state.live)+'</div>';
  html += '</div>';

  html += '<div class="flex-actions">';
  if (answer && answer.blobUrl && !state.recording && !isCandidate) html += '<button class="btn btn-ghost btn-sm" data-action="re-record">'+ic('rotate',14)+' Volver a grabar</button>';
  var showNext = isCandidate ? (answered || timedOut) : true;
  if (showNext) html += '<button class="btn btn-primary" data-action="next-q" style="margin-left:auto">' +
    (state.idx < total-1 ? "Siguiente pregunta "+ic('chevron',15) : esc(lastLabel)+" "+ic('chevron',15)) +
  '</button>';
  html += '</div>';
  return html;
};

/* ---- auth (Supabase) ---- */
function doLogin(email, password, captchaToken){
  email=(email||"").trim(); password=password||"";
  if(!email || !password){ state.error="Ingresá tu email y contraseña."; render(); return; }
  if(captchaConfigured() && !captchaToken){ state.error="Completá la verificación de seguridad."; render(); return; }
  state.busy=true; state.error=null; render();
  supaLogin(email, password, captchaToken).then(function(res){
    state.busy=false;
    if(res.ok && res.j && res.j.access_token){ storeSessionFromToken(res.j); state.error=null; routeAfterAuth(); }
    else { state.error = (res.j && (res.j.error_description||res.j.msg||res.j.error)) || "Email o contraseña incorrectos."; render(); }
  }).catch(function(){ state.busy=false; state.error="No pude conectar. Revisá tu conexión."; render(); });
}
function doSignup(email, password, captchaToken){
  email=(email||"").trim(); password=password||"";
  if(!email || password.length<6){ state.error="Email válido y contraseña de al menos 6 caracteres."; render(); return; }
  state.busy=true; state.error=null; render();
  supaSignup(email, password, captchaToken).then(function(res){
    if(res.ok && res.j && res.j.access_token){ state.busy=false; storeSessionFromToken(res.j); state.error=null; routeAfterAuth(); return; }
    if(res.ok && res.j && (res.j.id || res.j.user)){
      // Cuenta creada pero requiere confirmar email: intentamos loguear igual.
      supaLogin(email, password).then(function(r2){
        state.busy=false;
        if(r2.ok && r2.j && r2.j.access_token){ storeSessionFromToken(r2.j); routeAfterAuth(); }
        else { state.error="Cuenta creada. Revisá tu email para confirmarla y luego iniciá sesión."; state.screen="rec-login"; render(); }
      });
      return;
    }
    state.busy=false;
    state.error = (res.j && (res.j.error_description||res.j.msg||res.j.error)) || "No pude crear la cuenta.";
    render();
  }).catch(function(){ state.busy=false; state.error="No pude conectar. Revisá tu conexión."; render(); });
}
function doLogout(){ supaLogout(); state.dash={loading:false,items:null,error:null,detail:null}; state.admin={loading:false,items:null,error:null}; state.myApproved=null; state.screen="home"; render(); }
function loadDashboard(){
  if(!supaConfigured() || !isLoggedIn()) return;
  state.dash.loading=true; state.dash.error=null; render();
  dbListInterviews().then(function(items){ state.dash.loading=false; state.dash.items=items; render(); })
    .catch(function(){ state.dash.loading=false; state.dash.error="No pude cargar las entrevistas."; render(); });
}
function routeAfterAuth(){
  state.myApproved = null; state.screen="rec-home"; render();
  // El admin siempre entra al panel (para poder aprobar, incluso a sí mismo).
  if (isAdminUser()){ state.myApproved = true; state.screen="rec-home"; render(); loadDashboard(); loadAdminList(); return; }
  loadProfile().then(function(approved){
    state.myApproved = !!approved;
    if (approved){ state.screen="rec-home"; render(); loadDashboard(); }
    else { state.screen="rec-pending"; render(); }
  });
}
function loadAdminList(){
  if(!isAdminUser()) return;
  state.admin.loading=true; state.admin.error=null; render();
  adminCall("list").then(function(j){ state.admin.loading=false; if(j&&j.ok){ state.admin.items=j.profiles||[]; } else { state.admin.error=(j&&j.error)||"error"; } render(); });
}
function adminApprove(id, approve){
  adminCall(approve?"approve":"revoke", id).then(function(j){ if(j&&j.ok){ loadAdminList(); } else { alert("No pude actualizar: "+((j&&j.error)||"error")); } });
}

function generate(){
  state.error=null; state.screen="generating"; render();
  function toEdit(qs){
    if (!qs || !qs.length) qs = buildQuestions(state.config);
    if (!qs.length){ state.error = "No pude generar la entrevista. Revisá los datos y probá de nuevo."; state.screen = "config"; render(); return; }
    state.questions = qs;
    state.screen = "edit-questions"; render();
  }
  // Preguntas a medida con IA (Gemini). Si falla o no hay IA, se usan plantillas (y te avisamos).
  state.aiFallback = null;
  generateQuestions()
    .then(function(list){ state.aiFallback = null; toEdit(mapAIQuestions(list, state.config.language)); })
    .catch(function(e){ var code=(e&&e.message)||"network"; if(/fetch|network|load failed|failed to/i.test(code)) code="network"; state.aiFallback = aiErrorMessage(code, e&&e.detail); toEdit(buildQuestions(state.config)); });
}
function aiErrorMessage(code, detail){
  var m = {
    "no_key": "la IA no está configurada (falta la GEMINI_API_KEY en Vercel)",
    "gemini_error": "Gemini devolvió un error — probablemente la API key esté inválida, revocada o sin cuota",
    "parse_error": "la IA respondió en un formato inesperado",
    "sin_preguntas": "la IA no devolvió preguntas",
    "network": "no pude conectarme con la IA"
  };
  var reason = m[code] || (code ? ("motivo: "+code) : "motivo desconocido");
  var d = (detail && String(detail).trim()) ? (" — Detalle de Gemini: “"+String(detail).slice(0,300)+"”") : "";
  return "⚠ Estas preguntas son de PLANTILLA (no personalizadas por IA), porque "+reason+d+". Revisá la GEMINI_API_KEY en Vercel para que las preguntas se generen a medida del puesto y del CV.";
}
function addQuestion(){
  var i = state.questions.length;
  state.questions.push({ id:"q"+i+"x"+Date.now(), text:"", category:"Experiencia", seconds: SECONDS_BY_CAT["Experiencia"]||160, lang: state.config.language||"es" });
  render();
}
function delQuestion(idx){ state.questions.splice(idx,1); render(); }
function createInterview(){
  var qs = state.questions.filter(function(q){ return q.text && q.text.trim(); });
  if (!qs.length){ state.error="La entrevista necesita al menos una pregunta."; render(); return; }
  qs.forEach(function(q,i){ if(!q.id) q.id="q"+i; });
  state.questions = qs;
  state.error=null; state.screen="generating"; render();

  var code = makeCode();
  var ok = lset("voz_iv_"+code, {
    position: state.config.position, company: state.config.company, focus: state.config.focus,
    level: state.config.level, language: state.config.language, followups: false,
    questions: qs, createdAt: Date.now()
  });
  rt.analyzed = {};
  state.answers = {}; state.idx = 0; state.report = null;
  state.code = code; state.interviewId = ""; state.candidateEmail=""; state.candidateName=""; state.storageWarn = !ok;
  state.sendState = "idle"; state.sendError = null; state.sentMessageId = null;

  function toShare(){ state.shareLink = computeInviteLink(); state.screen = "share"; probeGmailOnce(); render(); }
  if (supaConfigured() && isLoggedIn()){
    var u = currentUser();
    var row = {
      recruiter_id: u && u.id, code: code,
      position: state.config.position, company: state.config.company, focus: state.config.focus||"",
      level: state.config.level, language: state.config.language,
      questions: stripQuestions(qs), status: "pending"
    };
    dbCreateInterview(row).then(function(saved){ state.interviewId = saved.id || ""; toShare(); })
      .catch(function(){ state.storageWarn = true; toShare(); });
  } else {
    toShare();
  }
}

function emailsMatch(a, b){ return (a||"").trim().toLowerCase() === (b||"").trim().toLowerCase(); }

function startInviteInterview(emailRaw, codeRaw, nameRaw){
  var inv = state.invite; if (!inv || !inv.questions) return;
  var emailIn = (emailRaw||"").trim();
  var codeIn = (codeRaw||"").trim().toUpperCase();
  var nameIn = (nameRaw||"").trim().replace(/\s+/g," ");
  if (!nameIn || nameIn.length < 3 || nameIn.indexOf(" ") < 1){ state.error="Ingresá tu nombre y apellido."; render(); return; }
  if (!emailIn || emailIn.indexOf("@") < 1){ state.error="Ingresá un email válido para comenzar."; render(); return; }
  if (!codeIn){ state.error="Ingresá el código de verificación que está en el correo de la invitación."; render(); return; }
  if (inv.code && codeIn !== String(inv.code).toUpperCase()){ state.error="El código no es correcto. Revisá el correo de la invitación."; render(); return; }
  if (inv.code && isInterviewUsed(inv.code)){ state.error=null; render(); return; }

  function enter(){
    state.config = {
      position: inv.position||"", company: inv.company||"", focus: inv.focus||"",
      level: inv.level||"Semi-Senior", language: inv.language||"es",
      includeEnglish:false, count:"auto", followups: inv.followups !== false,
      recruiterEmail: inv.recruiterEmail || ""
    };
    rt.analyzed = {}; rt.autoStartedFor = {};
    state.questions = inv.questions.slice();
    state.answers = {}; state.idx = 0; state.report = null; state.audioUrls = {};
    state.code = inv.code || "";
    state.interviewId = inv.id || "";
    state.candidateEmail = emailIn;
    state.candidateName = nameIn;
    state.interviewMode = "candidate";
    state.autoSendState = "idle"; state.autoSendError = null;
    state.micDenied = false;
    markInterviewUsed(inv.code, emailIn); // un solo uso: se marca al ingresar
    state.error = null; state.screen = "interview";
    render();
  }

  // Pedimos permiso de micrófono ahora (con el gesto del botón) para que después
  // cada pregunta pueda grabar sola sin volver a preguntar.
  state.error = null; state.screen = "loading"; render();
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      enter();
    }).catch(function(){
      state.error = "Necesitamos permiso para usar el micrófono. Activalo en el navegador y volvé a tocar “Comenzar entrevista”.";
      state.screen = "invite-landing"; render();
    });
  } else {
    enter();
  }
}

function loadForCandidate(emailRaw, raw){
  var code = (raw||"").toUpperCase().trim();
  var emailIn = (emailRaw||"").trim();
  if (!emailIn){ state.error="Ingresá el email al que te enviaron la invitación."; render(); return; }
  if (!code){ state.error="Ingresá el código."; render(); return; }
  state.error=null; state.screen="loading"; render();
  setTimeout(function(){
    var iv = lget("voz_iv_"+code);
    if (!iv || !iv.questions || !iv.questions.length){ state.error="No encontramos una entrevista con ese código en este navegador."; state.screen="cand-code"; render(); return; }
    if (iv.candidateEmail && !emailsMatch(iv.candidateEmail, emailIn)){
      state.error="Ese email no coincide con el que recibió la invitación para este código."; state.screen="cand-code"; render(); return;
    }
    state.config = { position:iv.position, company:iv.company, focus:iv.focus||"", level:iv.level||"Semi-Senior", language:iv.language||"es", includeEnglish:false, count:"auto", followups: iv.followups !== false };
    rt.analyzed = {};
    state.questions = iv.questions; state.answers = {}; state.idx = 0;
    state.code = code; state.candidateEmail = emailIn; state.interviewMode = "candidate"; state.screen = "interview";
    render();
  }, 350);
}

function loadResults(raw){
  var code = (raw||"").toUpperCase().trim();
  if (!code){ state.error="Ingresá el código."; render(); return; }
  state.error=null; state.screen="loading"; render();
  setTimeout(function(){
    var iv = lget("voz_iv_"+code), ans = lget("voz_ans_"+code);
    if (!iv){ state.error="No encontramos esa entrevista en este navegador."; state.screen="results-code"; render(); return; }
    if (!ans){ state.error="La entrevista existe, pero el candidato todavía no respondió (en este navegador)."; state.screen="results-code"; render(); return; }
    state.config = { position:iv.position, company:iv.company, focus:iv.focus||"", level:iv.level||"Semi-Senior", language:iv.language||"es", includeEnglish:false, count:"auto", followups:true };
    var qs = (ans.questions && ans.questions.length) ? ans.questions : iv.questions;
    var rebuilt = {};
    Object.keys(ans.answers||{}).forEach(function(qid){
      var a = ans.answers[qid];
      rebuilt[qid] = { blobUrl: a.audio || null, transcript: a.transcript || "", signals: a.signals || null };
    });
    state.questions = qs; state.answers = rebuilt; state.report = null; state.code = code; state.audioOmitted = !!ans.audioOmitted;
    state.screen = "review";
    render();
  }, 350);
}

function submitAnswers(){
  state.screen = "submitting"; render();
  var budget = 3200000, used = 0, omitted = false;
  var qs = state.questions.slice();
  var out = {};
  function processNext(i){
    if (i >= qs.length){ finish(); return; }
    var q = qs[i], a = state.answers[q.id];
    if (!a){ processNext(i+1); return; }
    if (a.blobUrl && a.blobUrl.indexOf("blob:")===0){
      fetch(a.blobUrl).then(function(r){ return r.blob(); }).then(function(blob){
        var fr = new FileReader();
        fr.onload = function(){
          var d = fr.result;
          if (used + d.length <= budget){ out[q.id] = { transcript:a.transcript||"", signals:a.signals||null, audio:d }; used += d.length; }
          else { out[q.id] = { transcript:a.transcript||"", signals:a.signals||null, audio:null }; omitted = true; }
          processNext(i+1);
        };
        fr.onerror = function(){ out[q.id] = { transcript:a.transcript||"", signals:a.signals||null, audio:null }; omitted=true; processNext(i+1); };
        fr.readAsDataURL(blob);
      }).catch(function(){ out[q.id] = { transcript:a.transcript||"", signals:a.signals||null, audio:null }; omitted=true; processNext(i+1); });
    } else {
      out[q.id] = { transcript:a.transcript||"", signals:a.signals||null, audio:null };
      processNext(i+1);
    }
  }
  function finish(){
    var strip = qs.map(function(q){ return { id:q.id, text:q.text, category:q.category, seconds:q.seconds, lang:q.lang, isFollowup:!!q.isFollowup, rootId:q.rootId, depth:q.depth||0, reason:q.reason||"" }; });
    lset("voz_ans_"+state.code, { questions: strip, answers: out, submittedAt: Date.now(), audioOmitted: omitted, candidateEmail: state.candidateEmail||"" });
    try{ state.report = evaluateLocally(state.questions, state.answers, state.config); }catch(e){ state.report = null; }
    state.audioOmitted = omitted;
    finalizeCandidate();
  }
  processNext(0);
}

/* Sube audios, pide el análisis con IA, guarda en la base y/o envía por mail. */
function finalizeCandidate(){
  state.autoSendState = "sending"; state.autoSendError = null; state.screen = "cand-autosend"; render();
  uploadAllAudios()
    .then(function(){ return analyzeWithAI().then(function(ai){ state.report = reportFromAI(ai); }).catch(function(){ /* respaldo: análisis local ya calculado */ }); })
    .then(function(){
      // Si los audios no se pudieron subir, dejamos registrado el motivo en el reporte
      // para que se vea en el panel del reclutador.
      if (rt.audioError && (!state.audioUrls || !Object.keys(state.audioUrls).length)){
        state.report = state.report || {}; state.report.audioError = rt.audioError;
      }
      return submitToDB();
    }) // guarda en la base (bool)
    .then(function(dbSaved){
      var hasDB = !!state.interviewId;
      var needsSend = autoSendConfigured();
      var emailP = needsSend ? sendResultsAuto().then(function(){ return true; }).catch(function(){ return false; }) : Promise.resolve(false);
      return emailP.then(function(emailSent){
        var delivered = (hasDB && dbSaved) || emailSent;
        if (delivered){ state.autoSendState = "sent"; state.screen = "cand-done"; render(); }
        else if (!hasDB && !needsSend){ state.autoSendState = "idle"; state.screen = "cand-send"; render(); }
        else { state.autoSendState = "error"; state.autoSendError = { message: "No se pudieron entregar los resultados automáticamente." }; state.screen = "cand-send"; render(); }
      });
    });
}

/* ---- recording ---- */
function pickMime(){
  var types = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"];
  for (var i=0;i<types.length;i++){ if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(types[i])) return types[i]; }
  return "";
}
function startRecording(q){
  state.error=null; state.micDenied=false;
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    rt.stream = stream;
    var mime = pickMime();
    var mr = new MediaRecorder(stream, mime?{mimeType:mime}:undefined);
    rt.chunks = []; rt.activeQ = q; rt.finalText = ""; state.live = "";
    mr.ondataavailable = function(e){ if (e.data.size>0) rt.chunks.push(e.data); };
    mr.onstop = function(){
      var blob = new Blob(rt.chunks, {type: mr.mimeType});
      var url = URL.createObjectURL(blob);
      var qid = rt.activeQ ? rt.activeQ.id : null;
      var dur = (Date.now() - rt.startTime)/1000;
      var s = rt.sig;
      var signals = { longestSilence: +s.longest.toFixed(1), totalSilence: +s.total.toFixed(1), spoke: s.spoke, durationSec: +dur.toFixed(1) };
      if (qid) state.answers[qid] = { blob: blob, blobUrl:url, mime:mr.mimeType, transcript: rt.finalText.trim(), signals: signals };
      if (rt.stream) rt.stream.getTracks().forEach(function(t){ t.stop(); });
      stopMeter();
      render();
    };
    rt.recorder = mr; mr.start();
    startMeter(stream); rt.startTime = Date.now();
    startRecognition(q);
    state.recording = true;
    if (state.interviewMode === "candidate"){
      // El cronómetro ya viene corriendo desde que apareció la pregunta.
      if (!state.qTiming) startQuestionTimer(q);
      render();
    } else {
      // Preview del reclutador: el reloj arranca al grabar.
      state.timeLeft = questionTime(q, false); state.timeTotal = state.timeLeft; state.qTiming = true;
      render(); tick();
    }
  }).catch(function(){ state.micDenied = true; render(); });
}
/* Cronómetro de la pregunta: arranca cuando la pregunta aparece (modo candidato). */
function startQuestionTimer(q){
  clearTimeout(rt.timerId);
  state.timeLeft = questionTime(q, state.interviewMode === "candidate");
  state.timeTotal = state.timeLeft;
  state.qTiming = true;
  render();
  tick();
}
function onQuestionTimeUp(){
  state.qTiming = false;
  var q = state.questions[state.idx];
  if (state.recording){ stopRecorderOnly(); return; } // onstop guarda la respuesta grabada
  if (q && !state.answers[q.id]){
    state.answers[q.id] = { noAnswer:true, transcript:"", signals:{ durationSec:0, longestSilence:0, totalSilence:0, spoke:false } };
  }
  render();
}
function startRecognition(q){
  if (!hasSpeech) return;
  try{
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var r = new SR();
    r.lang = RECOG_LANG[q.lang] || "es-AR"; r.continuous = true; r.interimResults = true;
    r.onresult = function(e){
      var interim = "";
      for (var i=e.resultIndex;i<e.results.length;i++){
        var t = e.results[i][0].transcript;
        if (e.results[i].isFinal) rt.finalText += t + " "; else interim += t;
      }
      state.live = (rt.finalText+interim).trim();
      if (state.recording) render();
    };
    r.onerror = function(){};
    rt.recog = r; r.start();
  } catch(e){}
}
function startMeter(stream){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
    var ctx = new Ctx(); rt.audioCtx = ctx; if (ctx.resume) ctx.resume();
    var src = ctx.createMediaStreamSource(stream);
    var an = ctx.createAnalyser(); an.fftSize = 2048; src.connect(an);
    var buf = new Uint8Array(an.fftSize);
    rt.sig = { longest:0, cur:0, total:0, spoke:false };
    rt.meterId = setInterval(function(){
      an.getByteTimeDomainData(buf);
      var sum=0; for (var i=0;i<buf.length;i++){ var d=(buf[i]-128)/128; sum+=d*d; }
      var rms = Math.sqrt(sum/buf.length), dt=0.1;
      if (rms < 0.02){ rt.sig.cur += dt; rt.sig.total += dt; if (rt.sig.cur > rt.sig.longest) rt.sig.longest = rt.sig.cur; }
      else { rt.sig.cur = 0; rt.sig.spoke = true; }
    }, 100);
  } catch(e){}
}
function stopMeter(){ clearInterval(rt.meterId); try{ if (rt.audioCtx) rt.audioCtx.close(); }catch(e){} rt.audioCtx=null; }
function stopRecorderOnly(){
  try{ if (rt.recorder && rt.recorder.state !== "inactive") rt.recorder.stop(); }catch(e){}
  try{ if (rt.recog) rt.recog.stop(); }catch(e){}
  state.recording = false;
}
function stopRecording(){
  clearTimeout(rt.timerId);
  state.qTiming = false;
  stopRecorderOnly();
}
function tick(){
  clearTimeout(rt.timerId);
  if (!state.qTiming) return;
  if (state.timeLeft <= 0){ onQuestionTimeUp(); return; }
  rt.timerId = setTimeout(function(){ state.timeLeft -= 1; render(); tick(); }, 1000);
}

function maybeFollowup(){
  if (state.screen !== "interview") return;
  var q = state.questions[state.idx];
  if (!q || !state.config.followups) return;
  if ((q.depth||0) >= 2) return;
  var a = state.answers[q.id]; if (!a || !a.blobUrl) return;
  if (rt.analyzed[q.id]) return;
  rt.analyzed[q.id] = true;
  var hasContent = a.transcript && a.transcript.length >= 8;
  var hesitant = isHesitant(a);
  if (!hasContent && !hesitant) return;
  runAnalyze(q, false);
}
function runAnalyze(q, force){
  state.analyzingId = q.id; render();
  setTimeout(function(){
    var a = state.answers[q.id] || {};
    var hesitant = isHesitant(a);
    var m = speechMetrics(a.transcript||"");
    var shortContent = m.words < 10;
    var shouldFollow = force || hesitant || shortContent;
    if (shouldFollow){
      var reasonKind = hesitant && !shortContent ? "delivery" : "content";
      var fu = makeFollowup(q, reasonKind);
      var i = state.questions.findIndex(function(x){ return x.id === q.id; });
      if (i >= 0) state.questions.splice(i+1, 0, fu);
    }
    state.analyzingId = null;
    render();
  }, 900);
}

function reRecord(q){
  var a = state.answers[q.id];
  if (a && a.blobUrl && a.blobUrl.indexOf("blob:")===0) URL.revokeObjectURL(a.blobUrl);
  delete state.answers[q.id];
  startRecording(q);
}
function nextQuestion(){
  if (state.recording) stopRecording();
  if (state.idx < state.questions.length-1){ state.idx += 1; render(); }
  else if (state.interviewMode === "candidate") submitAnswers();
  else { state.screen = "review"; render(); }
}
function evaluate(){
  state.screen = "evaluating"; state.error=null; render();
  function fallback(){
    try{ state.report = evaluateLocally(state.questions, state.answers, state.config); state.screen = "report"; }
    catch(e){ state.error = "No pude generar la evaluación. Probá de nuevo."; state.screen = "review"; }
    render();
  }
  analyzeWithAI().then(function(ai){ state.report = reportFromAI(ai); state.screen = "report"; render(); })
    .catch(function(){ fallback(); });
}

  /* invite landing (candidate opened a shared link) */
  if (document.getElementById("inviteStartBtn")){
    (function(){
      var em = document.getElementById("inviteEmail");
      var cd = document.getElementById("inviteCode");
      var nm = document.getElementById("inviteName");
      if (cd) cd.addEventListener("input", function(){ cd.value = cd.value.toUpperCase().slice(0,8); });
      var go = function(){ startInviteInterview(em ? em.value : "", cd ? cd.value : "", nm ? nm.value : ""); };
      document.getElementById("inviteStartBtn").addEventListener("click", go);
      if (nm) nm.addEventListener("keydown", function(e){ if (e.key==="Enter") go(); });
      if (em) em.addEventListener("keydown", function(e){ if (e.key==="Enter") go(); });
      if (cd) cd.addEventListener("keydown", function(e){ if (e.key==="Enter") go(); });
      if (nm) nm.focus();
    })();
  }

  /* auth screens (Supabase) */
  if (document.getElementById("loginBtn")){
    (function(){
      var em=document.getElementById("authEmail"), pw=document.getElementById("authPass");
      var tsToken="";
      if(captchaConfigured() && document.getElementById("cf-turnstile")){
        ensureTurnstile(function(){
          try{
            window.turnstile.render("#cf-turnstile", {
              sitekey: TURNSTILE_SITE_KEY,
              callback: function(t){ tsToken=t; },
              "expired-callback": function(){ tsToken=""; },
              "error-callback": function(){ tsToken=""; }
            });
          }catch(e){}
        });
      }
      var go=function(){ doLogin(em?em.value:"", pw?pw.value:"", tsToken); };
      document.getElementById("loginBtn").addEventListener("click", go);
      if(pw) pw.addEventListener("keydown",function(e){ if(e.key==="Enter") go(); });
      if(em) em.focus();
    })();
  }
  if (document.getElementById("signupBtn")){
    (function(){
      var em=document.getElementById("authEmail"), pw=document.getElementById("authPass"), pw2=document.getElementById("authPass2");
      var tsToken="";
      if(captchaConfigured() && document.getElementById("cf-turnstile")){
        ensureTurnstile(function(){
          try{
            window.turnstile.render("#cf-turnstile", {
              sitekey: TURNSTILE_SITE_KEY,
              callback: function(t){ tsToken=t; },
              "expired-callback": function(){ tsToken=""; },
              "error-callback": function(){ tsToken=""; }
            });
          }catch(e){}
        });
      }
      var go=function(){
        if(pw&&pw2&&pw.value!==pw2.value){ state.error="Las contraseñas no coinciden."; render(); return; }
        if(captchaConfigured() && !tsToken){ state.error="Completá la verificación de seguridad."; render(); return; }
        doSignup(em?em.value:"", pw?pw.value:"", tsToken);
      };
      document.getElementById("signupBtn").addEventListener("click", go);
      if(pw2) pw2.addEventListener("keydown",function(e){ if(e.key==="Enter") go(); });
      if(em) em.focus();
    })();
  }

  /* code screens */
  if (document.getElementById("codeVal")){
    (function(){
      var codeEl = document.getElementById("codeVal");
      var emailEl = document.getElementById("emailVal");
      codeEl.addEventListener("input", function(){ codeEl.value = codeEl.value.toUpperCase().slice(0,8); });
      var submitCode = function(){
        var v = codeEl.value;
        if (state.screen==="cand-code") loadForCandidate(emailEl ? emailEl.value : "", v);
        else loadResults(v);
      };
      document.getElementById("codeBtn").addEventListener("click", submitCode);
      codeEl.addEventListener("keydown", function(e){ if (e.key==="Enter") submitCode(); });
      if (emailEl) emailEl.addEventListener("keydown", function(e){ if (e.key==="Enter") submitCode(); });
      (emailEl || codeEl).focus();
    })();
  }

  /* share screen */
  function syncMailHref(){ var m=document.getElementById("mailBtn"); if (m) m.setAttribute("href", mailtoHref()); var g=document.getElementById("gmailComposeBtn"); if (g) g.setAttribute("href", gmailComposeHref()); }
  function persistCandidateEmail(){
    if (!state.code) return;
    var iv = lget("voz_iv_"+state.code);
    if (!iv) return;
    iv.candidateEmail = state.candidateEmail || "";
    lset("voz_iv_"+state.code, iv);
  }
  if ((f=document.getElementById("f_email"))) f.addEventListener("input", function(e){ state.candidateEmail=e.target.value; syncMailHref(); persistCandidateEmail(); });
  if ((f=document.getElementById("f_link"))) f.addEventListener("input", function(e){ state.shareLink=e.target.value; syncMailHref(); });

  /* edit questions screen */
  app.querySelectorAll("textarea.q-edit").forEach(function(t){
    t.addEventListener("input", function(){ var i=parseInt(t.getAttribute("data-idx"),10); if(state.questions[i]) state.questions[i].text=t.value; });
  });
  if ((f=document.getElementById("createIvBtn"))) f.addEventListener("click", function(){
    // capturar valores actuales por si acaso
    app.querySelectorAll("textarea.q-edit").forEach(function(t){ var i=parseInt(t.getAttribute("data-idx"),10); if(state.questions[i]) state.questions[i].text=t.value; });
    createInterview();
  });

  /* review screen */
  if ((f=document.getElementById("evalBtn"))) f.addEventListener("click", evaluate);

  /* candidate: the clock starts as soon as the question appears (recording is manual) */
  if (state.screen === "interview" && state.interviewMode === "candidate"){
    var cq = state.questions[state.idx];
    if (cq && !state.answers[cq.id] && !state.qTiming && !rt.autoStartedFor[cq.id]){
      rt.autoStartedFor[cq.id] = true;
      startQuestionTimer(cq);
    }
  }
}

/* ---- marca (white-label) guardada en este navegador ---- */
(function loadBrand(){ try{ var b=lget("voz_brand"); if(b&&(b.name||b.logo)){ state.brand={ name:b.name||"", logo:b.logo||"" }; } }catch(e){} })();
function saveBrand(){ try{ lset("voz_brand", { name:state.brand.name||"", logo:state.brand.logo||"" }); }catch(e){} }

/* ---- entry from a shared invite link (works on any device) ---- */
(function initFromHash(){
  try{
    var h = (window.location && window.location.hash) || "";
    var m = h.match(/[#&]e=([^&]+)/);
    if (!m) return;
    var inv = decodePayload(m[1]);
    if (inv && inv.questions && inv.questions.length){
      state.invite = inv;
      state.screen = "invite-landing";
    }
  } catch(e){}
})();

render();
})();
</script>
