  });
  html += '</div>';
  return html;
};

Screens["cv-newsearch"] = function(){
  var ns = state.newsearch;
  var allcvs = state.cvbank.cvs;
  var folder = ns.folder || "";
  var totalAll = (allcvs!=null) ? allcvs.length : null;
  var filtered = (allcvs!=null) ? allcvs.filter(function(c){ return cvInFolder(c, folder); }) : null;
  var nCv = (filtered!=null) ? filtered.length : null;
  // Chips de carpeta (para elegir qué CVs entran al análisis).
  var folderChips = "";
  if (allcvs && allcvs.length !== undefined){
    var fcounts={}; (allcvs||[]).forEach(function(c){ var f=c.folder||""; fcounts[f]=(fcounts[f]||0)+1; });
    var fnames=Object.keys(fcounts).filter(function(f){ return f!==""; });
    (state.cvbank.folders||[]).forEach(function(fo){ if(fo&&fo.name&&fnames.indexOf(fo.name)<0) fnames.push(fo.name); });
    fnames.sort();
    var fchip=function(key,label,count,isActive){
      return '<button type="button" class="pill-time" data-action="ns-folder" data-f="'+esc(key)+'" style="cursor:pointer;border:none;background:'+(isActive?'var(--teal)':'var(--surface-2)')+';color:'+(isActive?'#fff':'var(--ink)')+';'+(isActive?'font-weight:800':'opacity:.85')+'">'+esc(label)+(count!=null?(' ('+count+')'):'')+'</button>';
    };
    var chipsHtml='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">';
    chipsHtml+=fchip("","Todas las carpetas",totalAll||0,folder==="");
    if(fcounts[""]) chipsHtml+=fchip("__none__","Sin carpeta",fcounts[""],folder==="__none__");
    fnames.forEach(function(f){ chipsHtml+=fchip(f,f,fcounts[f]||0,folder===f); });
    chipsHtml+='</div>';
    folderChips = '<label class="field"><span class="field-label">Carpeta a analizar</span>'+chipsHtml+'<span class="field-hint">Elegí una carpeta para rankear solo esos CVs, o dejá «Todas las carpetas».</span></label>';
  }
  var html = Header();
  html += backlink("go-cvhome","Volver a screening");
  html += '<div class="card">' +
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--teal)">'+ic('plus',18)+'<h2 style="font-size:17px;color:var(--ink)">Nueva búsqueda</h2></div>' +
    '<p style="font-size:13px;color:var(--muted);margin:0 0 18px">Describí el puesto lo más claro posible: la IA va a usar esta descripción para decidir qué CVs encajan mejor.</p>' +
    (state.searches.error2 ? Note("err", esc(state.searches.error2)) : '') +
    '<div style="display:grid;gap:16px">' +
      ((state.jobs.items && state.jobs.items.length) ? (
        '<label class="field" style="background:var(--teal-tint);border-radius:12px;padding:12px 14px"><span class="field-label" style="color:var(--teal)">Copiar de un aviso del portal (opcional)</span>' +
          '<select class="bare" id="f_ns_fromjob">' +
            '<option value="">— No copiar, cargar a mano —</option>' +
            state.jobs.items.map(function(jp){ return '<option value="'+esc(jp.id)+'"'+((ns.fromJob===jp.id)?' selected':'')+'>'+esc(jp.position||'(sin puesto)')+'</option>'; }).join('') +
          '</select>' +
          '<span class="field-hint">Trae automáticamente el puesto, la descripción y los requisitos de ese aviso (y selecciona su carpeta si existe).</span>' +
        '</label>'
      ) : '') +
      folderChips +
      '<label class="field"><span class="field-label">Puesto a cubrir</span>'+fieldInput("f_searchtitle","Ej: Vendedor de mostrador, Desarrollador backend Ssr", ns.title, "briefcase")+'</label>' +
      '<label class="field"><span class="field-label">Descripción del puesto y qué buscás</span>' +
        '<div class="input-row" style="align-items:flex-start"><span style="color:var(--muted);margin-top:2px">'+ic('list',15)+'</span><textarea id="f_searchdesc" rows="5" placeholder="Ej: Buscamos alguien con experiencia en atención al cliente, orientación comercial y trabajo en equipo. Tareas: caja, reposición, asesoramiento.">'+esc(ns.description)+'</textarea></div>' +
        '<span class="field-hint">Descripción general del rol y las tareas.</span>' +
      '</label>' +
      '<label class="field"><span class="field-label" style="color:var(--brick)">Requisitos excluyentes (opcional)</span>' +
        '<div class="input-row" style="align-items:flex-start"><span style="color:var(--brick);margin-top:2px">'+ic('alert',15)+'</span><textarea id="f_searchmust" rows="3" placeholder="Ej: 2+ años en retail presencial. Disponibilidad full time. Secundario completo.">'+esc(ns.must)+'</textarea></div>' +
        '<span class="field-hint">Si un CV no los cumple, la IA lo manda al fondo del ranking (puntaje muy bajo).</span>' +
      '</label>' +
      '<label class="field"><span class="field-label" style="color:var(--green)">Requisitos que suman puntos (opcional)</span>' +
        '<div class="input-row" style="align-items:flex-start"><span style="color:var(--green);margin-top:2px">'+ic('sparkle',15)+'</span><textarea id="f_searchnice" rows="3" placeholder="Ej: Experiencia con sistemas de caja, inglés, manejo de redes sociales.">'+esc(ns.nice)+'</textarea></div>' +
        '<span class="field-hint">No excluyen: suman al puntaje del candidato que los tenga.</span>' +
      '</label>' +
    '</div>' +
    (nCv===0
      ? ((totalAll>0)
          ? Note("info","No hay CVs en esta carpeta. Elegí otra carpeta arriba o subí CVs.") + '<button class="btn btn-ghost btn-block" data-action="go-cvbank" style="margin-top:12px">'+ic('file',15)+' Ir a cargar CVs</button>'
          : Note("info","Todavía no tenés CVs en el repositorio. Cargá algunos primero.") + '<button class="btn btn-ghost btn-block" data-action="go-cvbank" style="margin-top:12px">'+ic('file',15)+' Ir a cargar CVs</button>')
      : '<button class="btn btn-primary btn-block" id="analyzeBtn" style="margin-top:20px" '+(state.searches.analyzing?'disabled':'')+'>'+(state.searches.analyzing?ic('loader',15,'spin')+' Analizando '+ (nCv!=null?nCv:'') +' CVs…':ic('sparkle',15)+' Analizar y rankear'+(nCv!=null?(' ('+nCv+' CVs)'):''))+'</button>') +
  '</div>';
  return html;
};

Screens["cv-ranking"] = function(){
  var x = state.searches.current;
  if(!x) return Header() + Centered(ic('alert',26), "No encontré la búsqueda", "Volvé a screening.");
  var r = Array.isArray(x.results) ? x.results : [];
  var html = Header();
  html += backlink("go-cvhome","Volver a screening");
  html += '<div class="report-hero">' +
    '<div class="report-eyebrow">Búsqueda</div>' +
    '<h2 style="font-size:20px;margin:6px 0 0">'+esc(x.title||'(sin título)')+'</h2>' +
    (x.description?'<p style="margin-top:10px;font-size:13px;opacity:.85;line-height:1.6">'+esc(x.description)+'</p>':'') +
    (x.must_have?'<p style="margin-top:8px;font-size:12px;opacity:.85"><strong>Excluyentes:</strong> '+esc(x.must_have)+'</p>':'') +
    (x.nice_to_have?'<p style="margin-top:4px;font-size:12px;opacity:.85"><strong>Suman:</strong> '+esc(x.nice_to_have)+'</p>':'') +
    '<p style="margin-top:10px;font-size:11.5px;opacity:.6">'+(r.length?(r.length+' candidatos · analizado '+esc(fmtDate(x.analyzed_at))):'Sin analizar')+'</p>' +
  '</div>';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px">' +
    '<button class="btn btn-ghost btn-sm" data-action="reanalyze" '+(state.searches.analyzing?'disabled':'')+'>'+(state.searches.analyzing?ic('loader',14,'spin')+' Analizando…':ic('rotate',14)+' Re-analizar con los CVs actuales')+'</button>' +
    '<button class="btn btn-ghost btn-sm" data-action="del-search" data-id="'+esc(x.id)+'">'+ic('trash',14)+' Eliminar búsqueda</button>' +
  '</div>';
  if (state.searches.error2) html += Note("err", esc(state.searches.error2));
  if (state.searches.note) html += Note("info", esc(state.searches.note));
  if (!r.length){ html += '<div class="center-block" style="padding:24px 12px">'+ic('alert',24)+'<p>Esta búsqueda no tiene ranking todavía. Tocá "Re-analizar".</p></div>'; return html; }
  var sel = state.searches.rankSel || [];
  html += '<p style="font-size:12.5px;color:var(--muted);margin:0 0 12px">Tocá <b>Elegir</b> en varios candidatos para invitarlos a todos juntos (a cada uno le llega su propio mail con el CV reconocido), o usá <b>Invitar</b> para uno solo.</p>';
  // Dejamos espacio abajo para que la barra fija de acción no tape la última tarjeta.
  html += '<div style="display:grid;gap:12px'+(sel.length?';padding-bottom:84px':'')+'">';
  r.forEach(function(c, i){
    var sc = (typeof c.score==='number')?c.score:0;
    var pros = Array.isArray(c.pros)?c.pros:[];
    var cons = Array.isArray(c.cons)?c.cons:[];
    var isSel = (c.id && sel.indexOf(c.id)>=0);
    var pickBtn = c.id
      ? '<button type="button" data-action="rank-toggle" data-cvid="'+esc(c.id)+'" title="Elegir para invitar a varios" style="flex-shrink:0;display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:11px 18px;font-size:14px;font-weight:800;cursor:pointer;transition:all .12s;border:2px solid '+(isSel?'var(--green)':'var(--teal)')+';box-shadow:0 2px 8px rgba(0,0,0,.18);'+(isSel?'background:var(--green);color:#fff':'background:var(--teal);color:#fff')+'">'+(isSel?ic('check',16)+' Elegido':ic('plus',16)+' Elegir')+'</button>'
      : '';
    html += '<div class="qa-item"'+(isSel?' style="border:2px solid var(--teal);background:var(--teal-tint)"':'')+'>' +
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
        pickBtn +
        '<span class="mono" style="flex-shrink:0;width:22px;text-align:center;font-weight:800;font-size:15px;color:var(--muted)">'+(i+1)+'</span>' +
        '<span style="flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;background:'+fitTintVar(sc)+';color:'+fitColorVar(sc)+'" class="mono">'+sc+'</span>' +
        '<div style="flex:1;min-width:80px">' +
          '<p style="margin:0;font-weight:700;font-size:14.5px;color:var(--ink)">'+esc(c.name||('Candidato '+(i+1)))+'</p>' +
          '<p style="margin:1px 0 0;font-size:12px;color:'+fitColorVar(sc)+';font-weight:600">Encaje '+esc(c.fit||'')+(isSel?' · <span style="color:var(--teal)">✓ elegido</span>':'')+'</p>' +
        '</div>' +
        '<button class="btn btn-primary btn-sm" data-action="invite-from-cv" data-pos="'+esc(x.title||'')+'" data-cvid="'+esc(c.id||'')+'" style="flex-shrink:0">'+ic('mic',13)+' Invitar</button>' +
      '</div>' +
      (c.summary?'<p style="margin:10px 0 0;font-size:13px;color:var(--ink);line-height:1.5">'+esc(c.summary)+'</p>':'') +
      ((pros.length||cons.length)?'<div class="grid2" style="margin-top:10px;gap:10px">' +
        (pros.length?'<div>'+ReportList("A favor", pros, "var(--green)")+'</div>':'') +
        (cons.length?'<div>'+ReportList("En contra", cons, "var(--brick)")+'</div>':'') +
      '</div>':'') +
    '</div>';
  });
  html += '</div>';
  // Barra de acción FIJA abajo (siempre visible mientras haya candidatos elegidos).
  if (sel.length){
    html += '<div style="position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -6px 20px rgba(0,0,0,.18)">' +
      '<div style="max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px">' +
        '<span style="flex:1;min-width:110px;font-size:13.5px;color:var(--ink);font-weight:700">'+sel.length+' candidato'+(sel.length===1?'':'s')+' elegido'+(sel.length===1?'':'s')+'</span>' +
        '<button class="btn btn-ghost btn-sm" data-action="rank-clear-sel">Limpiar</button>' +
        '<button class="btn btn-primary btn-sm" data-action="rank-invite-sel" data-pos="'+esc(x.title||'')+'">'+ic('mic',14)+' Invitar '+(sel.length===1?'al elegido':('a los '+sel.length))+'</button>' +
      '</div>' +
    '</div>';
  }
  return html;
};

    (job.must_have?'<div style="margin-bottom:16px"><h3 style="font-size:14px;color:var(--brick);margin:0 0 6px">Requisitos excluyentes</h3><p style="font-size:13.5px;color:var(--ink);line-height:1.6;white-space:pre-wrap">'+esc(job.must_have)+'</p></div>':'') +
    (job.nice_to_have?'<div style="margin-bottom:16px"><h3 style="font-size:14px;color:var(--green);margin:0 0 6px">Suman puntos</h3><p style="font-size:13.5px;color:var(--ink);line-height:1.6;white-space:pre-wrap">'+esc(job.nice_to_have)+'</p></div>':'') +
    (job.benefits?'<div style="margin-bottom:16px"><h3 style="font-size:14px;color:var(--teal);margin:0 0 6px">Beneficios</h3><p style="font-size:13.5px;color:var(--ink);line-height:1.6;white-space:pre-wrap">'+esc(job.benefits)+'</p></div>':'') +

/* Encabezado simple para las pantallas públicas del portal (con marca del reclutador si hay). */

Screens["interview-detail"] = function(){
  var x = state.dash.detail;
  if (!x) return Header() + Centered(ic('alert',26), "No encontré la entrevista", "Volvé al panel.");
  var sc = (typeof x.score==='number')?x.score:null;
  var r = x.report || {};
  var answers = Array.isArray(x.answers) ? x.answers : [];
  var html = Header();
  html += backlink("go-recruiterhome","Volver al panel");
  html += '<div class="report-hero">' +
    '<div class="report-eyebrow">'+esc(x.candidate_name||'(sin nombre)')+' · '+esc(x.position||'')+'</div>' +
    '<div style="display:flex;align-items:flex-end;gap:14px;margin-top:8px;flex-wrap:wrap">' +
      (sc!=null?'<div class="report-score">'+sc+'<span style="font-size:20px;opacity:.6">/10</span></div>':'') +
      (x.recommendation?'<span class="rec-tag" style="background:'+verdictColor(x.recommendation)+';color:#fff;border:none">'+esc(x.recommendation)+'</span>':'') +
    '</div>' +
    (r.overall?'<p style="margin-top:14px;font-size:13.5px;opacity:.85;line-height:1.6">'+esc(r.overall)+'</p>':'') +
    '<p style="margin-top:10px;font-size:11.5px;opacity:.6">'+esc(x.candidate_email||'')+' · '+esc(fmtDate(x.completed_at))+(x.report&&x.report.consent&&x.report.consent.accepted?' · ✓ consentimiento aceptado'+(x.report.consent.at?(' ('+esc(fmtDate(x.report.consent.at))+')'):''):'')+'</p>' +
  '</div>';
  html += '<div class="grid2" style="margin-top:16px">' + ReportList("Fortalezas", r.strengths, "var(--green)") + ReportList("A mejorar", r.improve, "var(--amber)") + '</div>';
  html += LanguageBox(r.language);
  if (r.probes && r.probes.length) html += '<div style="margin-top:16px">'+ReportList("Repreguntas sugeridas", r.probes, "var(--teal)")+'</div>';
  var perMap = {}; if (r.perQuestion) r.perQuestion.forEach(function(p){ if(p&&p.n!=null) perMap[p.n]=p; });
  html += '<div style="display:flex;align-items:center;gap:8px;margin:20px 0 10px;color:var(--teal)">'+ic('mic',18)+'<h3 style="font-size:15px;color:var(--ink)">Respuestas</h3></div>';
  if (r && r.audioError) html += Note("warn","Los audios de esta entrevista no se pudieron guardar (se muestra la transcripción). Diagnóstico: "+esc(r.audioError));
  html += '<div style="display:grid;gap:12px">';
  answers.forEach(function(a){
    var p = perMap[a.n];
    var pScore = (p && typeof p.score==="number") ? p.score : null;
    var label = a.isFollowup ? 'Repregunta' : ('Pregunta '+esc(String(a.n||'')));
    html += '<div class="qa-item"'+(a.isFollowup?' style="border-left:3px solid var(--purple);background:var(--purple-tint)"':'')+'>' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
        (pScore!=null?'<span class="mono" style="flex-shrink:0;min-width:40px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:'+scoreTintVar(pScore)+';color:'+scoreColorVar(pScore)+'">'+pScore+'<span style="font-size:9px;opacity:.6">/10</span></span>':'') +
        '<p style="margin:0;font-size:12px;font-weight:700;color:'+(a.isFollowup?'var(--purple)':'var(--muted)')+'">'+label+'</p>' +
      '</div>' +
      '<p class="qa-text" style="margin-top:6px">'+esc(a.text||'')+'</p>' +
      (a.audio ? '<audio controls src="'+esc(a.audio)+'" style="width:100%;margin-top:8px"></audio>' : '') +
      (p&&p.assessment ? '<p style="margin:8px 0 0;font-size:13px;color:var(--ink)"><strong style="color:var(--muted)">IA:</strong> '+esc(p.assessment)+'</p>' : '') +
      (!a.audio && a.transcript ? '<p style="margin:8px 0 0;font-size:13px;color:var(--muted)">'+esc(a.transcript)+'</p>' : '') +
    '</div>';
  });
  html += '</div>';
  return html;
};

Screens["bulk-result"] = function(){
  var b = state.bulk;
  var html = Header();
  html += backlink("go-recruiterhome","Volver al panel");
  html += '<div class="card">';
  if (b.error){
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--brick)">'+ic('alert',20)+'<h2 style="font-size:18px;color:var(--ink)">No pude completar el envío</h2></div>';
    html += Note("err", esc(b.error));
  } else {
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--teal)">'+ic('check',22)+'<h2 style="font-size:18px;color:var(--ink)">Envío masivo listo</h2></div>';
    var pending = (b.results||[]).filter(function(r){ return r.status==="pending"; }).length;
    var parts = [];
    parts.push('<b>'+b.sent+'</b> mail(s) enviado(s)');
    if (pending) parts.push('<b>'+pending+'</b> entrevista(s) creada(s) sin enviar');
    if (b.failed) parts.push('<b>'+b.failed+'</b> con error de envío');
    if (b.noEmail) parts.push('<b>'+b.noEmail+'</b> sin email (omitidos)');
    html += '<p style="font-size:13.5px;color:var(--muted);margin:0 0 14px">'+parts.join(' · ')+'. Cada entrevista quedó guardada en tu panel.</p>';

/* ---------------- análisis con IA (Gemini vía función serverless /api/analyze) ---------------- */
var AI_ANALYZE_ENDPOINT = "/api/analyze";
function analyzeWithAI(){
  // Mapa id -> número de pregunta (para vincular cada repregunta con su pregunta madre).
  var idToN = {}; state.questions.forEach(function(q,i){ idToN[q.id] = i+1; });
  var payload = {
    position: state.config.position, company: state.config.company, focus: state.config.focus,
    level: state.config.level, language: state.config.language,
    questions: state.questions.map(function(q,i){
      var a = state.answers[q.id] || {};
      var isFu = !!q.isFollowup;
      return { n:i+1, text:q.text, category:q.category, lang:q.lang||"es", transcript:(a.transcript||""), durationSec:(a.signals&&a.signals.durationSec)||0,
               isFollowup:isFu, parentN: isFu ? (idToN[q.rootId]||null) : null };
    })
  };
  return fetch(AI_ANALYZE_ENDPOINT, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j && j.ok && j.analysis) return j.analysis; throw new Error((j && j.error) || "sin_analisis"); });
}
/* ---- Transcripción por IA del audio (server-side): más confiable y multi-idioma que
   la del navegador. Solo REEMPLAZA la transcripción si la IA devuelve texto; si falla
   o viene vacía, se conserva lo que hubiera (no rompe el flujo). ---- */
function blobToBase64(blob){
  return new Promise(function(resolve){
    try{
      var fr = new FileReader();
      fr.onload = function(){ var s = String(fr.result||""); var i = s.indexOf(","); resolve(i>=0 ? s.slice(i+1) : ""); };
      fr.onerror = function(){ resolve(""); };
      fr.readAsDataURL(blob);
    }catch(e){ resolve(""); }
  });
}
function transcribeOneAI(q){
  var a = state.answers[q.id];
  if (!a) return Promise.resolve();
  var getBlob = (typeof Blob!=="undefined" && a.blob instanceof Blob) ? Promise.resolve(a.blob)
    : (a.blobUrl && a.blobUrl.indexOf("blob:")===0 ? fetch(a.blobUrl).then(function(r){ return r.blob(); }).catch(function(){ return null; }) : Promise.resolve(null));
  return getBlob.then(function(blob){
    if (!blob) return;
    return blobToBase64(blob).then(function(b64){
      if (!b64) return;
      var mime = (blob.type||"audio/webm").split(";")[0];
      return withTimeout(
        fetch(AI_ANALYZE_ENDPOINT, { method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ task:"transcribe", language:(q.lang||state.config.language||"es"), audio:{ data:b64, mimeType:mime } }) })
          .then(function(r){ return r.json(); }), 30000)
        .then(function(j){ if (j && j.ok && j.transcript && j.transcript.trim()){ state.answers[q.id].transcript = j.transcript.trim(); state.answers[q.id].aiTranscribed = true; } })
        .catch(function(){});
    });
  }).catch(function(){});
}
/* Transcribe (en paralelo) todas las respuestas que tengan audio. Best-effort. */
function transcribeAnswersWithAI(){
  var qs = state.questions.filter(function(q){ var a=state.answers[q.id]; return a && ((typeof Blob!=="undefined" && a.blob instanceof Blob) || (a.blobUrl && a.blobUrl.indexOf("blob:")===0)); });
  if (!qs.length) return Promise.resolve();
  return Promise.all(qs.map(function(q){ return transcribeOneAI(q); }));
}
function generateQuestions(){
  var c = state.config;
  var target = c.count === "auto" ? (c.level==="Junior"?7:c.level==="Senior"?8:c.level==="Gerencial"?9:7) : (parseInt(c.count,10)||7);
  var payload = { task:"questions", position:c.position, company:c.company, focus:c.focus, companyUrl:(c.companyUrl||""), level:c.level, language:c.language, count:target, includeEnglish: !!c.includeEnglish };
  if (rt.cvText && rt.cvText.length > 40) payload.cvText = rt.cvText;
  else if (rt.cvData && rt.cvData.data) payload.cv = { data: rt.cvData.data, mimeType: rt.cvData.mimeType };
  return fetch(AI_ANALYZE_ENDPOINT, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })

}
function mapAIQuestions(list, lang){
  return list.slice(0,14).map(function(q,i){
    var cat = q.category || "Experiencia";
    if (!SECONDS_BY_CAT[cat]) cat = "Experiencia";

/* Veredicto general 1-10 -> etiqueta y color. */
function verdictFromScore(sc){ sc=Number(sc)||0; return sc>=7 ? "Aprobado" : sc>=5 ? "Medio" : "Desaprobado"; }
function verdictColor(v){ v=(v||"").toLowerCase();
  if(v.indexOf("desaprob")>=0 || v.indexOf("no avanzar")>=0) return "var(--brick)";
  if(v.indexOf("medio")>=0 || v.indexOf("reserva")>=0) return "var(--amber)";
  if(v.indexOf("aprob")>=0 || v.indexOf("avanzar")>=0) return "var(--green)";
  return "var(--muted)";
}
function reportFromAI(ai){
  function arr(x){ return Array.isArray(x) ? x.filter(function(v){ return v!=null && String(v).trim(); }).map(String) : []; }
  var sc = Number(ai.score); if (!(sc>=1 && sc<=10)) sc = 1; sc = Math.round(sc*2)/2;
  var per = Array.isArray(ai.perQuestion) ? ai.perQuestion.map(function(p){
    var ps = Number(p.score); ps = (ps>=1 && ps<=10) ? Math.round(ps*2)/2 : null;
    return { n:p.n, score:ps, rating:String(p.rating||""), assessment:String(p.assessment||"") };
  }) : [];
  return {
    score: sc,
    recommendation: String(ai.veredicto || ai.recommendation || verdictFromScore(sc)),
    overall: String(ai.overall||""),
    strengths: arr(ai.strengths),
    improve: arr(ai.improve),
    probes: arr(ai.probes),
    perQuestion: per,
    language: (ai.language && typeof ai.language==="object") ? {
      lang: String(ai.language.lang||""),
      level: String(ai.language.level||""),
      answeredInLanguage: ai.language.answeredInLanguage,
      comment: String(ai.language.comment||"")
    } : null,
    ai: true
  };
}

/* ---------------- audios: subida a Cloudinary (unsigned, sin backend) ----------------
   Completá estos dos datos de tu cuenta gratuita de Cloudinary para que los audios
   del candidato se suban y te lleguen como enlaces para escuchar. Si quedan vacíos,
   el mail cae a la transcripción como respaldo. */
var CLOUDINARY_CLOUD_NAME = "memtugeu";
var CLOUDINARY_UPLOAD_PRESET = "ml_default";
function audioUploadConfigured(){ return !!(CLOUDINARY_CLOUD_NAME && CLOUDINARY_UPLOAD_PRESET); }
function uploadAudioToCloudinary(blob){
  var fd = new FormData();
  fd.append("file", blob);
  fd.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  return fetch("https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/auto/upload", { method:"POST", body: fd })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j && j.secure_url) return j.secure_url; throw new Error((j && j.error && j.error.message) || "Falló la subida del audio"); });
}
/* Sube todos los audios grabados y guarda las URLs en state.audioUrls (best-effort). */
function uploadAllAudios(){
  rt.audioError = "";
  if (!audioUploadConfigured()) { rt.audioError = "Cloudinary no está configurado para subir audios."; return Promise.resolve(); }
  var qs = state.questions.slice();
  var chain = Promise.resolve();
  state.audioUrls = state.audioUrls || {};
  qs.forEach(function(q){
    var a = state.answers[q.id];
    if (!a) return;
    var hasBlob = (typeof Blob !== "undefined") && (a.blob instanceof Blob);
    var hasUrl = a.blobUrl && a.blobUrl.indexOf("blob:") === 0;
    if (!hasBlob && !hasUrl) return;
    chain = chain.then(function(){
      // Preferimos el Blob en memoria (más robusto: Safari a veces pierde la blob: URL).
      var getBlob = hasBlob ? Promise.resolve(a.blob) : fetch(a.blobUrl).then(function(r){ return r.blob(); });
      return getBlob.then(function(blob){
        var ext = /mp4/.test(blob.type) ? ".mp4" : /ogg/.test(blob.type) ? ".ogg" : ".webm";
        // Nombre GLOBALMENTE único: entrevista + pregunta + tiempo + azar.
        // Antes se usaba "respuesta-q0" fijo, y una entrevista pisaba los audios de otra.
        var uniq = (state.code || "iv") + "-" + q.id + "-" + Date.now().toString(36) + "-" + Math.floor(Math.random()*1e9).toString(36);
        var named = blob;
        try{ named = new File([blob], "resp-"+uniq+ext, { type: blob.type || "audio/webm" }); }catch(e){}
        return uploadAudioToCloudinary(named).then(function(url){ state.audioUrls[q.id] = url; })
          .catch(function(e){ if(!rt.audioError) rt.audioError = (e && e.message) || "Falló la subida del audio."; });
      }).catch(function(e){ if(!rt.audioError) rt.audioError = (e && e.message) || "No pude leer el audio grabado."; });
    });
  });
  return chain;
}

    '</svg>';
  var canReRecord = isCandidate && answered && state.qTiming && !state.recording;

    html += '<button class="rec-btn rec-active" data-action="stop-rec">'+ic('square',18)+'<span style="font-size:12px;font-weight:700">Detener</span><span class="mono" id="recCount" style="font-size:13px;font-weight:600">'+fmt(state.timeLeft)+'</span></button>';

    html += '<div class="rec-btn rec-done">'+ic('check',24)+'<span style="font-size:12px;font-weight:600">Grabado</span></div>';

    html += '<div class="rec-btn rec-done" style="color:var(--brick)">'+ic('alert',24)+'<span style="font-size:11px;font-weight:600">Sin respuesta</span></div>';
  } else if (state.micDenied){
    html += '<button class="rec-btn rec-idle" data-action="retry-rec" style="color:var(--brick)">'+ic('mic',22)+'<span style="font-size:11px;font-weight:600">Reintentar</span></button>';
  } else {
    html += '<button class="rec-btn rec-idle" data-action="start-rec">'+ic('mic',22)+'<span style="font-size:12px;font-weight:600">Grabar</span></button>';
  }
  html += '</div>';
  // Reloj visible (el tiempo corre desde que apareció la pregunta y no se frena al detener)
  if (state.qTiming && !state.recording && !timedOut){
    html += '<p class="rec-hint" id="recHint" style="font-weight:700;color:'+(overtime?'var(--brick)':'var(--ink)')+'"><span class="mono" id="recRemain">'+fmt(state.timeLeft)+'</span> restantes'+(answered?'':' — tocá <strong>Grabar</strong> cuando estés listo')+'</p>';
  }
  var hintTxt;
  if (state.recording) hintTxt = isCandidate ? "Estás grabando. Cuando termines de responder, tocá el botón <strong>Detener</strong>." : "Grabando… tocá el cuadrado para terminar antes.";
  else if (answered) hintTxt = canReRecord ? "Grabaste tu respuesta. Si te equivocaste, tocá <strong>Eliminar y grabar de nuevo</strong> — ojo, el tiempo sigue corriendo." : (isCandidate ? "Respuesta guardada. Continuá con la siguiente pregunta." : "Podés escuchar tu respuesta o volver a grabar.");

  else if (state.micDenied) hintTxt = "Necesitamos el micrófono para grabar. Dale permiso al navegador y tocá Reintentar.";
  else if (isCandidate) hintTxt = "El tiempo ya corre. Leé y pensá la respuesta; cuando estés listo, tocá <strong>Grabar</strong>. Mientras quede tiempo podés eliminar y grabar de nuevo.";
  else hintTxt = "Tocá el micrófono y el cronómetro arranca. Se corta solo al llegar a 0.";

  if (answer && answer.blobUrl && !state.recording && !isCandidate){
    html += '<div class="transcript-box"><audio controls src="'+esc(answer.blobUrl)+'"></audio>';
    if (answer.transcript) html += '<div style="margin-top:12px"><div class="transcript-label">'+ic('msg',12)+' Transcripción aproximada</div><p style="margin:0;font-size:13.5px">'+esc(answer.transcript)+'</p></div>';
    html += '</div>';
  }
  if (state.recording) html += '<div id="liveBox" class="transcript-box" style="margin-top:12px;color:var(--muted);'+(state.live?'':'display:none')+'">'+esc(state.live)+'</div>';
  html += '</div>';

  html += '<div class="flex-actions">';
  if (answer && answer.blobUrl && !state.recording){
    if (!isCandidate) html += '<button class="btn btn-ghost btn-sm" data-action="re-record">'+ic('rotate',14)+' Volver a grabar</button>';
    else if (state.qTiming) html += '<button class="btn btn-ghost btn-sm" data-action="re-record" style="color:var(--brick)">'+ic('trash',14)+' Eliminar y grabar de nuevo</button>';
  }
  var showNext = isCandidate ? (answered || timedOut) : true;
  if (showNext) html += '<button class="btn btn-primary" data-action="next-q" style="margin-left:auto">' +
    (state.idx < total-1 ? "Siguiente pregunta "+ic('chevron',15) : esc(lastLabel)+" "+ic('chevron',15)) +
  '</button>';
  html += '</div>';
  return html;
};

  attempt(row).catch(function(){ return attempt(slim); }).then(function(saved){

function todayISO(){ try{ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }catch(e){ return null; } }

/* ---- Módulo 2 · Asistencia y horarios ---- */
function hmToMin(hm){ var m=/^(\d{1,2}):(\d{2})/.exec(String(hm||"").trim()); if(!m) return null; return parseInt(m[1],10)*60+parseInt(m[2],10); }
function tsDayKey(ts){ try{ var d=new Date(ts); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }catch(e){ return ""; } }
function tsHM(ts){ try{ var d=new Date(ts); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }catch(e){ return ""; } }
function tsMinOfDay(ts){ try{ var d=new Date(ts); return d.getHours()*60+d.getMinutes(); }catch(e){ return null; } }
function dayWeekNum(dayStr){ try{ var p=dayStr.split("-"); var d=new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)); var wd=d.getDay(); return wd===0?7:wd; }catch(e){ return null; } } // 1=Lun..7=Dom
function parseYMD(str){ try{ var p=String(str).split("-"); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)); }catch(e){ return null; } }
function rotationWeekIndex(startStr, dayStr, len){
  try{ var s=parseYMD(startStr), d=parseYMD(dayStr); if(!s||!d||!len) return 0; var diff=Math.floor((d.getTime()-s.getTime())/(24*3600*1000)); var wk=Math.floor(diff/7); wk=((wk%len)+len)%len; return wk; }catch(e){ return 0; }
}
/* Devuelve el turno vigente de un empleado para una fecha: {in, out, days}. Soporta rotativo. */
function effectiveShift(e, dayStr){
  if((e.schedule_type||"fijo")==="rotativo" && Array.isArray(e.rotation) && e.rotation.length && e.rotation_start){
    var wk=rotationWeekIndex(e.rotation_start, dayStr, e.rotation.length);
    var r=e.rotation[wk]||e.rotation[0]||{};
    return { in:(r.in||""), out:(r.out||""), days:String(r.days||"") };
  }
  return { in:(e.shift_in||""), out:(e.shift_out||""), days:String(e.work_days||"") };
}
function fmtMinDur(min){ if(min==null) return "—"; min=Math.max(0,Math.round(min)); var h=Math.floor(min/60), m=min%60; return h+"h "+("0"+m).slice(-2)+"m"; }
var MONTH_NAMES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
var DOW_NAMES=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
function monthKey(ts){ try{ var d=new Date(ts); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2); }catch(e){ return ""; } }
function monthLabel(mk){ try{ var p=mk.split("-"); return MONTH_NAMES[parseInt(p[1],10)-1]+" "+p[0]; }catch(e){ return mk; } }
function dayLabel(dk){ try{ var p=dk.split("-"); var d=new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10)); return DOW_NAMES[d.getDay()]+" "+p[2]+"/"+p[1]; }catch(e){ return dk; } }

/* Resumen del día: por cada empleado, primera entrada / última salida / horas / estado. */
function asistDaySummary(dayArg){
  var day=dayArg||state.asist.day||todayISO();
  var punches=(state.asist.items||[]).filter(function(p){ return tsDayKey(p.punched_at)===day; });
  var emps=state.emp.items||[];
  var empById={}; emps.forEach(function(e){ empById[e.id]=e; });
  var groups={};
  punches.forEach(function(p){
    var key=p.employee_id||("n:"+(p.name_entered||"")+"|"+(p.legajo_number||""));
    if(!groups[key]) groups[key]={ emp: p.employee_id?empById[p.employee_id]:null, name:(p.employee_id&&empById[p.employee_id]?empFullName(empById[p.employee_id]):(p.name_entered||"(sin nombre)")), legajo:(p.legajo_number||""), matched:!!p.employee_id, entradas:[], salidas:[] };
    if(p.type==="entrada") groups[key].entradas.push(p); else if(p.type==="salida") groups[key].salidas.push(p);
  });
  var wd=dayWeekNum(day);
  var rows=Object.keys(groups).map(function(k){
    var g=groups[k];
    g.entradas.sort(function(a,b){ return new Date(a.punched_at)-new Date(b.punched_at); });
    g.salidas.sort(function(a,b){ return new Date(a.punched_at)-new Date(b.punched_at); });
    var entrada=g.entradas[0]||null; var salida=g.salidas[g.salidas.length-1]||null;
    var workedMin=null; if(entrada&&salida){ workedMin=(new Date(salida.punched_at)-new Date(entrada.punched_at))/60000; }
    var late=null, extra=null, estadoKind=null, hasShiftIn=false, early=null;
    var e=g.emp;
    if(e){
      var eff=effectiveShift(e, day);
      var si=hmToMin(eff.in), so=hmToMin(eff.out), tol=parseInt(e.tolerance_min,10); if(isNaN(tol)) tol=5;
      if(si!=null) hasShiftIn=true;
      if(entrada&&si!=null){ var em=tsMinOfDay(entrada.punched_at); if(em!=null){ if(em>si+tol){ late=em-si; estadoKind="tarde"; } else { estadoKind="atiempo"; } } }
      if(workedMin!=null&&si!=null&&so!=null){ var sched=so-si; if(sched>0 && workedMin>sched+15) extra=workedMin-sched; }
      // Salida temprana: la última salida ocurrió antes del horario de salida (con 5 min de gracia).
      if(salida&&so!=null){ var sm=tsMinOfDay(salida.punched_at); if(sm!=null && sm < so-5){ early={ min: so-sm, salidaId: salida.id, justification:(salida.justification||"") }; } }
    }
    var lateInfo=(estadoKind==="tarde"&&entrada)?{ min:late, entradaId:entrada.id, justification:(entrada.justification||"") }:null;
    return { name:g.name, legajo:g.legajo, matched:g.matched, entrada:entrada, salida:salida, workedMin:workedMin, late:late, extra:extra, estadoKind:estadoKind, hasShiftIn:hasShiftIn, early:early, lateInfo:lateInfo, punches:g.entradas.length+g.salidas.length };
  });
  // Ausentes: empleados activos cuyo día laborable es hoy y no ficharon.
  var presentIds={}; Object.keys(groups).forEach(function(k){ if(groups[k].emp) presentIds[groups[k].emp.id]=true; });
  var absent=[];
  if(wd){
    emps.forEach(function(e){
      if((e.status||"activo")!=="activo") return;
      var wdays=String(effectiveShift(e, day).days||"").split(",").map(function(s){return s.trim();});
      if(wdays.indexOf(String(wd))>=0 && !presentIds[e.id]) absent.push(e);
    });
  }
  return { rows:rows, absent:absent, day:day, count:punches.length };
}

function captureFichadorPhoto(){
  return new Promise(function(resolve){
    try{
      var v=document.getElementById("ficamvideo");
      if(!v || !rt.camStream){ resolve(null); return; }
      var tries=0;
      var grab=function(){
        if(v.videoWidth && v.videoHeight){
          try{
            var cv=document.createElement("canvas"); cv.width=Math.min(640,v.videoWidth); cv.height=Math.round(cv.width*(v.videoHeight/v.videoWidth));
            cv.getContext("2d").drawImage(v,0,0,cv.width,cv.height);
            cv.toBlob(function(blob){ resolve(blob||null); }, "image/jpeg", 0.82);
          }catch(e){ resolve(null); }
          return;
        }
        // El video puede tardar un instante en tener imagen; reintentamos un rato.
        if(tries++ < 15){ setTimeout(grab, 130); } else { resolve(null); }
      };
      grab();
    }catch(e){ resolve(null); }
  });
}
function doFichar(type){

  }).catch(function(){ f.sending=false; f.error="No pudimos conectar. Revisá tu conexión."; render(); });

function saveMovement(){
  var a=state.abm; if(!a||!a.emp) return; var f=a.form;
  var e=a.emp;
  var type=f.type;
  // Validación mínima por tipo.
  if((type==="cambio_puesto"||type==="ascenso") && !(f.to||"").trim() && !(f.to2||"").trim()){ f.error="Indicá el nuevo puesto o la nueva categoría."; render(); return; }
  if(type==="cambio_salarial" && !(f.to||"").trim()){ f.error="Indicá el nuevo salario."; render(); return; }
  if(type==="baja" && !(f.reason||"").trim()){ f.error="Elegí el motivo de la desvinculación."; render(); return; }
  f.saving=true; f.error=""; render();
  var mov={ employee_id:a.empId, type:type, effective_date:(f.date||todayISO()), notes:(f.notes||"").trim() };
  var empPatch=null;
  if(type==="cambio_puesto"||type==="ascenso"){
    mov.from_value=e.position||""; mov.to_value=(f.to||"").trim()||e.position||"";
    var parts=[]; if((f.to||"").trim()) parts.push("Puesto: "+(e.position||"—")+" → "+f.to.trim());
    if((f.to2||"").trim()) parts.push("Categoría: "+(e.category||"—")+" → "+f.to2.trim());
    mov.description=(MOV_TYPES[type].label)+(parts.length?" · "+parts.join(" · "):"");
    empPatch={}; if((f.to||"").trim()) empPatch.position=f.to.trim(); if((f.to2||"").trim()) empPatch.category=f.to2.trim();
  } else if(type==="cambio_salarial"){
    mov.from_value=e.salary||""; mov.to_value=(f.to||"").trim();
    mov.description="Cambio salarial: "+(e.salary||"—")+" → "+f.to.trim();
    empPatch={ salary:f.to.trim() };
  } else if(type==="baja"){
    mov.reason=(f.reason||"").trim(); mov.to_value="inactivo";
    mov.description="Baja · "+mov.reason;
    empPatch={ status:"inactivo", termination_date:(f.date||todayISO()), termination_reason:mov.reason };
  }
  dbCreateMovement(mov).then(function(saved){
    // Actualizamos la ficha del empleado según el movimiento (best-effort, resiliente).
    function done(){
      a.form=emptyMovForm(); a.msg="Movimiento registrado."; a.movements=null; state.emp.items=null;
      // refrescamos el empleado en memoria
      dbListEmployees().then(function(items){ state.emp.items=items; var ne=(items||[]).filter(function(z){return z.id===a.empId;})[0]; if(ne&&state.abm){ state.abm.emp=ne; } });
      dbListMovements(a.empId).then(function(items){ if(state.abm&&state.abm.empId===a.empId){ state.abm.movements=items; render(); } });
      render();
    }
    if(empPatch){
      var slim=Object.assign({}, empPatch); delete slim.salary; delete slim.termination_date; delete slim.termination_reason;
      dbUpdateEmployee(a.empId, empPatch).catch(function(){ return Object.keys(slim).length?dbUpdateEmployee(a.empId, slim):null; }).then(done).catch(done);
    } else { done(); }
  }).catch(function(){
    f.saving=false;
    f.error="No pude registrar el movimiento. Si es la primera vez, revisá que hayas corrido el SQL de ABM (sql_abm.sql) en Supabase.";
    render();
  });
}

function doLogin(email, password, captchaToken){
  email=(email||"").trim(); password=password||"";
  if(!email || !password){ state.error="Ingresá tu email y contraseña."; render(); return; }
  if(captchaConfigured() && !captchaToken){ state.error="Completá la verificación de seguridad."; render(); return; }
  state.busy=true; state.error=null; render();
  supaLogin(email, password, captchaToken).then(function(res){
    state.busy=false;
    if(res.ok && res.j && res.j.access_token){ storeSessionFromToken(res.j); state.error=null; routeAfterAuth(); }
    else { state.error = (res.j && (res.j.error_description||res.j.msg||res.j.error)) || "Email o contraseña incorrectos."; render(); }
  }).catch(function(){ state.busy=false; state.error="No pude conectar. Revisá tu conexión."; render(); });
}
function doSignup(email, password, captchaToken){
  email=(email||"").trim(); password=password||"";
  if(!email || password.length<6){ state.error="Email válido y contraseña de al menos 6 caracteres."; render(); return; }
  state.busy=true; state.error=null; render();
  supaSignup(email, password, captchaToken).then(function(res){
    if(res.ok && res.j && res.j.access_token){ state.busy=false; storeSessionFromToken(res.j); state.error=null; routeAfterAuth(); return; }
    if(res.ok && res.j && (res.j.id || res.j.user)){
      // Cuenta creada pero requiere confirmar email: intentamos loguear igual.
      supaLogin(email, password).then(function(r2){
        state.busy=false;
        if(r2.ok && r2.j && r2.j.access_token){ storeSessionFromToken(r2.j); routeAfterAuth(); }
        else { state.error="Cuenta creada. Revisá tu email para confirmarla y luego iniciá sesión."; state.screen="rec-login"; render(); }
      }).catch(function(){ state.busy=false; state.error="Cuenta creada. Revisá tu email para confirmarla y luego iniciá sesión."; state.screen="rec-login"; render(); });
      return;
    }
    state.busy=false;
    state.error = (res.j && (res.j.error_description||res.j.msg||res.j.error)) || "No pude crear la cuenta.";
    render();
  }).catch(function(){ state.busy=false; state.error="No pude conectar. Revisá tu conexión."; render(); });
}

function aiErrorMessage(code, detail){
  var m = {
    "no_key": "la IA no está configurada (falta la GEMINI_API_KEY en Vercel)",
    "gemini_error": "Gemini devolvió un error — probablemente la API key esté inválida, revocada o sin cuota",
    "parse_error": "la IA respondió en un formato inesperado",
    "sin_preguntas": "la IA no devolvió preguntas",
    "network": "no pude conectarme con la IA"
  };
  var reason = m[code] || (code ? ("motivo: "+code) : "motivo desconocido");
  var d = (detail && String(detail).trim()) ? (" — Detalle de Gemini: “"+String(detail).slice(0,300)+"”") : "";
  return "⚠ Estas preguntas son de PLANTILLA (no personalizadas por IA), porque "+reason+d+". Revisá la GEMINI_API_KEY en Vercel para que las preguntas se generen a medida del puesto y del CV.";

        var slim = Object.assign({}, row); delete slim.valid_days; delete slim.followups;

          .catch(function(){ state.storageWarn = true; toShare(); });

function bulkLinkFor(code){

}
function buildBulkInviteMessage(name, link, code, qCount){

             "Te invitamos a completar una entrevista por voz para el puesto de " + c.position + ".\n\n") +

/* Crea la fila de entrevista para el envío masivo. Intenta guardar el candidato
   (candidate_name/email); si esas columnas no existen todavía, reintenta sin ellas. */
function createBulkInterviewRow(code, name, email, qs){
  var u = currentUser();

    recruiter_id: u && u.id, code: code,
    position: state.config.position, company: state.config.company, focus: state.config.focus||"",

    valid_days: (state.config.validDays!=null ? state.config.validDays : 3),

function sendInviteEmail(to, subject, message){

  }).then(function(r){ return r.json(); }).catch(function(){ return { ok:false, error:"network" }; });
}
/* Envío "inteligente": si iniciaste sesión con Google, sale desde tu Gmail;
   si no, sale automático por el servidor de correo (Brevo). Devuelve el mismo
   shape { ok, error } en ambos casos. */
function sendInviteSmart(to, subject, message){

}
/* ¿No hay forma de enviar automático? (ni Gmail ni servidor configurado) */
function sendCannotAuto(j){

}
function startBulkSend(){
  if (!(supaConfigured() && isLoggedIn())){ state.bulk={ error:"Necesitás iniciar sesión para el envío masivo.", results:[], done:true, editing:false }; state.screen="bulk-result"; render(); return; }
  var ids = state.config.selectedCVs || [];
  var chosen = (state.cvbank.cvs||[]).filter(function(cv){ return ids.indexOf(cv.id)>=0; });
  var targets = [], noEmail = [];
  chosen.forEach(function(cv){
    var mail = cv.candidate_email || extractEmailFromText(cv.cv_text||"");
    var rec = { id:cv.id, name:cv.candidate_name||cv.file_name||"Candidato", email:mail||"" };
    if (mail && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) targets.push(rec); else noEmail.push(rec);
  });
  if (targets.length > 25){ targets = targets.slice(0,25); } // tope por tanda (rate limit del envío)
  state.bulk = { running:false, phase:"questions", editing:false, total:targets.length, sent:0, failed:0, noEmail:noEmail.length, results:[], error:null, sendUnavailable:false, done:false, targets:targets, noEmailList:noEmail };
  if (!targets.length){ state.bulk.done=true; state.bulk.error="Ninguno de los CVs seleccionados tiene un email detectado. Abrí cada CV y cargá el email, o subilos de nuevo."; state.screen="bulk-result"; render(); return; }

  // 1) Generar las preguntas del puesto (mismas para todos). Sin sesgo de un CV puntual.
  state.aiFallback = null; state.screen = "generating"; render();

  generateQuestions()
    .then(function(list){ rt.cvText=savedCvText; rt.cvData=savedCvData; var qs=mapAIQuestions(list, lang); if(!qs||!qs.length) qs=buildQuestions(state.config); return qs; })
    .catch(function(e){ rt.cvText=savedCvText; rt.cvData=savedCvData; var code=(e&&e.message)||"network"; if(/fetch|network|load failed|failed to/i.test(code)) code="network"; state.aiFallback=aiErrorMessage(code, e&&e.detail); return buildQuestions(state.config); })
    .then(function(qs){
      if (!qs || !qs.length) qs = buildQuestions(state.config);
      qs.forEach(function(q,i){ if(!q.id) q.id="q"+i; });
      state.questions = qs;
      // 2) Paso de edición: el reclutador revisa/edita/agrega preguntas antes de enviar.
      state.bulk.editing = true;

    });
}
// 3) Con las preguntas ya editadas, crea una entrevista por candidato y envía a cada uno.
function bulkFinalizeSend(){
  var qs = (state.questions||[]).filter(function(q){ return q.text && q.text.trim(); });
  if (!qs.length){ state.error="La entrevista necesita al menos una pregunta."; render(); return; }
  qs.forEach(function(q,i){ if(!q.id) q.id="q"+i; });
  var targets = state.bulk.targets || [];
  var noEmail = state.bulk.noEmailList || [];
  var qCount = qs.length;
  state.bulk.editing=false; state.bulk.running=true; state.bulk.phase="creating";
  state.bulk.sent=0; state.bulk.failed=0; state.bulk.results=[]; state.bulk.sendUnavailable=false; state.bulk.done=false; state.bulk.error=null;
  state.screen="bulk-sending"; render();

  var subject = inviteSubject();
  var chain = Promise.resolve();
  noEmail.forEach(function(r){ state.bulk.results.push({ name:r.name, email:"", code:"", link:"", status:"noemail" }); });
  targets.forEach(function(t){
    chain = chain.then(function(){
      var code = makeCode();
      return createBulkInterviewRow(code, t.name, t.email, qs).then(function(){
        var link = bulkLinkFor(code);
        var entry = { name:t.name, email:t.email, code:code, link:link, status:"pending" };
        state.bulk.results.push(entry);
        if (state.bulk.sendUnavailable){ render(); return; }
        var msg = buildBulkInviteMessage(t.name, link, code, qCount);
        return sendInviteSmart(t.email, subject, msg).then(function(j){
          if (j && j.ok){ entry.status="sent"; state.bulk.sent++; }
          else if (sendCannotAuto(j)){ state.bulk.sendUnavailable=true; entry.status="pending"; }
          else { entry.status="failed"; state.bulk.failed++; }
          render();
        });
      }).catch(function(){
        state.bulk.results.push({ name:t.name, email:t.email, code:"", link:"", status:"failed" });
        state.bulk.failed++; render();
      });
    });
  });
  chain.then(function(){
    state.bulk.running=false; state.bulk.done=true; state.bulk.editing=false; state.screen="bulk-result"; render();
    state.config.selectedCVs = [];
    if (supaConfigured() && isLoggedIn()) loadDashboard();
  }).catch(function(e){
    state.bulk.running=false; state.bulk.done=true; state.bulk.error="No pude completar el envío. "+((e&&e.message)||""); state.screen="bulk-result"; render();
  });
}

function emailsMatch(a, b){ return (a||"").trim().toLowerCase() === (b||"").trim().toLowerCase(); }

function startInviteInterview(emailRaw, codeRaw, nameRaw){
  var inv = state.invite; if (!inv || !inv.questions) return;
  var emailIn = (emailRaw||"").trim();
  var codeIn = (codeRaw||"").trim().toUpperCase();
  var nameIn = (nameRaw||"").trim().replace(/\s+/g," ");
  if (!nameIn || nameIn.length < 2){ state.error="Ingresá tu nombre y apellido."; render(); return; }
  if (!emailIn || emailIn.indexOf("@") < 1){ state.error="Ingresá un email válido para comenzar."; render(); return; }
  if (!codeIn){ state.error="Ingresá el código de verificación que está en el correo de la invitación."; render(); return; }
  if (inv.code && codeIn !== String(inv.code).toUpperCase()){ state.error="El código no es correcto. Revisá el correo de la invitación."; render(); return; }
  if (inv.code && isInterviewUsed(inv.code)){ state.error=null; render(); return; }

  function enter(){
    state.config = {
      position: inv.position||"", company: inv.company||"", focus: inv.focus||"",
      level: inv.level||"Semi-Senior", language: inv.language||"es",
      includeEnglish:false, count:"auto", followups: inv.followups !== false,
      recruiterEmail: inv.recruiterEmail || ""
    };
    rt.analyzed = {}; rt.autoStartedFor = {};
    state.questions = inv.questions.slice();
    state.answers = {}; state.idx = 0; state.report = null; state.audioUrls = {};
    state.code = inv.code || "";
    state.interviewId = inv.id || "";
    state.candidateEmail = emailIn;
    state.candidateName = nameIn;
    state.interviewMode = "candidate";
    state.autoSendState = "idle"; state.autoSendError = null;
    state.micDenied = false;
    state.consentAt = new Date().toISOString(); // registro del consentimiento aceptado
    // El "un solo uso" ya NO se marca al ingresar (así un corte de micrófono o una
    // recarga no dejan al candidato bloqueado sin haber respondido). Se marca al terminar.
    state.error = null; state.screen = "interview";
    render();
  }

  // Pedimos permiso de micrófono ahora (con el gesto del botón) para que después
  // cada pregunta pueda grabar sola sin volver a preguntar.
  state.error = null; state.screen = "loading"; render();
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      enter();
    }).catch(function(){
      state.error = "Necesitamos permiso para usar el micrófono. Activalo en el navegador y volvé a tocar “Comenzar entrevista”.";
      state.screen = "invite-landing"; render();
    });

    enter();
  }
}

function loadResults(raw){

function submitAnswers(){
  state.screen = "submitting"; render();
  var budget = 3200000, used = 0, omitted = false;
  var qs = state.questions.slice();
  var out = {};
  function processNext(i){
    if (i >= qs.length){ finish(); return; }
    var q = qs[i], a = state.answers[q.id];
    if (!a){ processNext(i+1); return; }
    if (a.blobUrl && a.blobUrl.indexOf("blob:")===0){
      fetch(a.blobUrl).then(function(r){ return r.blob(); }).then(function(blob){
        var fr = new FileReader();
        fr.onload = function(){
          var d = fr.result;
          if (used + d.length <= budget){ out[q.id] = { transcript:a.transcript||"", signals:a.signals||null, audio:d }; used += d.length; }
          else { out[q.id] = { transcript:a.transcript||"", signals:a.signals||null, audio:null }; omitted = true; }
          processNext(i+1);
        };
        fr.onerror = function(){ out[q.id] = { transcript:a.transcript||"", signals:a.signals||null, audio:null }; omitted=true; processNext(i+1); };
        fr.readAsDataURL(blob);
      }).catch(function(){ out[q.id] = { transcript:a.transcript||"", signals:a.signals||null, audio:null }; omitted=true; processNext(i+1); });
    } else {
      out[q.id] = { transcript:a.transcript||"", signals:a.signals||null, audio:null };
      processNext(i+1);
    }
  }
  function finish(){
    var strip = qs.map(function(q){ return { id:q.id, text:q.text, category:q.category, seconds:q.seconds, lang:q.lang, isFollowup:!!q.isFollowup, rootId:q.rootId, depth:q.depth||0, reason:q.reason||"" }; });
    lset("voz_ans_"+state.code, { questions: strip, answers: out, submittedAt: Date.now(), audioOmitted: omitted, candidateEmail: state.candidateEmail||"" });
    try{ state.report = evaluateLocally(state.questions, state.answers, state.config); }catch(e){ state.report = null; }
    state.audioOmitted = omitted;
    finalizeCandidate();
  }
  processNext(0);
}

/* Sube audios, pide el análisis con IA, guarda en la base y/o envía por mail. */
/* Envuelve una promesa con un límite de tiempo, para que un fetch colgado no trabe la UI. */
function withTimeout(p, ms){
  return new Promise(function(resolve, reject){
    var to = setTimeout(function(){ reject(new Error("timeout")); }, ms || 30000);
    Promise.resolve(p).then(function(v){ clearTimeout(to); resolve(v); }, function(e){ clearTimeout(to); reject(e); });
  });
}
function safeLocalReport(){ try{ return evaluateLocally(state.questions, state.answers, state.config); }catch(e){ return null; } }

function finalizeCandidate(){
  state.autoSendState = "sending"; state.autoSendError = null; state.screen = "cand-autosend"; render();
  var settled = false;
  function finish(screen, st, markUsed){
    if (settled) return; settled = true;
    if (markUsed){ try{ markInterviewUsed(state.code, state.candidateEmail); }catch(e){} }
    state.autoSendState = st || "sent"; state.screen = screen; render();
  }
  // Respaldo por si toda la cadena tarda demasiado (audios + transcripción + IA + guardado): no dejamos al candidato colgado.
  var hardStop = setTimeout(function(){ finish("cand-send", "error", false); }, 120000);

  // Subimos los audios y (en paralelo) transcribimos con IA cada respuesta en su idioma.
  Promise.all([
    withTimeout(uploadAllAudios(), 60000).catch(function(){ /* audios best-effort */ }),
    withTimeout(transcribeAnswersWithAI(), 55000).catch(function(){ /* transcripción best-effort */ })
  ])
    .then(function(){
      return withTimeout(analyzeWithAI(), 45000)
        .then(function(ai){ state.report = reportFromAI(ai); })
        .catch(function(){ state.report = state.report || safeLocalReport(); });
    })
    .then(function(){
      if (rt.audioError && (!state.audioUrls || !Object.keys(state.audioUrls).length)){
        state.report = state.report || {}; state.report.audioError = rt.audioError;
      }
      if (state.consentAt){ state.report = state.report || {}; state.report.consent = { accepted:true, at: state.consentAt }; }
      return withTimeout(submitToDB(), 30000).catch(function(){ return false; });
    })
    .then(function(dbSaved){
      var hasDB = !!state.interviewId;
      var needsSend = autoSendConfigured();
      var emailP = needsSend ? withTimeout(sendResultsAuto(), 30000).then(function(){ return true; }).catch(function(){ return false; }) : Promise.resolve(false);
      return emailP.then(function(emailSent){
        clearTimeout(hardStop);
        var delivered = (hasDB && dbSaved) || emailSent;
        if (delivered){ finish("cand-done", "sent", true); }        // entregado: recién acá marcamos "un solo uso"
        else if (!hasDB && !needsSend){ finish("cand-send", "idle", false); }
        else { state.autoSendError = { message: "No se pudieron entregar los resultados automáticamente." }; finish("cand-send", "error", false); }
      });
    })
    .catch(function(){ clearTimeout(hardStop); finish("cand-send", "error", false); });
}

/* ---- recording ---- */
function pickMime(){
  var types = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"];
  for (var i=0;i<types.length;i++){ if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(types[i])) return types[i]; }
  return "";
}
function startRecording(q){
  state.error=null; state.micDenied=false;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    state.micDenied = true;
    state.error = "Tu navegador no permite grabar audio. Abrí el enlace directamente en Chrome o Safari (no dentro de otra app como Instagram o LinkedIn) y sobre una conexión segura (https).";
    render(); return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    rt.stream = stream;
    var mime = pickMime();
    var mr = new MediaRecorder(stream, mime?{mimeType:mime}:undefined);
    rt.chunks = []; rt.activeQ = q; rt.finalText = ""; state.live = "";
    mr.ondataavailable = function(e){ if (e.data.size>0) rt.chunks.push(e.data); };
    mr.onstop = function(){
      var blob = new Blob(rt.chunks, {type: mr.mimeType});
      var url = URL.createObjectURL(blob);
      var qid = rt.activeQ ? rt.activeQ.id : null;
      var dur = (Date.now() - rt.startTime)/1000;
      var s = rt.sig;
      var signals = { longestSilence: +s.longest.toFixed(1), totalSilence: +s.total.toFixed(1), spoke: s.spoke, durationSec: +dur.toFixed(1) };
      if (qid) state.answers[qid] = { blob: blob, blobUrl:url, mime:mr.mimeType, transcript: rt.finalText.trim(), signals: signals };
      if (rt.stream) rt.stream.getTracks().forEach(function(t){ t.stop(); });
      stopMeter();
      render();
    };
    rt.recorder = mr; mr.start();
    startMeter(stream); rt.startTime = Date.now();
    startRecognition(q);
    state.recording = true;
    if (state.interviewMode === "candidate"){
      // El cronómetro ya viene corriendo desde que apareció la pregunta.
      if (!state.qTiming) startQuestionTimer(q);
      render();
    } else {
      // Preview del reclutador: el reloj arranca al grabar la primera vez.
      // Si ya está corriendo (por ejemplo al regrabar), NO se reinicia.
      if (!state.qTiming){ state.timeLeft = questionTime(q, false); state.timeTotal = state.timeLeft; state.qTiming = true; render(); tick(); }
      else render();
    }
  }).catch(function(){ state.micDenied = true; render(); });
}
/* Cronómetro de la pregunta: arranca cuando la pregunta aparece (modo candidato). */
function startQuestionTimer(q){
  clearTimeout(rt.timerId);
  state.timeLeft = questionTime(q, state.interviewMode === "candidate");
  state.timeTotal = state.timeLeft;
  state.qTiming = true;
  render();
  tick();
}
function onQuestionTimeUp(){
  state.qTiming = false;
  var q = state.questions[state.idx];
  if (state.recording){ stopRecorderOnly(); return; } // onstop guarda la respuesta grabada
  if (q && !state.answers[q.id]){
    state.answers[q.id] = { noAnswer:true, transcript:"", signals:{ durationSec:0, longestSilence:0, totalSilence:0, spoke:false } };
  }
  render();
}
function startRecognition(q){
  if (!hasSpeech) return;
  try{
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var r = new SR();
    r.lang = RECOG_LANG[q.lang] || "es-AR"; r.continuous = true; r.interimResults = true;
    r.onresult = function(e){
      var interim = "";
      for (var i=e.resultIndex;i<e.results.length;i++){
        var t = e.results[i][0].transcript;
        if (e.results[i].isFinal) rt.finalText += t + " "; else interim += t;
      }
      state.live = (rt.finalText+interim).trim();
      // Actualiza solo el cuadro de transcripción en vivo, sin re-dibujar la pantalla
      // (evita que el botón Detener se reconstruya y se pierdan los toques en el celular).
      if (state.recording){
        var lb = document.getElementById("liveBox");
        if (lb){ lb.textContent = state.live; lb.style.display = state.live ? "" : "none"; }
        else render();
      }
    };
    r.onerror = function(){};
    rt.recog = r; r.start();
  } catch(e){}
}
function startMeter(stream){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
    var ctx = new Ctx(); rt.audioCtx = ctx; if (ctx.resume) ctx.resume();
    var src = ctx.createMediaStreamSource(stream);
    var an = ctx.createAnalyser(); an.fftSize = 2048; src.connect(an);
    var buf = new Uint8Array(an.fftSize);
    rt.sig = { longest:0, cur:0, total:0, spoke:false };
    rt.meterId = setInterval(function(){
      an.getByteTimeDomainData(buf);
      var sum=0; for (var i=0;i<buf.length;i++){ var d=(buf[i]-128)/128; sum+=d*d; }
      var rms = Math.sqrt(sum/buf.length), dt=0.1;
      if (rms < 0.02){ rt.sig.cur += dt; rt.sig.total += dt; if (rt.sig.cur > rt.sig.longest) rt.sig.longest = rt.sig.cur; }
      else { rt.sig.cur = 0; rt.sig.spoke = true; }
    }, 100);
  } catch(e){}
}
function stopMeter(){ clearInterval(rt.meterId); try{ if (rt.audioCtx) rt.audioCtx.close(); }catch(e){} rt.audioCtx=null; }
function stopRecorderOnly(){
  try{ if (rt.recorder && rt.recorder.state !== "inactive") rt.recorder.stop(); }catch(e){}
  try{ if (rt.recog) rt.recog.stop(); }catch(e){}
  state.recording = false;
}
function stopRecording(){
  stopRecorderOnly();
  // El reloj NO se detiene al parar la grabación (ni en candidato ni en preview):
  // así se puede eliminar y volver a grabar sin que el tiempo se reinicie.
}
/* Actualiza SOLO el número del reloj y el anillo, sin volver a dibujar la pantalla.
   Esto evita que el botón de grabar/detener se "reconstruya" cada segundo y se pierdan
   los toques en el celular (el bug de tener que tocar 3 veces). */
function updateTimerUI(){
  if (state.screen !== "interview") return;
  var q = state.questions[state.idx]; if (!q) return;
  var ring = 2*Math.PI*54;
  var progress = state.qTiming ? state.timeLeft/(state.timeTotal || q.seconds) : 1;
  var overtime = state.qTiming && state.timeLeft <= 10;
  var col = overtime ? "var(--brick)" : "var(--teal)";
  var r = document.getElementById("recRing");
  if (r){ r.setAttribute("stroke-dashoffset", ring*(1-progress)); r.setAttribute("stroke", col); }
  var c = document.getElementById("recCount"); if (c) c.textContent = fmt(state.timeLeft);
  var rem = document.getElementById("recRemain"); if (rem) rem.textContent = fmt(state.timeLeft);
  var hint = document.getElementById("recHint"); if (hint) hint.style.color = overtime ? "var(--brick)" : "var(--ink)";
}
function tick(){
  clearTimeout(rt.timerId);
  if (!state.qTiming) return;
  if (state.timeLeft <= 0){ onQuestionTimeUp(); return; }
  rt.timerId = setTimeout(function(){ state.timeLeft -= 1; updateTimerUI(); tick(); }, 1000);
}

function maybeFollowup(){
  if (state.screen !== "interview") return;
  var q = state.questions[state.idx];
  if (!q || !state.config.followups) return;
  if ((q.depth||0) >= 2) return;
  var a = state.answers[q.id]; if (!a || !a.blobUrl) return;
  if (rt.analyzed[q.id]) return;
  rt.analyzed[q.id] = true;
  var hasContent = a.transcript && a.transcript.length >= 8;
  var hesitant = isHesitant(a);
  if (!hasContent && !hesitant) return;
  runAnalyze(q, false);
}
function runAnalyze(q, force, done){
  state.analyzingId = q.id; render();
  var a = state.answers[q.id] || {};
  var hesitant = isHesitant(a);
  var m = speechMetrics(a.transcript||"");
  var shortContent = m.words < 10;
  var shouldFollow = force || hesitant || shortContent;
  function finish(){ state.analyzingId = null; if (typeof done === "function") done(); else render(); }
  if (!shouldFollow){ finish(); return; }
  var reasonKind = hesitant && !shortContent ? "delivery" : "content";
  var tmpl = makeFollowup(q, reasonKind); // respaldo por plantilla (nunca falla)
  function insert(fu){
    var i = state.questions.findIndex(function(x){ return x.id === q.id; });
    if (i >= 0) state.questions.splice(i+1, 0, fu);
    finish();
  }
  // Intento con IA una repregunta puntual según lo que dijo el candidato; si falla o tarda, uso la plantilla.
  withTimeout(fetchFollowupAI(q, a.transcript||""), 9000).then(function(txt){
    if (txt){ tmpl.text = txt; tmpl.reason = "Repregunta generada por IA según la respuesta del candidato."; }
    insert(tmpl);
  }).catch(function(){ insert(tmpl); });
}
/* Pide a la IA una repregunta puntual. Devuelve "" si no hay contenido o falla (se usa plantilla). */
function fetchFollowupAI(q, transcript){
  transcript = (transcript||"").trim();
  if (transcript.length < 8) return Promise.resolve("");
  return fetch(AI_ANALYZE_ENDPOINT, { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ task:"followup", question:q.text, answer:transcript, position:state.config.position, level:state.config.level, language:(q.lang||state.config.language) }) })
    .then(function(r){ return r.json(); })
    .then(function(j){ return (j && j.ok && j.followup) ? String(j.followup) : ""; })
    .catch(function(){ return ""; });
}

function reRecord(q){
  // En modo candidato solo se puede regrabar mientras quede tiempo.
  if (state.interviewMode === "candidate" && !state.qTiming) return;
  var a = state.answers[q.id];
  if (a && a.blobUrl && a.blobUrl.indexOf("blob:")===0) URL.revokeObjectURL(a.blobUrl);
  delete state.answers[q.id];
  startRecording(q);  // el reloj sigue corriendo (no se reinicia): regrabar consume tiempo
}
function nextQuestion(){
  if (state.analyzingId) return; // ya estamos analizando esta respuesta; evitar doble avance
  if (state.recording) stopRecording();
  // Cortar el reloj de la pregunta actual antes de pasar a la siguiente (el de la nueva arranca solo).
  clearTimeout(rt.timerId); state.qTiming = false;
  // Repreguntas con IA (solo candidato, si están activadas): analizamos la respuesta y, si es floja
  // o genérica, insertamos una repregunta puntual antes de avanzar.
  var cq = state.questions[state.idx];
  if (state.interviewMode === "candidate" && state.config.followups && cq && !rt.analyzed[cq.id] && (cq.depth||0) < 2){
    var a = state.answers[cq.id];
    if (a && (a.blobUrl || a.blob || (a.transcript && a.transcript.length >= 8))){
      rt.analyzed[cq.id] = true;
      state.screen = "cand-followup"; render();
      runAnalyze(cq, false, function(){ state.screen = "interview"; advanceQuestion(); });
      return;
    }
  }
  advanceQuestion();
}
function advanceQuestion(){
  if (state.idx < state.questions.length-1){ state.idx += 1; render(); }
  else if (state.interviewMode === "candidate") submitAnswers();
  else { state.screen = "review"; render(); }
}
function evaluate(){
  state.screen = "evaluating"; state.error=null; render();
  function fallback(){
    try{ state.report = evaluateLocally(state.questions, state.answers, state.config); state.screen = "report"; }
    catch(e){ state.error = "No pude generar la evaluación. Probá de nuevo."; state.screen = "review"; }
    render();
  }
  withTimeout(transcribeAnswersWithAI(), 55000).catch(function(){})
    .then(function(){ return analyzeWithAI(); })
    .then(function(ai){ state.report = reportFromAI(ai); state.screen = "report"; render(); })
    .catch(function(){ fallback(); });
}

function copyText(txt, cb){
  function fallback(){
    try{
      var ta=document.createElement("textarea"); ta.value=txt;
      ta.style.position="fixed"; ta.style.top="0"; ta.style.left="0"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      try{ document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
    }catch(e){}
    if (cb) cb();
  }
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(cb).catch(fallback); }
  else fallback();
}

          function readPage(i){
            if (i > max){
              var txt = pages.join("\n").replace(/\s+\n/g,"\n").trim();
              rt.cvText = txt.slice(0, 15000);

              }

            }).catch(function(){ readPage(i+1); });
          }
          readPage(1);

  function syncMailHref(){ var m=document.getElementById("mailBtn"); if (m) m.setAttribute("href", mailtoHref()); var g=document.getElementById("gmailComposeBtn"); if (g) g.setAttribute("href", gmailComposeHref()); }
  function applyCandidateEmailFromCV(mail){
    mail = String(mail||"").trim();
    if(!mail || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return false;
    state.candidateEmail = mail;
    var em = document.getElementById("f_email"); if(em) em.value = mail;
    try{ syncMailHref(); persistCandidateEmail(); }catch(e){}
    return true;
  }
  function persistCandidateEmail(){
    if (!state.code) return;
    var iv = lget("voz_iv_"+state.code);
    if (!iv) return;
    iv.candidateEmail = state.candidateEmail || "";
    lset("voz_iv_"+state.code, iv);
  }
  if ((f=document.getElementById("f_email"))) f.addEventListener("input", function(e){ state.candidateEmail=e.target.value; syncMailHref(); persistCandidateEmail(); });
  if ((f=document.getElementById("f_link"))) f.addEventListener("input", function(e){ state.shareLink=e.target.value; syncMailHref(); });

  /* edit questions screen */
  app.querySelectorAll("textarea.q-edit").forEach(function(t){
    t.addEventListener("input", function(){ var i=parseInt(t.getAttribute("data-idx"),10); if(state.questions[i]) state.questions[i].text=t.value; });
  });
  if ((f=document.getElementById("createIvBtn"))) f.addEventListener("click", function(){
    // capturar valores actuales por si acaso
    app.querySelectorAll("textarea.q-edit").forEach(function(t){ var i=parseInt(t.getAttribute("data-idx"),10); if(state.questions[i]) state.questions[i].text=t.value; });
    createInterview();
  });
  if ((f=document.getElementById("bulkSendBtn"))) f.addEventListener("click", function(){
    app.querySelectorAll("textarea.q-edit").forEach(function(t){ var i=parseInt(t.getAttribute("data-idx"),10); if(state.questions[i]) state.questions[i].text=t.value; });
    bulkFinalizeSend();
  });
  // Carga perezosa del banco de preguntas al entrar a la edición.
  if (state.screen==="edit-questions" && state.qbank.items===null && !state.qbank.loading) loadQuestionBank();

  /* review screen */
  if ((f=document.getElementById("evalBtn"))) f.addEventListener("click", evaluate);

  /* candidate: the clock starts as soon as the question appears (recording is manual) */
  if (state.screen === "interview" && state.interviewMode === "candidate"){
    var cq = state.questions[state.idx];
    if (cq && !state.answers[cq.id] && !state.qTiming && !rt.autoStartedFor[cq.id]){
      rt.autoStartedFor[cq.id] = true;
      startQuestionTimer(cq);
    }
  }
}

/* ---- marca (white-label) guardada en este navegador ---- */
(function loadBrand(){ try{ var b=lget("voz_brand"); if(b&&(b.name||b.logo)){ state.brand={ name:b.name||"", logo:b.logo||"" }; } }catch(e){} })();
function saveBrand(){ try{ lset("voz_brand", { name:state.brand.name||"", logo:state.brand.logo||"" }); }catch(e){} }

/* ---- entrada por link de invitación ---- */
// 1) Link autocontenido viejo (#e=...): trae todo embebido.
(function initFromHash(){
  try{
    var h = (window.location && window.location.hash) || "";
    var m = h.match(/[#&]e=([^&]+)/);
    if (!m) return;
    var inv = decodePayload(m[1]);
    if (inv && inv.questions && inv.questions.length){
      state.invite = inv;
      state.screen = "invite-landing";
    }
  } catch(e){}
})();
// 2) Link corto nuevo (?c=CODIGO o #c=CODIGO): carga la entrevista desde el servidor.
var pendingCode = (function(){
  try{
    var loc = window.location || {};
    var mq = (loc.search || "").match(/[?&]c=([^&]+)/);
    if (mq) return decodeURIComponent(mq[1]).toUpperCase();
    var mh = (loc.hash || "").match(/[#&]c=([^&]+)/);
    if (mh) return decodeURIComponent(mh[1]).toUpperCase();
  }catch(e){}
  return "";
})();
// Código del aviso público del portal (?job=CODIGO o #job=CODIGO).
var pendingJob = (function(){
  try{
    var loc = window.location || {};
    var mq = (loc.search || "").match(/[?&]job=([^&]+)/);
    if (mq) return decodeURIComponent(mq[1]).toUpperCase();
    var mh = (loc.hash || "").match(/[#&]job=([^&]+)/);
    if (mh) return decodeURIComponent(mh[1]).toUpperCase();
  }catch(e){}
  return "";
})();
// Código del fichador (?fichar=CODIGO o #fichar=CODIGO).
var pendingFichar = (function(){
  try{
    var loc = window.location || {};
    var mq = (loc.search || "").match(/[?&]fichar=([^&]+)/);
    if (mq) return decodeURIComponent(mq[1]).toUpperCase();
    var mh = (loc.hash || "").match(/[#&]fichar=([^&]+)/);
    if (mh) return decodeURIComponent(mh[1]).toUpperCase();
  }catch(e){}
  return "";
})();

// Ruteo de arranque:
if (handleOAuthRedirect()){
  // Volvimos de "Iniciar sesión con Google": ya guardamos la sesión y los tokens de Gmail.
  state.screen = "loading"; render();
  fetchSupaUser().then(function(){ routeAfterAuth(); });
} else if (pendingFichar){
  loadFichador(pendingFichar);      // empleado fichando (fichador público)
} else if (pendingJob){
  loadJobByCode(pendingJob);        // persona en búsqueda laboral: aviso público del portal
} else if (state.screen === "invite-landing"){
  render();                         // candidato con link viejo (#e=)
} else if (pendingCode){
  loadInviteByCode(pendingCode);    // candidato con link corto (?c=)
} else {
  enterRecruiter();   // reclutador: login o panel
}
})();
</script>
