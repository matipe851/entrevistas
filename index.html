.transcript-box{ border-radius:13px; padding:14px 16px; background:var(--bg); border:1px solid var(--border-soft); }
.transcript-label{ display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em; }

.qa-item{ border-radius:16px; padding:18px 20px; background:var(--surface); border:1px solid var(--border-soft); }

.qa-meta{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:9px; }
.qa-text{ margin:0 0 12px; font-size:15px; line-height:1.5; }

.report-hero{ border-radius:18px; padding:26px 28px; background:var(--cta-bg); color:var(--cta-fg); }
.report-eyebrow{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; opacity:.6; }
.report-score{ font-family:"Fraunces",serif; font-size:52px; font-weight:600; }
.rec-tag{ padding:5px 13px; border-radius:99px; font-size:13px; font-weight:600; }

.share-code{ text-align:center; border-radius:16px; padding:22px; background:var(--cta-bg); color:var(--cta-fg); margin-bottom:20px; }

.copybtn{ background:none; border:none; display:inline-flex; align-items:center; gap:6px; font-size:12px; opacity:.75; cursor:pointer; color:inherit; }

.footer-note{ margin-top:44px; text-align:center; font-size:11.5px; color:var(--muted); }
.flex-actions{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:20px; }

<script>
(function(){
"use strict";

/* ---------------- palette / constants ---------------- */
var CATEGORY_VAR = {
  "Presentación":"--teal", "Experiencia":"--blue", "Competencias":"--purple",
  "Situacional":"--amber", "Motivación y cultura":"--green", "Cierre":"--muted",
  "Repregunta":"--purple"
};
var CATEGORY_TINT = {
  "Presentación":"--teal-tint", "Experiencia":"--blue-tint", "Competencias":"--purple-tint",
  "Situacional":"--amber-tint", "Motivación y cultura":"--green-tint", "Cierre":"--border-soft",
  "Repregunta":"--purple-tint"
};
var LANG_LABEL = { es:"ES", en:"EN", pt:"PT" };
var RECOG_LANG = { es:"es-AR", en:"en-US", pt:"pt-BR" };
var LEVELS = ["Junior","Semi-Senior","Senior","Gerencial"];
var LANGS = [["es","Español"],["en","Inglés"],["pt","Português"]];
/* Estilos de tipografía para la firma digital (1 a 4). */
var SIGN_FONTS = [
  { id:1, label:"Manuscrita", css:'"Segoe Script","Brush Script MT","Snell Roundhand",cursive', style:"font-style:italic" },
  { id:2, label:"Elegante",   css:'"Fraunces",Georgia,"Times New Roman",serif',                 style:"font-style:italic" },
  { id:3, label:"Redonda",    css:'"Snell Roundhand","Apple Chancery","Segoe Script",cursive',   style:"" },
  { id:4, label:"Máquina",    css:'"IBM Plex Mono",ui-monospace,"Courier New",monospace',        style:"letter-spacing:1px" }
];
function signFont(id){ id=parseInt(id,10)||1; return SIGN_FONTS.filter(function(x){return x.id===id;})[0]||SIGN_FONTS[0]; }
function signatureHtml(name, fontId, size){ var sf=signFont(fontId); return '<span style="font-family:'+sf.css+';'+sf.style+';font-size:'+(size||28)+'px;color:var(--ink);line-height:1.2">'+esc(name||"")+'</span>'; }

function fmt(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function makeCode(){ var A="ABCDEFGHJKMNPQRSTUVWXYZ23456789", c=""; for(var i=0;i<6;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }

function extForAnswer(a){
  var m = (a && a.mime) || "";
  if (!m && a && a.blobUrl && a.blobUrl.indexOf("data:") === 0){
    var mt = a.blobUrl.match(/^data:([^;,]+)/);
    if (mt) m = mt[1];
  }
  if (m.indexOf("mp4") >= 0) return ".m4a";
  if (m.indexOf("ogg") >= 0) return ".ogg";
  return ".webm";
}
function plainBrowserDownload(blobUrl, filename){
  try{
    var a = document.createElement("a");
    a.href = blobUrl; a.download = filename || "audio.webm";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch(e){}
}
async function downloadAudio(blobUrl, filename){
  try{
    if (!window.claude || !window.claude.use){ plainBrowserDownload(blobUrl, filename); return; }
    var downloads = await window.claude.use("downloads");
    if (!downloads){ plainBrowserDownload(blobUrl, filename); return; }
    var resp = await fetch(blobUrl);
    var blob = await resp.blob();
    await downloads.save({ filename: filename, data: blob });
  } catch(e){ /* the artifact viewer sandbox blocks a plain download here — nothing more we can do */ }
}

/* ---------------- Gmail send via the mcp capability ---------------- */
function probeGmailOnce(){
  if (rt.gmailProbed) return;
  rt.gmailProbed = true;
  state.gmailStatus = "checking";
  (async function(){
    try{
      if (!window.claude || !window.claude.use){ state.gmailStatus = "unavailable"; render(); return; }
      var mcp = await window.claude.use("mcp");
      if (!mcp){ state.gmailStatus = "unavailable"; render(); return; }
      var res = await mcp.listTools();
      var g = (res.servers || []).filter(function(s){ return s.server === "Gmail"; })[0];
      if (g && g.authStatus === "connected" && (g.tools || []).some(function(t){ return t.name === "send_message"; })){
        state.gmailStatus = "available";
      } else if (g && g.authStatus === "needs_reauth"){
        state.gmailStatus = "needs_reauth";
      } else {
        state.gmailStatus = "unavailable";
      }
    } catch(e){ state.gmailStatus = "unavailable"; }
    render();
  })();
}
function mapGmailError(err){
  var code = (err && err.code) || "upstream_error";
  var msgs = {
    needs_reauth: "Tu conexión con Gmail venció. Reconectala en claude.ai → Configuración → Conectores y volvé a intentar.",
    server_not_connected: "No encontramos Gmail conectado en tu cuenta. Conectalo en claude.ai → Configuración → Conectores.",
    selection_required: "Tenés más de una cuenta de Gmail conectada. Elegí una en el aviso de claude.ai y volvé a intentar.",
    blocked_by_policy: "Tu organización no permite enviar esto desde Gmail. Usá “Copiar mensaje”.",
    approval_required: "Este envío necesita aprobación de tu organización. Usá “Copiar mensaje” mientras tanto.",
    tool_error: "Gmail no pudo enviar el mensaje" + (err && err.message ? (": " + err.message) : "") + ".",
    server_unavailable: "Gmail no respondió a tiempo. Podés reintentar en unos segundos.",
    not_granted: "Esta vista no tiene permiso para usar conectores.",
    capability_disabled: "El envío por Gmail no está disponible acá ahora.",
    no_email: "Ingresá el email del entrevistado antes de enviar."
  };
  return { code: code, message: msgs[code] || "No pudimos enviarlo por Gmail ahora. Probá de nuevo o usá “Copiar mensaje”.", retryable: !!(err && err.retryable) };
}
function sendViaGmail(){
  if (!state.candidateEmail || !state.candidateEmail.trim()){
    state.sendState = "error"; state.sendError = mapGmailError({code:"no_email"}); render(); return;
  }
  state.sendState = "sending"; state.sendError = null; render();
  (async function(){
    try{
      if (!window.claude || !window.claude.use) throw {code:"capability_disabled"};
      var mcp = await window.claude.use("mcp");
      if (!mcp) throw {code:"capability_disabled"};
      var c = state.config;
      var result = await mcp.callTool("Gmail", "send_message", {
        to: [state.candidateEmail.trim()],
        subject: inviteSubject(),
        body: buildShareMessage()
      });
      state.sendState = "sent";
      var payload = result && result.payload;
      state.sentMessageId = (payload && payload.id) ? payload.id : null;
      render();
    } catch(err){
      state.sendState = "error";
      state.sendError = mapGmailError(err);
      render();
    }
  })();
}

/* Envío individual real desde el Gmail del reclutador (sitio publicado). */
function gmailSendSingle(){
  var to = (state.candidateEmail||"").trim();
  if (!to || to.indexOf("@")<1){ state.sendState="error"; state.sendError={message:"Ingresá el email del candidato antes de enviar."}; render(); return; }
  state.sendState="sending"; state.sendError=null; render();
  sendInviteSmart(to, inviteSubject(), buildShareMessage()).then(function(j){
    if (j && j.ok){ state.sendState="sent"; state.sentMessageId=j.id||null; }
    else {
      var m = (j && j.error==="needs_relogin") ? "Tu permiso de Google venció. Iniciá sesión con Google de nuevo." :
              (j && j.error==="no_config") ? "El envío automático por servidor no está configurado todavía (Brevo). Iniciá sesión con Google, o usá “Abrir en Gmail” / copiar el mensaje." :
              (j && j.error==="no_google") ? "Iniciá sesión con Google para enviar desde tu Gmail." :
              "No pude enviar el mail" + (j && j.detail ? (": "+j.detail) : "") + ". Probá “Abrir en Gmail” o copiar el mensaje.";
      state.sendState="error"; state.sendError={message:m};
    }
    render();
  });
}

/* ---------------- speech / hesitancy signals (pure heuristics) ---------------- */
var FILLERS = /(\beh+\b|\bem+\b|\bmmm+\b|\beste\b|\bo sea\b|\bosea\b|\bdigamos\b|\bviste\b|\bcomo que\b|\bponele\b|\bum+\b|\byou know\b|\blike\b|\bkind of\b)/gi;
function speechMetrics(text){
  text = text || "";
  var words = (text.trim().match(/\S+/g) || []).length;
  var fillers = (text.match(FILLERS) || []).length;
  return { words: words, fillers: fillers, fillerRatio: words ? fillers/words : 0 };
}
function isHesitant(a){
  a = a || {};
  var s = a.signals || {};
  var m = speechMetrics(a.transcript || "");
  if ((s.durationSec||0) < 3) return false;
  if (s.spoke === false) return true;
  if ((s.longestSilence||0) >= 3) return true;
  if (m.words >= 4 && m.fillerRatio > 0.15) return true;
  var wpm = s.durationSec ? m.words/(s.durationSec/60) : 0;
  if (m.words >= 6 && wpm > 0 && wpm < 55) return true;
  return false;
}

/* Al volver de Google, Supabase deja los tokens en el hash de la URL (#access_token=...&provider_token=...). */
function handleOAuthRedirect(){
  try{
    var h = (window.location && window.location.hash) || "";
    if (h.indexOf("access_token=") < 0) return false;
    var params = {};
    h.replace(/^#/,"").split("&").forEach(function(kv){
      var i=kv.indexOf("="); if(i<0) return;
      params[decodeURIComponent(kv.slice(0,i))] = decodeURIComponent(kv.slice(i+1).replace(/\+/g," "));
    });
    if (!params.access_token) return false;
    setSession({ access_token:params.access_token, refresh_token:params.refresh_token||"", expires_at:(params.expires_at? parseInt(params.expires_at,10):0), user:null });
    if (params.provider_token){
      setGoogleTokens({ access_token:params.provider_token, refresh_token:params.provider_refresh_token||"", saved:Date.now() });
    }
    try{ history.replaceState(null, "", window.location.pathname + window.location.search); }catch(e){}
    return true;
  }catch(e){ return false; }
}

/* Envía un mail desde el Gmail del usuario. Si el token venció, lo refresca y reintenta 1 vez. */
function gmailPost(url, body){
  return fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) })
    .then(function(r){ return r.json().then(function(j){ j.__status=r.status; return j; }).catch(function(){ return { ok:false, error:"bad_json", __status:r.status }; }); })
    .catch(function(){ return { ok:false, error:"network" }; });
}
function gmailSend(to, subject, message){
  var g = getGoogleTokens();
  if(!g || !g.access_token) return Promise.resolve({ ok:false, error:"no_google" });
  var u = currentUser();
  var payload = { accessToken:g.access_token, to:to, subject:subject, message:message,
                  fromName:(state.brand && state.brand.name) ? state.brand.name : "",
                  fromEmail:(u && u.email) ? u.email : "" };
  return gmailPost("/api/gmail-send", payload).then(function(r){
    if (r && r.ok) return r;
    if (r && (r.error==="unauthorized" || r.__status===401 || r.status===401) && g.refresh_token){
      return gmailPost("/api/google-refresh", { refreshToken:g.refresh_token }).then(function(nr){
        if (nr && nr.ok && nr.access_token){
          g.access_token = nr.access_token; g.saved=Date.now(); setGoogleTokens(g);
          payload.accessToken = g.access_token;
          return gmailPost("/api/gmail-send", payload);
        }
        return { ok:false, error:"needs_relogin" };
      });
    }
    return r || { ok:false, error:"send_failed" };
  });
}
function supaFetch(path, opts){
  opts = opts || {};
  var s = getSession();
  var headers = { apikey:SUPABASE_ANON_KEY, "Content-Type":"application/json" };
  if (opts.headers) for (var k in opts.headers) headers[k]=opts.headers[k];
  if (s && s.access_token) headers["Authorization"] = "Bearer "+s.access_token;
  var o = { method:opts.method||"GET", headers:headers };
  if (opts.body) o.body = opts.body;
  return fetch(supaBase()+path, o).then(function(r){
    if (r.status === 401 && s && s.refresh_token){
      return supaRefresh().then(function(ok){
        if(!ok) return r;
        var s2=getSession(); headers["Authorization"]="Bearer "+s2.access_token;
        return fetch(supaBase()+path, { method:o.method, headers:headers, body:o.body });
      });
    }
    return r;
  });
}

/* Extrae el texto de un PDF en el navegador (reutiliza pdf.js). Devuelve "" si no puede. */
function extractPdfText(file){
  return new Promise(function(resolve){
    try{
      if (!window.pdfjsLib){ resolve(""); return; }
      var rd = new FileReader();
      rd.onload = function(){
        pdfjsLib.getDocument({ data: rd.result }).promise.then(function(pdf){
          var pages = []; var max = Math.min(pdf.numPages, 10);
          function readPage(i){
            if (i > max){ resolve(pages.join("\n").replace(/\s+\n/g,"\n").trim().slice(0,15000)); return; }
            pdf.getPage(i).then(function(p){ return p.getTextContent(); }).then(function(c){
              pages.push(c.items.map(function(it){ return it.str; }).join(" ")); readPage(i+1);
            }).catch(function(){ readPage(i+1); });
          }
          readPage(1);
        }).catch(function(){ resolve(""); });
      };
      rd.onerror = function(){ resolve(""); };
      rd.readAsArrayBuffer(file);
    }catch(e){ resolve(""); }
  });
}
/* Reconoce el email escrito dentro del texto del CV (incluye formas ofuscadas
   tipo "nombre (at) gmail (dot) com" o "nombre arroba gmail"). Devuelve "" si no encuentra. */
function extractEmailFromText(txt){
  if(!txt) return "";
  var s = String(txt)
    .replace(/\s*[\(\[]\s*at\s*[\)\]]\s*/gi, "@")
    .replace(/\s+arroba\s+/gi, "@")
    .replace(/\s*[\(\[]\s*dot\s*[\)\]]\s*/gi, ".")
    .replace(/\s+punto\s+/gi, ".");
  var m = s.match(/[A-Z0-9._%+\-]+@[A-Z0-9.\-]+\.[A-Z]{2,}/i);
  if(!m) return "";
  var e = m[0].toLowerCase().replace(/[.,;:]+$/, "");
  if(/\.(png|jpe?g|gif|svg|webp|bmp)$/i.test(e)) return ""; // falso positivo (nombre de imagen)
  return e;
}

/* ===================== IMPORTAR CVs DESDE GMAIL ===================== */
function knownFolderNames(){
  var fset={};
  (state.cvbank.folders||[]).forEach(function(f){ if(f&&f.name) fset[f.name]=true; });
  (state.cvbank.cvs||[]).forEach(function(c){ if(c.folder) fset[c.folder]=true; });
  return Object.keys(fset);
}
function parseFromHeader(from){
  from=String(from||"");
  var m=from.match(/<([^>]+)>/);
  var email=m?m[1].trim():((from.indexOf("@")>=0 && from.indexOf(" ")<0)?from.trim():"");
  var name=from.replace(/<[^>]*>/,"").replace(/"/g,"").trim();
  if(!name || name.indexOf("@")>=0) name="";
  return { email:(email||"").toLowerCase(), name:name };
}
function matchFolderBySubject(subject, folderNames){
  var s=String(subject||"").toLowerCase(); var best="";
  folderNames.forEach(function(n){ if(n && s.indexOf(String(n).toLowerCase())>=0 && n.length>best.length) best=n; });
  return best;
}
function b64ToBlob(b64, type){
  try{
    b64=String(b64||"").replace(/-/g,"+").replace(/_/g,"/");
    var bin=atob(b64); var len=bin.length; var arr=new Uint8Array(len);
    for(var i=0;i<len;i++) arr[i]=bin.charCodeAt(i);
    return new Blob([arr], { type:type||"application/pdf" });
  }catch(e){ return null; }
}
/* Llama al endpoint que lee Gmail, con reintento por token vencido. */
function callGmailCvs(query){
  var g=getGoogleTokens();
  if(!g || !g.access_token) return Promise.resolve({ ok:false, error:"no_google" });
  function attempt(tok){ return gmailPost("/api/gmail-cvs", { accessToken:tok, query:query, max:30 }); }
  return attempt(g.access_token).then(function(r){
    if(r && r.ok) return r;
    if(r && (r.error==="unauthorized" || r.__status===401) && g.refresh_token){
      return gmailPost("/api/google-refresh", { refreshToken:g.refresh_token }).then(function(nr){
        if(nr && nr.ok && nr.access_token){ g.access_token=nr.access_token; g.saved=Date.now(); setGoogleTokens(g); return attempt(g.access_token); }
        return { ok:false, error:"needs_relogin" };
      });
    }
    return r;
  });
}
function gmailImportCVs(){
  if(!(supaConfigured() && isLoggedIn())) return;
  if(!googleConnected()){ state.cvbank.importMsg="Iniciá sesión con Google para importar."; render(); return; }
  var folderNames=knownFolderNames();
  if(!folderNames.length){ state.cvbank.importMsg="Primero creá al menos una carpeta con el nombre del puesto (así puedo rutear por el asunto)."; render(); return; }
  // Rango de fechas (desde/hasta). Si no hay, usamos los últimos 180 días.
  var dateQ = "";
  var fromD = (state.cvbank.impFrom||"").trim();
  var toD = (state.cvbank.impTo||"").trim();
  if (fromD) dateQ += " after:" + fromD.replace(/-/g,"/");
  if (toD){
    try{ var d=new Date(toD+"T00:00:00"); d.setDate(d.getDate()+1); // "before" es exclusivo → +1 día para incluir el "hasta"
      dateQ += " before:" + d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0");
    }catch(e){ dateQ += " before:" + toD.replace(/-/g,"/"); }
  }
  if (!dateQ) dateQ = " newer_than:180d";
  var q = dateQ.trim() + " has:attachment filename:pdf (" + folderNames.map(function(n){ return 'subject:"'+String(n).replace(/"/g,"")+'"'; }).join(" OR ") + ")";
  state.cvbank.importing=true; state.cvbank.importMsg="Buscando CVs en tu Gmail…"; render();
  callGmailCvs(q).then(function(r){
    if(!r || !r.ok){
      state.cvbank.importing=false;
      state.cvbank.importMsg =
        (r && r.error==="insufficient_scope") ? "Falta el permiso de LECTURA de Gmail. Agregalo en Google Cloud (Acceso a los datos → gmail.readonly), después cerrá sesión y volvé a entrar con Google para aceptarlo." :
        (r && (r.error==="no_google" || r.error==="needs_relogin")) ? "Tu permiso de Google venció. Cerrá sesión y volvé a entrar con Google." :
        "No pude leer tu Gmail ahora. Probá de nuevo en un momento.";
      render(); return;
    }
    processImportedEmails(r.emails||[], folderNames);
  });
}
function processImportedEmails(emails, folderNames){
  var imported=0, skipped=0, noFolder=0, noPdf=0, noText=0;
  var existing=(state.cvbank.cvs||[]);
  function has(email, folder){
    if(!email) return false;
    return existing.some(function(c){ return (c.candidate_email||"").toLowerCase()===email && (c.folder||"")===(folder||""); });
  }
  var chain=Promise.resolve();
  emails.forEach(function(m, idx){
    chain=chain.then(function(){
      state.cvbank.importMsg="Procesando "+(idx+1)+"/"+emails.length+"…"; render();
      var folder=matchFolderBySubject(m.subject, folderNames);
      if(!folder){ noFolder++; return; }
      // SOLO importamos si vino un CV en PDF adjunto (evita traer mails que no son CVs).
      var pdfBlob = (m.pdf && m.pdf.dataBase64) ? b64ToBlob(m.pdf.dataBase64, "application/pdf") : null;
      if(!pdfBlob){ noPdf++; return; }
      var fromInfo=parseFromHeader(m.from);
      return extractPdfText(pdfBlob).then(function(text){
        text=(text||"").trim();
        if(text.length<25){ noText++; return; }
        var email = fromInfo.email || extractEmailFromText(text) || "";
        if(has(email, folder)){ skipped++; return; }
        var name = fromInfo.name || (m.pdf.filename ? m.pdf.filename.replace(/\.[^.]+$/,"") : "") || "Candidato (mail)";
        var up = audioUploadConfigured()
          ? uploadAudioToCloudinary(new File([pdfBlob], (m.pdf.filename||"cv.pdf"), { type:"application/pdf" })).catch(function(){ return ""; })
          : Promise.resolve("");
        return up.then(function(url){
          return dbCreateCV({ candidate_name:name, file_name:m.pdf.filename||"CV.pdf", cv_url:url||null, cv_text:text.slice(0,15000), candidate_email:email||null, folder:folder })
            .then(function(row){ imported++; if(row) existing.push(row); })
            .catch(function(){ skipped++; });
        });
      });
    });
  });
  chain.then(function(){
    state.cvbank.importing=false;
    var parts=[imported+" CV(s) en PDF importado(s)"];
    if(skipped) parts.push(skipped+" ya estaban / con error");
    if(noFolder) parts.push(noFolder+" sin carpeta que matchee el asunto");
    if(noPdf) parts.push(noPdf+" sin PDF adjunto (omitidos)");
    if(noText) parts.push(noText+" PDF sin texto legible");
    state.cvbank.importMsg="Listo: "+parts.join(" · ")+".";
    loadCVBank();
  });
}

            .then(function(){ okc++; done++; }).catch(function(){ done++; });
        });
      });
    });
  });
  chain.then(function(){
    state.cvbank.uploading=false;
    state.cvbank.msg=okc+" CV(s) agregados"+(okc<files.length?(" · "+(files.length-okc)+" no se pudieron leer"):"")+".";

/* Toma los CVs del repo y arma el payload para la IA (máx 25 por tanda). */
function cvPayloadFrom(cvs){
  return (cvs||[]).slice(0,25).map(function(c){ return { id:c.id, name:c.candidate_name||c.file_name||"", text:c.cv_text||"" }; })
    .filter(function(c){ return c.text && c.text.length>20; });

/* Crea una búsqueda nueva y la analiza. */
function doAnalyzeNewSearch(){
  var ns=state.newsearch;
  var title=(ns.title||"").trim(); var desc=(ns.description||"").trim();
  var must=(ns.must||"").trim(); var nice=(ns.nice||"").trim();
  if(!title){ state.searches.error2="Poné el puesto a cubrir."; render(); return; }
  var folder=ns.folder||"";
  var cvs=(state.cvbank.cvs||[]).filter(function(c){ return cvInFolder(c, folder); });
  var payload=cvPayloadFrom(cvs);
  if(!payload.length){ state.searches.error2=(folder?"No hay CVs con texto legible en esta carpeta. Elegí otra o subí CVs.":"No hay CVs con texto legible para analizar. Cargá algunos primero."); render(); return; }
  state.searches.note=(cvs.length>25)?("Se analizaron los primeros 25 de "+cvs.length+" CVs (por límite de una tanda). Podés dividir en más búsquedas si necesitás."):null;
  state.searches.analyzing=true; state.searches.error2=null; render();
  dbCreateSearch({ title:title, description:desc, must_have:must||null, nice_to_have:nice||null }).then(function(row){
    return screenCVsAPI(title, desc, payload, must, nice).then(function(res){
      if(!res || !res.ok) throw new Error((res&&res.error)||"analyze_failed");
      var when=new Date().toISOString();
      return dbUpdateSearch(row.id, { results:res.ranking, analyzed_at:when }).then(function(updated){
        state.searches.analyzing=false;
        state.searches.current = updated || Object.assign({}, row, { results:res.ranking, analyzed_at:when });
        state.newsearch={ title:"", description:"", must:"", nice:"", folder:"" };
        state.searches.items=null; state.searches.rankSel=[];
        state.screen="cv-ranking"; render();
      });
    });
  }).catch(function(e){
    state.searches.analyzing=false;
    state.searches.error2=(e&&e.message==="network")?"No pude conectar. Revisá tu conexión.":"No pude completar el análisis. Probá de nuevo en un momento.";
    render();
  });
}
/* Re-analiza la búsqueda actual con los CVs actuales del repo. */
function doReanalyze(){
  var x=state.searches.current; if(!x) return;
  var run=function(cvs){
    var payload=cvPayloadFrom(cvs);
    if(!payload.length){ state.searches.error2="No hay CVs con texto para analizar."; render(); return; }

/* ---------------- self-contained invite link (works on any device, no server) ---------------- */
function encodePayload(obj){
  try{
    var json = JSON.stringify(obj);
    var b64 = btoa(unescape(encodeURIComponent(json)));
    return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  } catch(e){ return ""; }
}
function decodePayload(str){
  try{
    var b64 = String(str).replace(/-/g,'+').replace(/_/g,'/');
    while (b64.length % 4) b64 += '=';
    var json = decodeURIComponent(escape(atob(b64)));
    return JSON.parse(json);
  } catch(e){ return null; }
}
function stripQuestions(qs){
  return qs.map(function(q){ return { id:q.id, text:q.text, category:q.category, seconds:q.seconds, lang:q.lang, isFollowup:!!q.isFollowup, rootId:q.rootId, depth:q.depth||0, reason:q.reason||"" }; });
}
function buildInvitePayload(){
  var c = state.config;
  return {
    v:1, code:state.code, id:state.interviewId||"",
    position:c.position, company:c.company, focus:c.focus||"",
    level:c.level||"Semi-Senior", language:c.language||"es", followups:c.followups!==false,
    recruiterEmail:c.recruiterEmail||"",
    brandName: (state.brand&&state.brand.name)||"", brandLogo: (state.brand&&state.brand.logo)||"",
    questions: stripQuestions(state.questions)
  };

/* Dominio de producción por defecto. Se usa solo cuando la página no corre
   sobre una URL pública propia (por ej. la previsualización dentro de claude.ai).
   Cuando la app corre en su sitio real, se usa ESE dominio automáticamente,
   así que si cambiás de dominio no hace falta tocar nada acá. */
var PROD_BASE = "https://entrevistas-two.vercel.app/";
function pageBaseUrl(){
  if (typeof window==="undefined" || !window.location) return "";
  var loc = window.location;
  if (!/^https?:$/.test(loc.protocol)) return "";
  var h = loc.hostname || "";
  // Si la página corre dentro de la previsualización de claude.ai (u hosts de sandbox),
  // la app NO está publicada ahí: caemos a PROD_BASE para que el link funcione.
  if (/claude|anthropic|usercontent/i.test(h)) return "";
  // En el sitio real (vercel.app o tu dominio propio) usamos el dominio actual.
  return loc.origin + loc.pathname;
}
function computeInviteLink(){
  var base = (pageBaseUrl() || PROD_BASE).replace(/[?#].*$/, "");
  // Si la entrevista quedó guardada en la base, usamos un LINK CORTO con solo el código
  // (la app la carga por código). Es mucho más presentable que el link largo.
  if (supaConfigured() && state.interviewId && state.code){
    return base + "?c=" + encodeURIComponent(state.code);
  }
  // Respaldo (modo local sin base): link autocontenido con todo embebido.
  var token = encodePayload(buildInvitePayload());
  if (!token) return state.shareLink || "";
  return base + "#e=" + token;
}

/* El reloj arranca cuando APARECE la pregunta, así que al tiempo de respuesta
   le sumamos un margen para leer y pensar la consigna, proporcional a su largo. */
function readingBuffer(text){
  var words = (String(text||"").trim().match(/\S+/g) || []).length;
  return Math.round(14 + Math.min(20, words * 0.5));
}
function questionTime(q, forCandidate){
  var base = (q && q.seconds) || 90;
  return forCandidate ? base + readingBuffer(q && q.text) : base;
}

function fillTpl(tpl, cfg){
  var focoLine = cfg.focus ? ("Dijiste que uno de los focos a evaluar es \"" + cfg.focus + "\". Contame una situación concreta donde lo hayas puesto en práctica.") : "";
  return tpl

    .replace(/\{empresaShort\}/g, shortEmpresa(cfg.company))
    .replace(/\{focoLine\}/g, focoLine);
}
function pickTemplates(lang, cat, n, cfg){
  var bank = (QBANK[lang] && QBANK[lang][cat]) ? QBANK[lang][cat].slice() : QBANK.es[cat].slice();
  var out = [], used = {};
  for (var i=0; i<n; i++){
    var pool = bank.filter(function(t,idx){ return !used[idx]; });
    if (!pool.length){ pool = bank; used = {}; }
    var idx = bank.indexOf(pick(pool));
    used[idx] = true;
    var text = fillTpl(bank[idx], cfg);
    if (!text.trim()) { i--; continue; }
    out.push(text);
  }
  return out;
}

function buildQuestions(cfg){
  var n;
  if (cfg.count === "auto"){
    n = cfg.level === "Junior" ? 7 : cfg.level === "Senior" ? 8 : cfg.level === "Gerencial" ? 9 : 7;
  } else { n = parseInt(cfg.count,10) || 7; }
  n = clamp(n, 5, 12);

  var middle = ["Experiencia","Competencias","Situacional","Motivación y cultura"];
  var seq = ["Presentación"];
  var ci = 0;
  while (seq.length < n-1){ seq.push(middle[ci % middle.length]); ci++; }
  seq.push("Cierre");

  var mainLang = cfg.language;
  var englishSlots = [];
  if (mainLang === "es" && cfg.includeEnglish){
    var mid = [];
    for (var i=1;i<seq.length-1;i++) mid.push(i);
    while (englishSlots.length < 2 && mid.length){
      var pi = Math.floor(Math.random()*mid.length);
      englishSlots.push(mid[pi]); mid.splice(pi,1);
    }
  }

  var counters = {};
  var qs = seq.map(function(cat, i){
    counters[cat] = (counters[cat]||0);
    var lang = englishSlots.indexOf(i) >= 0 ? "en" : mainLang;
    var tplLang = lang === "es" ? "es" : lang;
    var text = pickTemplates(tplLang, cat, counters[cat]+1, cfg)[counters[cat]];
    counters[cat]++;
    return {
      id: "q"+i,
      text: text,
      category: cat,
      seconds: SECONDS_BY_CAT[cat] || 90,
      lang: lang
    };
  });
  return qs;
}

function makeFollowup(q, reasonKind){

  var reason = reasonKind === "delivery"
    ? "Se detectaron pausas largas o muletillas; conviene pedir que lo resuma con claridad."
    : "La respuesta fue breve o genérica; conviene pedir un ejemplo concreto.";
  var root = q.rootId || q.id;
  return {
    id: root + "-f" + Date.now() + Math.floor(Math.random()*99),
    text: text, category: "Repregunta",
    seconds: 135, lang: q.lang,
    isFollowup: true, rootId: root, depth: (q.depth||0)+1, reason: reason
  };

/* ---------------- local heuristic evaluation (no network / no LLM) ----------------
   Puntaje EXIGENTE y honesto. Mide completitud, desarrollo y fluidez de cada
   respuesta — NO comprende el contenido (eso requeriría una IA). Arranca de cero
   y cada respuesta suma según cuánto se desarrolló; las respuestas vacías, de una
   palabra o genéricas casi no suman. */
function answerQuality(a){
  // Devuelve 0..1 para una respuesta y una etiqueta de estado.
  if (!a || (!a.transcript && !a.blobUrl)) return { q:0, status:"sin responder" };
  var text = a.transcript || "";
  var m = speechMetrics(text);
  var w = m.words;
  var dur = (a.signals && a.signals.durationSec) || 0;
  // Sin transcripción utilizable: si grabó algo audible, crédito mínimo; si no, casi nada.
  if (w < 3){
    if (a.blobUrl && a.signals && a.signals.spoke && dur >= 4) return { q:0.12, status:"muy breve" };
    return { q:0, status:"insuficiente" };
  }
  var base;
  if (w < 8) base = 0.12;
  else if (w < 18) base = 0.32;
  else if (w < 35) base = 0.55;
  else if (w < 60) base = 0.78;
  else if (w < 110) base = 0.92;
  else base = 1.0;
  // Penalizaciones por muletillas y dudas.
  base -= Math.min(0.30, m.fillerRatio * 1.6);
  if (isHesitant(a)) base -= 0.15;
  // Respuestas larguísimas pero muy dubitativas no deberían quedar altas.
  base = clamp(base, 0, 1);
  var status = base >= 0.7 ? "sólida" : base >= 0.45 ? "aceptable" : base >= 0.2 ? "floja" : "muy breve";
  return { q:base, status:status };
}
function evaluateLocally(questions, answers, cfg){
  var per = questions.map(function(q){ var r = answerQuality(answers[q.id]); r.q_id=q.id; r.text=q.text; r.category=q.category; return r; });
  var n = questions.length || 1;
  var answeredN = per.filter(function(r){ return r.status !== "sin responder"; }).length;
  var insufficientN = per.filter(function(r){ return r.q < 0.2; }).length; // incluye sin responder + insuficientes
  var solidN = per.filter(function(r){ return r.q >= 0.7; }).length;
  var totalQ = per.reduce(function(s,r){ return s + r.q; }, 0);
  var overallQuality = totalQ / n; // 0..1, las no respondidas cuentan como 0

  // Puntaje de 1 a 10, exigente: 0 desarrollo => 1 ; desarrollo pleno => 10.
  var score = clamp(Math.round((1 + 9 * overallQuality) * 2) / 2, 1, 10);

  // Métricas de expresión (solo sobre lo efectivamente respondido).
  var respondedTexts = per.filter(function(r){ return r.status !== "sin responder"; });
  var fillerArr = respondedTexts.map(function(r){ return speechMetrics(answers[r.q_id].transcript||"").fillerRatio; });
  var avgFiller = fillerArr.length ? fillerArr.reduce(function(a,b){return a+b;},0)/fillerArr.length : 0;
  var hesitantN = per.filter(function(r){ var a=answers[r.q_id]; return a && isHesitant(a); }).length;
  var hesitantRate = answeredN ? hesitantN/answeredN : 0;

  // Puntaje POR PREGUNTA (1-10), fusionando cada repregunta con su pregunta madre.
  var nById = {}; questions.forEach(function(q,i){ nById[q.id]=i+1; });
  var qualAssess = function(mq, merged){
    var base = mq>=0.7 ? "Respuesta sólida y desarrollada." : mq>=0.45 ? "Respuesta aceptable pero mejorable." : mq>=0.2 ? "Respuesta floja o poco desarrollada." : "Respuesta insuficiente o sin responder.";
    return base + (merged ? " (evaluada junto a su repregunta)" : "");
  };
  var perQuestion = questions.filter(function(q){ return !q.isFollowup; }).map(function(q){
    var quals = [ answerQuality(answers[q.id]).q ];
    questions.forEach(function(f){ if(f.isFollowup && f.rootId===q.id){ quals.push(answerQuality(answers[f.id]).q); } });
    var mq = quals.reduce(function(s,v){ return s+v; },0)/quals.length;
    var qscore = clamp(Math.round((1 + 9*mq)*2)/2, 1, 10);
    return { n: nById[q.id], score: qscore, assessment: qualAssess(mq, quals.length>1) };
  });
  // El puntaje general surge del promedio de las preguntas principales.
  if (perQuestion.length){ score = clamp(Math.round((perQuestion.reduce(function(s,p){ return s+p.score; },0)/perQuestion.length)*2)/2, 1, 10); }
  var recommendation = verdictFromScore(score);

  var strengths = [];
  if (solidN >= Math.ceil(n*0.6)) strengths.push("Desarrolló con buen nivel de detalle la mayoría de las respuestas.");
  else if (solidN >= 2) strengths.push("Algunas respuestas (" + solidN + ") fueron sólidas y desarrolladas.");
  if (answeredN === n && insufficientN === 0) strengths.push("Respondió todas las preguntas con contenido suficiente.");
  if (avgFiller < 0.05 && answeredN) strengths.push("Se expresa con fluidez, sin muletillas frecuentes.");
  if (hesitantRate < 0.2 && answeredN) strengths.push("Se mostró seguro/a y sin dudas marcadas al hablar.");
  if (!strengths.length) strengths.push("No se identificaron fortalezas destacables a partir de las respuestas registradas.");

  var improve = [];
  if (insufficientN > 0) improve.push(insufficientN + " de " + n + " respuestas quedaron sin responder o sin desarrollar (respuestas vacías o de muy pocas palabras).");
  if (answeredN < n) improve.push("Dejó " + (n - answeredN) + " pregunta(s) sin responder.");
  if (overallQuality < 0.35) improve.push("El nivel de desarrollo general fue bajo: las respuestas no alcanzan para evaluar competencias con seriedad.");
  if (avgFiller >= 0.12) improve.push("Uso frecuente de muletillas (eh, este, o sea); conviene trabajar la fluidez.");
  if (hesitantRate >= 0.35) improve.push("Pausas largas o dudas en varias respuestas, posible inseguridad con los temas.");
  if (!improve.length) improve.push("No se detectaron debilidades relevantes en las respuestas registradas.");

  // Repreguntas sugeridas: las respuestas más flojas (pero respondidas) primero.
  var weakest = per.filter(function(r){ return r.status !== "sin responder"; }).sort(function(a,b){ return a.q - b.q; });
  var probes = weakest.slice(0,2).map(function(r){
    return "Volver a preguntar sobre “" + r.text.slice(0,70) + (r.text.length>70?"…":"") + "” pidiendo un ejemplo concreto y medible.";
  });
  if (!probes.length) probes.push("Profundizar con un caso práctico vinculado al puesto en la próxima instancia.");

      (hesitantRate>=0.3 ? "Mostró pausas o dudas en varias respuestas." : "Se mostró, en general, seguro/a al responder.");
  }

  return { overall: overall, score: score, recommendation: recommendation, strengths: strengths, improve: improve, probes: probes,

           meta: { answeredN:answeredN, total:n, insufficientN:insufficientN, solidN:solidN, overallQuality:Math.round(overallQuality*100) } };

function DashboardList(){
  var d = state.dash;
  if (d.loading || d.items===null) return '<div class="center-block">'+ic('loader',26,'spin')+'<p>Cargando entrevistas…</p></div>';
  if (d.error) return Note("err", esc(d.error)) + '<button class="btn btn-ghost btn-sm" data-action="reload-dash">'+ic('rotate',14)+' Reintentar</button>';
  if (!d.items.length) return '<div class="center-block" style="padding:30px 12px">'+ic('list',26)+'<h2 style="font-size:16px">Todavía no hay entrevistas</h2><p>Acá van a aparecer las entrevistas que hagas, con su puntaje. Para empezar, creá la primera y compartí el link al candidato.</p><button class="btn btn-primary btn-sm" data-action="go-config" style="margin-top:12px">'+ic('sparkle',14)+' Crear mi primera entrevista</button></div>';
  var completed = d.items.filter(function(x){return x.status==='completed';});
  var pend = d.items.filter(function(x){return x.status!=='completed';});
  var nApr = completed.filter(function(x){return x.score>=7;}).length;
  var nMed = completed.filter(function(x){return x.score>=5&&x.score<7;}).length;
  var nDes = completed.filter(function(x){return typeof x.score==='number' && x.score<5;}).length;
  var f = d.filter || "all";
  function fpill(key,label,bg,color,count){
    var active = (f===key);
    return '<button class="pill-time" data-action="dash-filter" data-f="'+key+'" style="cursor:pointer;border:none;background:'+bg+';color:'+color+';'+(active?'box-shadow:0 0 0 2px '+color+';font-weight:800':'opacity:.8')+'">'+count+' '+label+'</button>';
  }
  var html = '';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">' +
    fpill("all","todas","var(--surface-2)","var(--ink)",d.items.length) +
    fpill("aprobados","aprobados","var(--green-tint)","var(--green)",nApr) +
    fpill("medios","medios","var(--amber-tint)","var(--amber)",nMed) +
    fpill("desaprobados","desaprobados","var(--brick-tint)","var(--brick)",nDes) +
    fpill("pendientes","pendientes","var(--surface-2)","var(--muted)",pend.length) +
  '</div>';
  // Filtro aplicado
  var shown = d.items.filter(function(x){
    if (f==="all") return true;
    var done = x.status==='completed';
    if (f==="pendientes") return !done;
    if (!done) return false;
    var sc = x.score;
    if (f==="aprobados") return sc>=7;
    if (f==="medios") return sc>=5 && sc<7;
    if (f==="desaprobados") return typeof sc==='number' && sc<5;
    return true;
  });
  if (!shown.length) return html + '<div class="center-block" style="padding:24px 12px">'+ic('list',24)+'<p>No hay entrevistas en este filtro.</p></div>';
  html += '<div style="display:grid;gap:10px">';
  shown.forEach(function(x){
    var done = x.status==='completed';
    var sc = (typeof x.score==='number')?x.score:null;
    var name = x.candidate_name || (done?'(sin nombre)':'Pendiente');
    var badge = done && sc!=null
      ? '<span style="flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;background:'+scoreTintVar(sc)+';color:'+scoreColorVar(sc)+'" class="mono">'+sc+'</span>'
      : '<span style="flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted)">'+ic('clock',18)+'</span>';
    html += '<div class="qa-item" '+(done?'data-action="open-detail" data-id="'+esc(x.id)+'" style="cursor:pointer;display:flex;align-items:center;gap:14px"':'style="display:flex;align-items:center;gap:14px;opacity:.85"')+'>' +
      badge +
      '<div style="flex:1;min-width:0">' +
        '<p style="margin:0;font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(name)+'</p>' +
        '<p style="margin:2px 0 0;font-size:12.5px;color:var(--muted)">'+esc(x.position||'')+(done?(' · '+esc(x.recommendation||'')):' · pendiente')+'</p>' +
        '<p style="margin:2px 0 0;font-size:11.5px;color:var(--muted)">'+esc(fmtDate(x.completed_at||x.created_at))+' · código '+esc(x.code||'')+'</p>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0">' +
        (done ? ic('chevron',16) : '<span style="font-size:11px;color:var(--muted)">pendiente</span>') +
        '<button class="dl-audio" data-action="del-interview" data-id="'+esc(x.id)+'" title="Eliminar" style="background:none;border:none;color:var(--brick);cursor:pointer;font-size:11px;display:inline-flex;align-items:center;gap:3px">'+ic('trash',12)+' Eliminar</button>' +
      '</div>' +
    '</div>';
  });
  html += '</div>';
  return html;
}

          (works

               '<span style="font-size:12px;color:var(--muted)">Sale</span><div class="input-row" style="max-width:118px;background:var(--surface)"><input class="wk-out" data-day="'+d[0]+'" type="time" value="'+esc(sh.out||"")+'"></div>')

    } else {
      var wn=parseInt(f.work_n,10)||5, on=parseInt(f.off_n,10)||2;
      html += '<div class="grid2" style="gap:14px">' +
          '<label class="field"><span class="field-label">Días de trabajo (N)</span><div class="input-row" style="max-width:120px"><input id="f_emp_workn" type="number" min="1" value="'+esc(String(f.work_n!=null?f.work_n:5))+'"></div></label>' +
          '<label class="field"><span class="field-label">Días de franco (M)</span><div class="input-row" style="max-width:120px"><input id="f_emp_offn" type="number" min="1" value="'+esc(String(f.off_n!=null?f.off_n:2))+'"></div></label>' +
        '</div>' +
        '<div class="grid2" style="gap:14px">' +
          '<label class="field"><span class="field-label">Hora de entrada</span><div class="input-row"><input id="f_emp_shiftin" type="time" value="'+esc(f.shift_in||"")+'"></div></label>' +
          '<label class="field"><span class="field-label">Hora de salida</span><div class="input-row"><input id="f_emp_shiftout" type="time" value="'+esc(f.shift_out||"")+'"></div></label>' +
        '</div>' +
        '<label class="field"><span class="field-label">Primer día de trabajo del ciclo</span><div class="input-row" style="max-width:220px"><input id="f_emp_corrstart" type="date" value="'+esc(f.rotation_start||"")+'"></div><span class="field-hint">Ej: '+wn+'x'+on+' → trabaja '+wn+' días y libra '+on+'; el ciclo se repite y el franco se va corriendo de día.</span></label>';
    }
  }
  html += '</div></div>';
  // Firma digital
  var signName=(f.signature_name!=null && f.signature_name!=="")?f.signature_name:((f.first_name||"")+" "+(f.last_name||"")).trim();
  var signFontId=parseInt(f.signature_font,10)||1;

    '<label class="field" style="margin-bottom:12px"><span class="field-label">Nombre a firmar</span><div class="input-row"><input id="f_emp_signname" value="'+esc(signName)+'" placeholder="Nombre y apellido"></div></label>' +
    '<span class="field-label" style="display:block;margin-bottom:8px">Estilo de firma</span>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">' +
      SIGN_FONTS.map(function(sf){ var on=(signFontId===sf.id); return '<button type="button" data-action="emp-sign-font" data-f="'+sf.id+'" style="cursor:pointer;text-align:left;border:2px solid '+(on?'var(--teal)':'var(--border)')+';border-radius:12px;padding:12px 14px;background:'+(on?'var(--teal-tint)':'var(--surface)')+'">' +
        '<div style="min-height:36px;display:flex;align-items:center;overflow:hidden">'+ (signName? ('<span style="font-family:'+sf.css+';'+sf.style+';font-size:24px;color:var(--ink);white-space:nowrap">'+esc(signName)+'</span>') : ('<span style="font-family:'+sf.css+';'+sf.style+';font-size:24px;color:var(--muted)">Firma</span>')) +'</div>' +
        '<div style="font-size:11px;color:'+(on?'var(--teal-strong)':'var(--muted)')+';font-weight:700;margin-top:6px">'+(on?ic('check',11)+' ':'')+esc(sf.label)+'</div>' +
      '</button>'; }).join('') +
    '</div>' +
    (signName?('<div style="margin-top:12px;padding:14px 16px;background:var(--surface-2);border-radius:10px"><span style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Vista previa</span>'+signatureHtml(signName, signFontId, 34)+'</div>'):'') +
  '</div>';
  // Documentación
  html += '<div class="card" style="margin-bottom:14px"><h3 style="font-size:14px;color:var(--teal);margin:0 0 6px">Documentación</h3>' +
    '<p style="font-size:12.5px;color:var(--muted);margin:0 0 12px">Adjuntá CV, títulos, certificados o contrato (PDF o imagen, máx. 10 MB c/u).</p>' +
    (!audioUploadConfigured()?Note("info","Para adjuntar archivos falta configurar Cloudinary. Igual podés guardar el resto del legajo."):'') +
    '<div style="display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:10px">' +
      '<label class="field" style="flex:0 0 auto"><span class="field-label">Tipo</span><select class="bare" id="f_emp_doclabel" style="min-width:130px">'+DOCLABELS.map(function(o){ return '<option'+((f.docLabel||"CV")===o?' selected':'')+'>'+o+'</option>'; }).join('')+'</select></label>' +
      '<label class="field" style="flex:1;min-width:180px"><span class="field-label">Archivo</span><input id="f_emp_docfile" type="file" accept=".pdf,application/pdf,image/*" style="width:100%;font-size:13px;color:var(--muted)"></label>' +
    '</div>' +
    (f.upMsg?'<p style="font-size:12px;color:'+(/No pude|supera/.test(f.upMsg)?'var(--brick)':'var(--teal)')+';margin:0 0 10px">'+(f.uploading?ic('loader',12,'spin')+' ':'')+esc(f.upMsg)+'</p>':'') +
    (f.documents && f.documents.length ? ('<div style="display:grid;gap:8px">'+f.documents.map(function(d,i){
      return '<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface-2);border-radius:10px">' +
        '<span style="flex-shrink:0;font-size:11px;font-weight:700;color:var(--teal);background:var(--teal-tint);padding:3px 8px;border-radius:999px">'+esc(d.label||'Doc')+'</span>' +
        '<a href="'+esc(d.url)+'" target="_blank" rel="noopener" style="flex:1;min-width:0;font-size:13px;color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(d.filename||'archivo')+'</a>' +
        '<button class="dl-audio" data-action="emp-doc-del" data-idx="'+i+'" style="background:none;border:none;color:var(--brick);cursor:pointer;font-size:11px">quitar</button>' +
      '</div>';
    }).join('')+'</div>') : '<p style="font-size:12.5px;color:var(--muted);margin:0">Sin documentos cargados todavía.</p>') +
  '</div>';
  // Notas
  html += '<div class="card" style="margin-bottom:14px"><h3 style="font-size:14px;color:var(--teal);margin:0 0 12px">Notas (opcional)</h3>' +
    '<div class="input-row" style="align-items:flex-start"><span style="color:var(--muted);margin-top:2px">'+ic('list',15)+'</span><textarea id="f_emp_notes" rows="3" placeholder="Observaciones internas sobre el empleado.">'+esc(f.notes||"")+'</textarea></div>' +
  '</div>';
  html += '<div class="flex-actions">' +
    '<button class="btn btn-primary" id="saveEmpBtn" '+(f.saving?'disabled':'')+'>'+(f.saving?ic('loader',15,'spin')+' Guardando…':ic('check',15)+' '+(isEdit?'Guardar cambios':'Guardar legajo'))+'</button>' +
    (isEdit?'<button class="btn btn-ghost" data-action="emp-del" data-id="'+esc(f.id)+'" style="color:var(--brick)">'+ic('trash',14)+' Eliminar legajo</button>':'') +
    '<button class="btn btn-ghost" data-action="go-legajo" style="margin-left:auto">Cancelar</button>' +
  '</div>';
  return html;
};

/* ---- ABM: lista de empleados para registrar movimientos ---- */

  html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px">' +
    '<div style="display:flex;align-items:center;gap:8px;color:var(--teal)">'+ic('plus',20)+'<h2 style="font-size:18px;color:var(--ink)">Altas, bajas y modificaciones</h2></div>' +
    '<button class="btn btn-primary btn-sm" data-action="emp-new">'+ic('plus',14)+' Alta de empleado</button>' +
  '</div>';
  html += '<p style="font-size:13px;color:var(--muted);margin:0 0 16px">Registrá el historial laboral de cada empleado: alta, cambios de puesto, ascensos, cambios salariales y baja. Tocá un empleado para ver y cargar sus movimientos.</p>';

  html += '<div class="input-row" style="margin-bottom:12px"><span style="color:var(--muted)">'+ic('eye',14)+'</span><input id="f_abm_search" type="text" placeholder="Buscar por N° de legajo, nombre o DNI…" value="'+esc(e.search||"")+'" autocomplete="off"></div>';
  html += '<div id="abmList" style="display:grid;gap:8px">';
  e.items.forEach(function(x){
    var inactive=(x.status==="inactivo");
    var skey = ((x.legajo_number||"")+" "+empFullName(x)+" "+(x.dni||"")+" "+(x.position||"")).toLowerCase();
    html += '<div class="qa-item abmrow" data-search="'+esc(skey)+'" style="cursor:pointer'+(inactive?';opacity:.65':'')+'" data-action="mov-open" data-id="'+esc(x.id)+'">' +
      '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
        '<span style="flex-shrink:0;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--teal-tint);color:var(--teal);font-weight:800">'+esc((empFullName(x)[0]||"?").toUpperCase())+'</span>' +
        '<div style="flex:1;min-width:140px">' +
          '<p style="margin:0;font-weight:700;font-size:14.5px;color:var(--ink)">'+esc(empFullName(x))+(x.legajo_number?(' <span style="font-size:11px;color:var(--muted)">· leg. '+esc(x.legajo_number)+'</span>'):'')+'</p>' +
          '<p style="margin:2px 0 0;font-size:12px;color:'+(inactive?'var(--brick)':'var(--muted)')+'">'+esc(x.position||'—')+' · '+(inactive?'Baja'+(x.termination_reason?(' ('+esc(x.termination_reason)+')'):''):'Activo')+'</p>' +
        '</div>' +
        '<span style="color:var(--muted)">'+ic('chevron',16)+'</span>' +
      '</div>' +
    '</div>';
  });

/* ---- ABM: movimientos de un empleado ---- */
Screens["emp-movements"] = function(){
  var a = state.abm; if(!a || !a.emp){ return Header() + Centered(ic('alert',24), "No hay empleado seleccionado", "Volvé al listado."); }
  var e = a.emp; var f = a.form; var inactive=(e.status==="inactivo");
  var html = Header();
  html += backlink("go-abm","Volver a ABM");
  // Encabezado del empleado
  html += '<div class="card" style="margin-bottom:14px">' +
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
      '<span style="flex-shrink:0;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--teal-tint);color:var(--teal);font-weight:800;font-size:18px">'+esc((empFullName(e)[0]||"?").toUpperCase())+'</span>' +
      '<div style="flex:1;min-width:0">' +
        '<h2 style="font-size:17px;margin:0;color:var(--ink)">'+esc(empFullName(e))+'</h2>' +
        '<p style="margin:2px 0 0;font-size:12.5px;color:var(--muted)">'+(e.legajo_number?('Legajo '+esc(e.legajo_number)+' · '):'')+esc(e.position||'—')+(e.category?(' · '+esc(e.category)):'')+(e.salary?(' · '+esc(e.salary)):'')+'</p>' +
      '</div>' +
      '<span class="rec-tag" style="background:'+(inactive?'var(--brick)':'var(--green)')+';color:#fff;font-size:12px">'+(inactive?'Baja':'Activo')+'</span>' +
    '</div>' +
    (inactive && (e.termination_date||e.termination_reason) ? '<p style="margin:10px 0 0;font-size:12.5px;color:var(--brick)">Desvinculado'+(e.termination_date?(' el '+esc(e.termination_date)):'')+(e.termination_reason?(' · '+esc(e.termination_reason)):'')+'</p>' : '') +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">' +
      '<button class="btn btn-ghost btn-sm" data-action="emp-open" data-id="'+esc(e.id)+'">'+ic('file',14)+' Ver ficha completa</button>' +
      (e.email?'<a class="btn btn-ghost btn-sm" href="mailto:'+esc(e.email)+'">'+ic('mail',14)+' '+esc(e.email)+'</a>':'') +
    '</div>' +
  '</div>';
  if (a.msg) html += Note("ok", esc(a.msg));
  // Formulario de registro (si el empleado está activo o para registrar baja)
  html += '<div class="card" style="margin-bottom:14px"><h3 style="font-size:14px;color:var(--teal);margin:0 0 12px">Registrar movimiento</h3>';
  if (f.error) html += Note("err", esc(f.error));
  html += '<div style="display:grid;gap:14px">' +
    '<div class="grid2" style="gap:14px">' +
      '<label class="field"><span class="field-label">Tipo</span><select class="bare" id="f_mov_type">' +
        Object.keys(MOV_TYPES).filter(function(k){ return k!=="alta"; }).map(function(k){ return '<option value="'+k+'"'+(f.type===k?' selected':'')+'>'+MOV_TYPES[k].label+'</option>'; }).join('') +
      '</select></label>' +
      '<label class="field"><span class="field-label">Fecha</span><div class="input-row"><input id="f_mov_date" type="date" value="'+esc(f.date||"")+'"></div></label>' +
    '</div>';
  if (f.type==="cambio_puesto" || f.type==="ascenso"){
    html += '<div class="grid2" style="gap:14px">' +
      empInput("f_mov_to","Nuevo puesto",f.to,"","Ej: Encargado de local","Actual: "+esc(e.position||"—")) +
      empInput("f_mov_to2","Nueva categoría (opcional)",f.to2,"","Ej: Categoría A","Actual: "+esc(e.category||"—")) +
    '</div>';
  } else if (f.type==="cambio_salarial"){
    html += empInput("f_mov_to","Nuevo salario",f.to,"","Ej: $950.000","Actual: "+esc(e.salary||"—"));
  } else if (f.type==="baja"){
    html += '<label class="field"><span class="field-label">Motivo de desvinculación</span><select class="bare" id="f_mov_reason">' +
      BAJA_REASONS.map(function(o){ return '<option'+((f.reason||"")===o?' selected':'')+'>'+o+'</option>'; }).join('') +
    '</select><span class="field-hint">Al registrar la baja, el empleado queda como «inactivo».</span></label>';
  }
  html += '<label class="field"><span class="field-label">Observaciones (opcional)</span><div class="input-row" style="align-items:flex-start"><span style="color:var(--muted);margin-top:2px">'+ic('list',15)+'</span><textarea id="f_mov_notes" rows="2" placeholder="Detalle del movimiento.">'+esc(f.notes||"")+'</textarea></div></label>';
  html += '<button class="btn btn-primary" id="saveMovBtn" style="align-self:flex-start" '+(f.saving?'disabled':'')+'>'+(f.saving?ic('loader',15,'spin')+' Registrando…':ic('check',15)+' Registrar movimiento')+'</button>';
  html += '</div></div>';
  // Historial (timeline)
  html += '<div style="display:flex;align-items:center;gap:8px;margin:18px 0 10px;color:var(--teal)">'+ic('rotate',18)+'<h3 style="font-size:15px;color:var(--ink)">Historial de movimientos</h3></div>';
  if (a.loading || a.movements===null){ html += '<div class="center-block" style="padding:24px">'+ic('loader',24,'spin')+'<p>Cargando…</p></div>'; }
  else if (!a.movements.length){ html += '<p style="font-size:13px;color:var(--muted)">Todavía no hay movimientos registrados.</p>'; }
  else {
    html += '<div style="display:grid;gap:10px">';
    a.movements.forEach(function(m){
      var mt = MOV_TYPES[m.type] || { label:m.type, color:"var(--muted)" };
      html += '<div class="qa-item" style="border-left:3px solid '+mt.color+'">' +
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<span style="font-size:11px;font-weight:800;color:#fff;background:'+mt.color+';padding:3px 9px;border-radius:999px">'+esc(mt.label)+'</span>' +
          '<span style="font-size:12px;color:var(--muted)">'+esc(m.effective_date||fmtDate(m.created_at)||"")+'</span>' +
        '</div>' +
        (m.description?'<p style="margin:8px 0 0;font-size:13.5px;color:var(--ink)">'+esc(m.description)+'</p>':'') +
        (m.reason && m.type!=="baja"?'<p style="margin:4px 0 0;font-size:12.5px;color:var(--muted)">Motivo: '+esc(m.reason)+'</p>':'') +
        (m.notes?'<p style="margin:4px 0 0;font-size:12.5px;color:var(--muted)">'+esc(m.notes)+'</p>':'') +
      '</div>';
    });
    html += '</div>';
  }
  return html;
};

/* Fila de estado del día (foto a la izquierda + a tiempo/tarde + salida temprana con justificar). */

function asistPunchRowHtml(p){
  var col=p.type==="entrada"?"var(--green)":"var(--brick)";
  var nm=p.name_entered||"(sin nombre)";
  var maps=(p.lat!=null&&p.lng!=null)?("https://www.google.com/maps?q="+p.lat+","+p.lng):"";
  return '<div class="qa-item" style="border-left:3px solid '+col+'">' +
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
      (p.photo_url?'<a href="'+esc(p.photo_url)+'" target="_blank" rel="noopener" style="flex-shrink:0"><img src="'+esc(p.photo_url)+'" alt="" style="width:44px;height:44px;border-radius:8px;object-fit:cover"></a>':'<span style="flex-shrink:0;width:44px;height:44px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted)">'+ic('users',18)+'</span>') +
      '<div style="flex:1;min-width:120px"><p style="margin:0;font-weight:700;font-size:13.5px;color:var(--ink)">'+esc(nm)+(p.legajo_number?(' <span style="font-size:11px;color:var(--muted)">· leg. '+esc(p.legajo_number)+'</span>'):(p.dni?(' <span style="font-size:11px;color:var(--muted)">· DNI '+esc(p.dni)+'</span>'):''))+'</p>' +
      '<p style="margin:2px 0 0;font-size:12px;color:var(--muted)"><span style="color:'+col+';font-weight:700;text-transform:uppercase">'+esc(p.type)+'</span> · '+esc(tsHM(p.punched_at))+(maps?(' · <a href="'+esc(maps)+'" target="_blank" rel="noopener" style="color:var(--teal);text-decoration:none">ubicación</a>'):'')+(!p.employee_id?' · <span style="color:var(--brick)">sin match</span>':'')+'</p></div>' +
      '<button class="dl-audio" data-action="asist-del" data-id="'+esc(p.id)+'" title="Eliminar fichada" style="background:none;border:none;color:var(--brick);cursor:pointer;font-size:11px">'+ic('trash',13)+' eliminar</button>' +
    '</div>' +
  '</div>';

function asistSummaryRowHtml(r){
  var estado;
  if(r.estadoKind==="tarde") estado='<span style="color:var(--amber);font-weight:700">Tarde '+fmtMinDur(r.late)+'</span>';
  else if(r.estadoKind==="atiempo") estado='<span style="color:var(--green);font-weight:700">A tiempo</span>';
  else if(!r.matched) estado='<span style="font-size:11px;color:var(--brick)">sin match</span>';
  else estado='<span style="font-size:11px;color:var(--muted)">sin turno</span>';
  var geoP=(r.entrada&&r.entrada.lat!=null&&r.entrada.lng!=null)?r.entrada:((r.salida&&r.salida.lat!=null&&r.salida.lng!=null)?r.salida:null);
  var geoLink=geoP?('https://www.google.com/maps?q='+geoP.lat+','+geoP.lng):'';
  // Foto de ENTRADA y de SALIDA por separado (cada marca con la foto de esa persona en ese momento).
  var thumb=function(p, label, col){
    if(!(p && p.photo_url)) return '';
    return '<a href="'+esc(p.photo_url)+'" target="_blank" rel="noopener" title="Foto de '+label+'" style="position:relative;flex-shrink:0;display:block">' +
      '<img src="'+esc(p.photo_url)+'" alt="'+label+'" style="width:48px;height:48px;border-radius:10px;object-fit:cover;border:2px solid '+col+'">' +
      '<span style="position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:800;letter-spacing:.03em;color:#fff;background:'+col+';border-radius:6px;padding:1px 5px;white-space:nowrap">'+label+'</span></a>';
  };
  var photosHtml = thumb(r.entrada,'ENTRADA','var(--green)') + thumb(r.salida,'SALIDA','var(--brick)');
  if(!photosHtml){ photosHtml = '<span style="flex-shrink:0;width:48px;height:48px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted)">'+ic('users',18)+'</span>'; }
  var h='<div class="qa-item">' +
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
      '<div style="display:flex;gap:8px;flex-shrink:0">'+photosHtml+'</div>' +
      '<div style="flex:1;min-width:140px"><p style="margin:0;font-weight:700;font-size:14px;color:var(--ink)">'+esc(r.name)+(r.legajo?(' <span style="font-size:11px;color:var(--muted)">· leg. '+esc(r.legajo)+'</span>'):'')+(!r.matched?' <span style="font-size:11px;color:var(--brick)">· sin match</span>':'')+'</p>' +
      '<p style="margin:2px 0 0;font-size:12px;color:var(--muted)">Entrada '+(r.entrada?esc(tsHM(r.entrada.punched_at)):'—')+' · Salida '+(r.salida?esc(tsHM(r.salida.punched_at)):'—')+' · '+fmtMinDur(r.workedMin)+(r.extra?(' · <span style="color:var(--blue)">+'+fmtMinDur(r.extra)+' extra</span>'):'')+(geoLink?(' · <a href="'+esc(geoLink)+'" target="_blank" rel="noopener" style="color:var(--teal);text-decoration:none">'+ic('globe',11)+' ubicación</a>'):'')+'</p></div>' +
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><div style="font-size:12px;text-align:right">'+estado+'</div>' +
        ((r.punchIds&&r.punchIds.length)?('<button class="dl-audio" data-action="asist-del-group" data-ids="'+esc(r.punchIds.join(","))+'" title="Eliminar las fichadas de este empleado en este día" style="background:none;border:none;color:var(--brick);cursor:pointer;font-size:11px">'+ic('trash',12)+' eliminar</button>'):'') +
      '</div>' +
    '</div>';
  // Llegada tarde: cartel + justificación (se guarda en la fichada de ENTRADA)
  if(r.lateInfo){
    if(r.lateInfo.justification){
      h += '<div style="margin-top:10px;background:var(--surface-2);border-radius:9px;padding:8px 10px;font-size:12.5px;color:var(--ink)"><b style="color:var(--amber)">Llegó '+fmtMinDur(r.lateInfo.min)+' tarde.</b> Justificación: '+esc(r.lateInfo.justification)+' <button class="dl-audio" data-action="asist-justify" data-id="'+esc(r.lateInfo.entradaId)+'" style="background:none;border:none;color:var(--teal);cursor:pointer;font-size:11px;margin-left:6px">editar</button></div>';
    } else if(state.asist.justifyId===r.lateInfo.entradaId){
      h += '<div style="margin-top:10px;background:var(--amber-tint);border-radius:9px;padding:10px">' +
        '<p style="margin:0 0 8px;font-size:12.5px;color:var(--amber);font-weight:700">Justificar llegada tarde ('+fmtMinDur(r.lateInfo.min)+' tarde)</p>' +
        '<div class="input-row" style="align-items:flex-start;background:var(--surface)"><textarea id="f_justif" rows="2" placeholder="Motivo de la llegada tarde (ej: problema de transporte, turno médico, etc.)">'+esc(state.asist.justifyText||"")+'</textarea></div>' +
        '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-primary btn-sm" data-action="asist-justify-save" data-id="'+esc(r.lateInfo.entradaId)+'">Guardar</button><button class="btn btn-ghost btn-sm" data-action="asist-justify-cancel">Cancelar</button></div>' +
      '</div>';
    } else {
      h += '<div style="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--amber-tint);border-radius:9px;padding:8px 10px">' +
        '<span style="flex:1;min-width:120px;font-size:12.5px;color:var(--amber);font-weight:700">'+ic('alert',13)+' Llegó '+fmtMinDur(r.lateInfo.min)+' tarde.</span>' +
        '<button class="btn btn-primary btn-sm" data-action="asist-justify" data-id="'+esc(r.lateInfo.entradaId)+'">Justificar</button>' +
      '</div>';
    }
  }
  if(r.early){
    if(r.early.justification){
      h += '<div style="margin-top:10px;background:var(--surface-2);border-radius:9px;padding:8px 10px;font-size:12.5px;color:var(--ink)"><b style="color:var(--amber)">Salió '+fmtMinDur(r.early.min)+' antes.</b> Justificación: '+esc(r.early.justification)+' <button class="dl-audio" data-action="asist-justify" data-id="'+esc(r.early.salidaId)+'" style="background:none;border:none;color:var(--teal);cursor:pointer;font-size:11px;margin-left:6px">editar</button></div>';
    } else if(state.asist.justifyId===r.early.salidaId){
      h += '<div style="margin-top:10px;background:var(--amber-tint);border-radius:9px;padding:10px">' +
        '<p style="margin:0 0 8px;font-size:12.5px;color:var(--amber);font-weight:700">Justificar salida temprana ('+fmtMinDur(r.early.min)+' antes)</p>' +
        '<div class="input-row" style="align-items:flex-start;background:var(--surface)"><textarea id="f_justif" rows="2" placeholder="Motivo por el que se fue antes (ej: turno médico, permiso, etc.)">'+esc(state.asist.justifyText||"")+'</textarea></div>' +
        '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-primary btn-sm" data-action="asist-justify-save" data-id="'+esc(r.early.salidaId)+'">Guardar</button><button class="btn btn-ghost btn-sm" data-action="asist-justify-cancel">Cancelar</button></div>' +
      '</div>';
    } else {
      h += '<div style="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--amber-tint);border-radius:9px;padding:8px 10px">' +
        '<span style="flex:1;min-width:120px;font-size:12.5px;color:var(--amber);font-weight:700">'+ic('alert',13)+' Se fue '+fmtMinDur(r.early.min)+' antes del horario.</span>' +
        '<button class="btn btn-primary btn-sm" data-action="asist-justify" data-id="'+esc(r.early.salidaId)+'">Justificar</button>' +
      '</div>';
    }
  }
  h += '</div>';
  return h;
}
/* ---- Asistencia y horarios (reclutador) ---- */
Screens["mod2-asistencia"] = function(){
  var s = state.asist;
  var html = Header();
  html += backlink("go-module-admin-hr","Volver a Administración");
  html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--teal)">'+ic('clock',20)+'<h2 style="font-size:18px;color:var(--ink)">Asistencia y horarios</h2></div>';
  html += '<p style="font-size:13px;color:var(--muted);margin:0 0 14px">Compartí el link del fichador con tus empleados: fichan con foto y ubicación usando su nombre y N° de legajo, y las fichadas llegan acá automáticamente.</p>';
  if (s.msg) html += Note("ok", esc(s.msg));
  if (s.loading || s.items===null){ html += '<div class="center-block">'+ic('loader',26,'spin')+'<p>Cargando asistencia…</p></div>'; return html; }
  if (s.error){ html += Note("err", esc(s.error)); return html; }
  // Link del fichador
  var link=fichadorLink();
  html += '<div class="card" style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--teal)">'+ic('mic',16)+'<h3 style="font-size:14px;color:var(--ink);margin:0">Fichador (link para empleados)</h3></div>';
  if(link){
    html += '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
      '<input readonly value="'+esc(link)+'" onclick="this.select()" style="flex:1;min-width:180px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;color:var(--ink);font-size:12px;font-family:inherit">' +
      '<button class="btn btn-teal btn-sm" data-action="copy-fichlink" data-link="'+esc(link)+'">'+ic('copy',13)+' Copiar</button>' +
      '<button class="btn btn-ghost btn-sm" data-action="open-fichlink" data-code="'+esc(s.config&&s.config.code||"")+'">'+ic('eye',13)+' Abrir</button>' +
    '</div>' + (audioUploadConfigured()?'':Note("info","Para que la foto del fichaje se guarde, configurá Cloudinary. Sin eso, igual se registra la fichada (sin foto)."));
  } else { html += Note("err","No pude generar el link del fichador. Si es la primera vez, revisá que hayas corrido el SQL de asistencia (sql_asistencia.sql)."); }
  html += '</div>';
  // Filtros: día + vista
  html += '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">' +
    '<label class="field" style="flex:0 0 auto"><span class="field-label">Día</span><div class="input-row"><input id="f_asist_day" type="date" value="'+esc(s.day||todayISO())+'"></div></label>' +
    '<div style="display:flex;gap:6px;align-self:flex-end">' +
      '<button class="pill-time" data-action="asist-view" data-v="resumen" style="cursor:pointer;border:none;background:'+((s.view||"resumen")==="resumen"?'var(--teal)':'var(--surface-2)')+';color:'+((s.view||"resumen")==="resumen"?'#fff':'var(--ink)')+'">Resumen del día</button>' +
      '<button class="pill-time" data-action="asist-view" data-v="log" style="cursor:pointer;border:none;background:'+(s.view==="log"?'var(--teal)':'var(--surface-2)')+';color:'+(s.view==="log"?'#fff':'var(--ink)')+'">Todas las fichadas</button>' +
      '<button class="pill-time" data-action="asist-view" data-v="control" style="cursor:pointer;border:none;background:'+(s.view==="control"?'var(--teal)':'var(--surface-2)')+';color:'+(s.view==="control"?'#fff':'var(--ink)')+'">Control</button>' +
    '</div>' +
  '</div>';
  var day=s.day||todayISO();
  if ((s.view||"resumen")==="resumen"){
    var sum=asistDaySummary();
    if(!sum.rows.length && !sum.absent.length){ html += '<div class="center-block" style="padding:26px 12px">'+ic('clock',24)+'<p>No hay fichadas para este día.</p></div>'; }
    else {
      html += '<div style="display:grid;gap:8px">';
      sum.rows.forEach(function(r){ html += asistSummaryRowHtml(r); });
      html += '</div>';
      if(sum.absent.length){
        html += '<div style="margin-top:14px"><p style="font-size:12.5px;font-weight:700;color:var(--brick);margin:0 0 8px">Ausentes ('+sum.absent.length+')</p><div style="display:grid;gap:6px">';
        sum.absent.forEach(function(e){ html += '<div style="padding:8px 10px;background:var(--brick-tint);border-radius:9px;font-size:13px;color:var(--ink)">'+esc(empFullName(e))+(e.legajo_number?(' · leg. '+esc(e.legajo_number)):'')+' — no fichó</div>'; });
        html += '</div></div>';
      }
      // Fichadas individuales del día (para revisar y eliminar las que se hicieron por error).
      var dayPunches=(s.items||[]).filter(function(p){ return tsDayKey(p.punched_at)===day; }).sort(function(a,b){ return new Date(b.punched_at)-new Date(a.punched_at); });
      if(dayPunches.length){
        html += '<details style="margin-top:14px"><summary style="cursor:pointer;font-size:12.5px;font-weight:700;color:var(--teal);padding:4px 0">Ver / eliminar cada fichada del día ('+dayPunches.length+')</summary><div style="display:grid;gap:8px;margin-top:8px">';
        dayPunches.forEach(function(p){ html += asistPunchRowHtml(p); });
        html += '</div></details>';
      }
    }
  } else if(s.view==="log"){
    // Vista "Todas las fichadas": organizadas en CARPETAS por mes/año.
    var all=(s.items||[]);
    var arow=asistPunchRowHtml;
    if(!all.length){ html += '<div class="center-block" style="padding:26px 12px">'+ic('clock',24)+'<p>Todavía no hay fichadas.</p></div>'; }
    else if(!s.folder){
      var byMonth={}; all.forEach(function(p){ var mk=monthKey(p.punched_at); if(mk){ (byMonth[mk]=byMonth[mk]||[]).push(p); } });
      var months=Object.keys(byMonth).sort().reverse();
      html += '<p style="font-size:12.5px;color:var(--muted);margin:0 0 10px">Carpetas por mes. Tocá una para ver sus fichadas.</p>';
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">';
      months.forEach(function(mk){ html += '<button class="tile tile-light" data-action="asist-folder" data-m="'+esc(mk)+'" style="text-align:left;cursor:pointer">'+ic('file',20)+'<h3 style="margin:8px 0 2px">'+esc(monthLabel(mk))+'</h3><p>'+byMonth[mk].length+' fichada'+(byMonth[mk].length===1?'':'s')+'</p></button>'; });
      html += '</div>';
    } else {
      html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" data-action="asist-folder-back">'+ic('back',14)+' Carpetas</button><span style="font-weight:700;color:var(--ink);font-size:15px">'+esc(monthLabel(s.folder))+'</span></div>';
      var monthP=all.filter(function(p){ return monthKey(p.punched_at)===s.folder; });
      var byDay={}; monthP.forEach(function(p){ var dk=tsDayKey(p.punched_at); (byDay[dk]=byDay[dk]||[]).push(p); });
      var dks=Object.keys(byDay).sort().reverse();
      if(!dks.length){ html += '<p style="font-size:13px;color:var(--muted)">Esta carpeta ya no tiene fichadas.</p>'; }
      dks.forEach(function(dk){
        html += '<p style="font-size:12px;font-weight:700;color:var(--teal);margin:16px 0 8px">'+esc(dayLabel(dk))+' <span style="color:var(--muted);font-weight:400">· '+byDay[dk].length+' fichada'+(byDay[dk].length===1?'':'s')+'</span></p>';
        // Resumen de estado del día (a tiempo / tarde / salida temprana) con foto.
        var dsum=asistDaySummary(dk);
        if(dsum.rows.length){ html += '<div style="display:grid;gap:8px;margin-bottom:8px">'; dsum.rows.forEach(function(r){ html += asistSummaryRowHtml(r); }); html += '</div>'; }
        // Detalle de cada fichada (para ver la foto de cada marca y poder eliminar).
        html += '<details style="margin-bottom:4px"><summary style="cursor:pointer;font-size:12px;color:var(--muted);padding:2px 0">Ver cada fichada del día</summary><div style="display:grid;gap:8px;margin-top:8px">';
        byDay[dk].forEach(function(p){ html += arow(p); });
        html += '</div></details>';
      });
    }
  } else {
    // Vista "Control": Control > mes > empleado > documento (tarde / ausencias / extra / franco).
    var allC=(s.items||[]);
    if(!allC.length){ html += '<div class="center-block" style="padding:26px 12px">'+ic('file',24)+'<p>Todavía no hay datos para el control.</p></div>'; }
    else if(!s.ctlMonth){
      var byM={}; allC.forEach(function(p){ var m=monthKey(p.punched_at); if(m){ (byM[m]=byM[m]||0); byM[m]++; } });
      var ms=Object.keys(byM).sort().reverse();
      html += '<div style="display:flex;align-items:center;gap:8px;margin:0 0 10px;color:var(--teal)">'+ic('file',18)+'<span style="font-weight:800;font-size:15px;color:var(--ink)">Control</span></div>';
      html += '<p style="font-size:12.5px;color:var(--muted);margin:0 0 10px">Un documento por mes y por empleado: llegadas tarde, ausencias, horas extra y francos trabajados. Elegí un mes.</p>';
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">';

      html += '</div>';
    } else if(!s.ctlEmp){
      var listC=asistMonthControl(s.ctlMonth);
      html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" data-action="asist-ctl-monthback">'+ic('back',14)+' Meses</button><span style="font-weight:800;color:var(--ink);font-size:15px">Control · '+esc(monthLabel(s.ctlMonth))+'</span>';
      html += '<button class="btn btn-ghost btn-sm" data-action="asist-ctl-dlmonth" data-m="'+esc(s.ctlMonth)+'" style="margin-left:auto">'+ic('download',14)+' Descargar mes (CSV)</button></div>';
      if(!listC.length){ html += '<p style="font-size:13px;color:var(--muted)">No hay empleados con datos en este mes.</p>'; }
      else {
        html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">';

          var nov=en.count?(en.count+' novedad'+(en.count===1?'':'es')):'Sin novedades';

            '<span style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:var(--teal-tint);color:var(--teal);font-weight:800">'+esc((empFullName(en.emp)[0]||"?").toUpperCase())+'</span>' +

      else {

      '<label class="field" style="margin-left:auto"><span class="field-label">Ajustar a mano (opcional)</span><div class="input-row" style="max-width:130px"><input id="f_lic_vac" type="number" min="0" placeholder="auto: '+esc(String(vac.auto))+'" value="'+esc(override!=null?String(override):"")+'"></div><span class="field-hint">Vacío = automático.</span></label>' +
    '</div>' +
    '<p style="font-size:12px;color:var(--muted);margin:10px 0 0">'+ic('info',12)+' '+esc(vac.note)+'</p>' +
    (override!=null?('<button class="btn btn-ghost btn-sm" data-action="lic-vac-auto" data-e="'+esc(e.id)+'" style="margin-top:8px">'+ic('rotate',13)+' Volver al cálculo automático</button>'):'') +

      '<div class="grid2" style="gap:12px">' +
        '<label class="field"><span class="field-label">Desde</span><div class="input-row"><input id="f_lic_from" type="date" value="'+esc(f.start_date||"")+'"></div></label>' +

       '</div>'):'') +

};
