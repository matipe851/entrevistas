function saveMovement(){
  var a=state.abm; if(!a||!a.emp) return; var f=a.form;
  var e=a.emp;
  var type=f.type;
  // Validación mínima por tipo.
  if((type==="cambio_puesto"||type==="ascenso") && !(f.to||"").trim() && !(f.to2||"").trim()){ f.error="Indicá el nuevo puesto o la nueva categoría."; render(); return; }
  if(type==="cambio_salarial" && !(f.to||"").trim()){ f.error="Indicá el nuevo salario."; render(); return; }
  if(type==="baja" && !(f.reason||"").trim()){ f.error="Elegí el motivo de la desvinculación."; render(); return; }
  f.saving=true; f.error=""; render();
  var mov={ employee_id:a.empId, type:type, effective_date:(f.date||todayISO()), notes:(f.notes||"").trim() };
  var empPatch=null;
  if(type==="cambio_puesto"||type==="ascenso"){
    mov.from_value=e.position||""; mov.to_value=(f.to||"").trim()||e.position||"";
    var parts=[]; if((f.to||"").trim()) parts.push("Puesto: "+(e.position||"—")+" → "+f.to.trim());
    if((f.to2||"").trim()) parts.push("Categoría: "+(e.category||"—")+" → "+f.to2.trim());
    mov.description=(MOV_TYPES[type].label)+(parts.length?" · "+parts.join(" · "):"");
    empPatch={}; if((f.to||"").trim()) empPatch.position=f.to.trim(); if((f.to2||"").trim()) empPatch.category=f.to2.trim();
  } else if(type==="cambio_salarial"){
    mov.from_value=e.salary||""; mov.to_value=(f.to||"").trim();
    mov.description="Cambio salarial: "+(e.salary||"—")+" → "+f.to.trim();
    empPatch={ salary:f.to.trim() };
  } else if(type==="baja"){
    mov.reason=(f.reason||"").trim(); mov.to_value="inactivo";
    mov.description="Baja · "+mov.reason;
    empPatch={ status:"inactivo", termination_date:(f.date||todayISO()), termination_reason:mov.reason };
  }
  dbCreateMovement(mov).then(function(saved){
    // Actualizamos la ficha del empleado según el movimiento (best-effort, resiliente).
    function done(){
      a.form=emptyMovForm(); a.msg="Movimiento registrado."; a.movements=null; state.emp.items=null;
      // refrescamos el empleado en memoria
      dbListEmployees().then(function(items){ state.emp.items=items; var ne=(items||[]).filter(function(z){return z.id===a.empId;})[0]; if(ne&&state.abm){ state.abm.emp=ne; } });
      dbListMovements(a.empId).then(function(items){ if(state.abm&&state.abm.empId===a.empId){ state.abm.movements=items; render(); } });
      render();
    }
    if(empPatch){
      var slim=Object.assign({}, empPatch); delete slim.salary; delete slim.termination_date; delete slim.termination_reason;
      dbUpdateEmployee(a.empId, empPatch).catch(function(){ return Object.keys(slim).length?dbUpdateEmployee(a.empId, slim):null; }).then(done).catch(done);
    } else { done(); }
  }).catch(function(){
    f.saving=false;
    f.error="No pude registrar el movimiento. Si es la primera vez, revisá que hayas corrido el SQL de ABM (sql_abm.sql) en Supabase.";
    render();
  });
}

function doLogin(email, password, captchaToken){
  email=(email||"").trim(); password=password||"";
  if(!email || !password){ state.error="Ingresá tu email y contraseña."; render(); return; }
  if(captchaConfigured() && !captchaToken){ state.error="Completá la verificación de seguridad."; render(); return; }
  state.busy=true; state.error=null; render();
  supaLogin(email, password, captchaToken).then(function(res){
    state.busy=false;
    if(res.ok && res.j && res.j.access_token){ storeSessionFromToken(res.j); state.error=null; routeAfterAuth(); }
    else { state.error = (res.j && (res.j.error_description||res.j.msg||res.j.error)) || "Email o contraseña incorrectos."; render(); }
  }).catch(function(){ state.busy=false; state.error="No pude conectar. Revisá tu conexión."; render(); });
}
function doSignup(email, password, captchaToken){
  email=(email||"").trim(); password=password||"";
  if(!email || password.length<6){ state.error="Email válido y contraseña de al menos 6 caracteres."; render(); return; }
  state.busy=true; state.error=null; render();
  supaSignup(email, password, captchaToken).then(function(res){
    if(res.ok && res.j && res.j.access_token){ state.busy=false; storeSessionFromToken(res.j); state.error=null; routeAfterAuth(); return; }
    if(res.ok && res.j && (res.j.id || res.j.user)){
      // Cuenta creada pero requiere confirmar email: intentamos loguear igual.
      supaLogin(email, password).then(function(r2){
        state.busy=false;
        if(r2.ok && r2.j && r2.j.access_token){ storeSessionFromToken(r2.j); routeAfterAuth(); }
        else { state.error="Cuenta creada. Revisá tu email para confirmarla y luego iniciá sesión."; state.screen="rec-login"; render(); }
      }).catch(function(){ state.busy=false; state.error="Cuenta creada. Revisá tu email para confirmarla y luego iniciá sesión."; state.screen="rec-login"; render(); });
      return;
    }
    state.busy=false;
    state.error = (res.j && (res.j.error_description||res.j.msg||res.j.error)) || "No pude crear la cuenta.";
    render();
  }).catch(function(){ state.busy=false; state.error="No pude conectar. Revisá tu conexión."; render(); });
}

function aiErrorMessage(code, detail){
  var m = {
    "no_key": "la IA no está configurada (falta la GEMINI_API_KEY en Vercel)",
    "gemini_error": "Gemini devolvió un error — probablemente la API key esté inválida, revocada o sin cuota",
    "parse_error": "la IA respondió en un formato inesperado",
    "sin_preguntas": "la IA no devolvió preguntas",
    "network": "no pude conectarme con la IA"
  };
  var reason = m[code] || (code ? ("motivo: "+code) : "motivo desconocido");
  var d = (detail && String(detail).trim()) ? (" — Detalle de Gemini: “"+String(detail).slice(0,300)+"”") : "";
  return "⚠ Estas preguntas son de PLANTILLA (no personalizadas por IA), porque "+reason+d+". Revisá la GEMINI_API_KEY en Vercel para que las preguntas se generen a medida del puesto y del CV.";

function sendInviteSmart(to, subject, message){

}

function sendCannotAuto(j){
  return j && (j.error==="no_google" || j.error==="needs_relogin" || j.error==="no_config" || j.error==="no_token" || j.error==="network");
}
function startBulkSend(){
  if (!(supaConfigured() && isLoggedIn())){ state.bulk={ error:"Necesitás iniciar sesión para el envío masivo.", results:[], done:true, editing:false }; state.screen="bulk-result"; render(); return; }
  var ids = state.config.selectedCVs || [];
  var chosen = (state.cvbank.cvs||[]).filter(function(cv){ return ids.indexOf(cv.id)>=0; });
  var targets = [], noEmail = [];
  chosen.forEach(function(cv){
    var mail = cv.candidate_email || extractEmailFromText(cv.cv_text||"");
    var rec = { id:cv.id, name:cv.candidate_name||cv.file_name||"Candidato", email:mail||"" };
    if (mail && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) targets.push(rec); else noEmail.push(rec);
  });
  if (targets.length > 25){ targets = targets.slice(0,25); } // tope por tanda (rate limit del envío)
  state.bulk = { running:false, phase:"questions", editing:false, total:targets.length, sent:0, failed:0, noEmail:noEmail.length, results:[], error:null, sendUnavailable:false, done:false, targets:targets, noEmailList:noEmail };
  if (!targets.length){ state.bulk.done=true; state.bulk.error="Ninguno de los CVs seleccionados tiene un email detectado. Abrí cada CV y cargá el email, o subilos de nuevo."; state.screen="bulk-result"; render(); return; }

  // 1) Generar las preguntas del puesto (mismas para todos). Sin sesgo de un CV puntual.
  state.aiFallback = null; state.screen = "generating"; render();
  var savedCvText = rt.cvText, savedCvData = rt.cvData;
  rt.cvText = ""; rt.cvData = null;
  var lang = state.config.language || "es";
  generateQuestions()
    .then(function(list){ rt.cvText=savedCvText; rt.cvData=savedCvData; var qs=mapAIQuestions(list, lang); if(!qs||!qs.length) qs=buildQuestions(state.config); return qs; })
    .catch(function(e){ rt.cvText=savedCvText; rt.cvData=savedCvData; var code=(e&&e.message)||"network"; if(/fetch|network|load failed|failed to/i.test(code)) code="network"; state.aiFallback=aiErrorMessage(code, e&&e.detail); return buildQuestions(state.config); })
    .then(function(qs){
      if (!qs || !qs.length) qs = buildQuestions(state.config);
      qs.forEach(function(q,i){ if(!q.id) q.id="q"+i; });
      state.questions = qs;
      // 2) Paso de edición: el reclutador revisa/edita/agrega preguntas antes de enviar.
      state.bulk.editing = true;
      state.screen = "edit-questions"; render();
    });
}
// 3) Con las preguntas ya editadas, crea una entrevista por candidato y envía a cada uno.
function bulkFinalizeSend(){
  var qs = (state.questions||[]).filter(function(q){ return q.text && q.text.trim(); });
  if (!qs.length){ state.error="La entrevista necesita al menos una pregunta."; render(); return; }
  qs.forEach(function(q,i){ if(!q.id) q.id="q"+i; });
  var targets = state.bulk.targets || [];
  var noEmail = state.bulk.noEmailList || [];
  var qCount = qs.length;
  state.bulk.editing=false; state.bulk.running=true; state.bulk.phase="creating";
  state.bulk.sent=0; state.bulk.failed=0; state.bulk.results=[]; state.bulk.sendUnavailable=false; state.bulk.done=false; state.bulk.error=null;
  state.screen="bulk-sending"; render();

  var subject = inviteSubject();
  var chain = Promise.resolve();
  noEmail.forEach(function(r){ state.bulk.results.push({ name:r.name, email:"", code:"", link:"", status:"noemail" }); });
  targets.forEach(function(t){
    chain = chain.then(function(){
      var code = makeCode();
      return createBulkInterviewRow(code, t.name, t.email, qs).then(function(){
        var link = bulkLinkFor(code);
        var entry = { name:t.name, email:t.email, code:code, link:link, status:"pending" };
        state.bulk.results.push(entry);
        if (state.bulk.sendUnavailable){ render(); return; }
        var msg = buildBulkInviteMessage(t.name, link, code, qCount);
        return sendInviteSmart(t.email, subject, msg).then(function(j){
          if (j && j.ok){ entry.status="sent"; state.bulk.sent++; }
          else if (sendCannotAuto(j)){ state.bulk.sendUnavailable=true; entry.status="pending"; }
          else { entry.status="failed"; state.bulk.failed++; }
          render();
        });
      }).catch(function(){
        state.bulk.results.push({ name:t.name, email:t.email, code:"", link:"", status:"failed" });
        state.bulk.failed++; render();
      });
    });
  });
  chain.then(function(){
    state.bulk.running=false; state.bulk.done=true; state.bulk.editing=false; state.screen="bulk-result"; render();
    state.config.selectedCVs = [];
    if (supaConfigured() && isLoggedIn()) loadDashboard();
  }).catch(function(e){
    state.bulk.running=false; state.bulk.done=true; state.bulk.error="No pude completar el envío. "+((e&&e.message)||""); state.screen="bulk-result"; render();
  });
}

function emailsMatch(a, b){ return (a||"").trim().toLowerCase() === (b||"").trim().toLowerCase(); }

function startInviteInterview(emailRaw, codeRaw, nameRaw){
  var inv = state.invite; if (!inv || !inv.questions) return;
  var emailIn = (emailRaw||"").trim();
  var codeIn = (codeRaw||"").trim().toUpperCase();
  var nameIn = (nameRaw||"").trim().replace(/\s+/g," ");
  if (!nameIn || nameIn.length < 2){ state.error="Ingresá tu nombre y apellido."; render(); return; }
  if (!emailIn || emailIn.indexOf("@") < 1){ state.error="Ingresá un email válido para comenzar."; render(); return; }
  if (!codeIn){ state.error="Ingresá el código de verificación que está en el correo de la invitación."; render(); return; }
  if (inv.code && codeIn !== String(inv.code).toUpperCase()){ state.error="El código no es correcto. Revisá el correo de la invitación."; render(); return; }
  if (inv.code && isInterviewUsed(inv.code)){ state.error=null; render(); return; }

  function enter(){
    state.config = {
      position: inv.position||"", company: inv.company||"", focus: inv.focus||"",
      level: inv.level||"Semi-Senior", language: inv.language||"es",
      includeEnglish:false, count:"auto", followups: inv.followups !== false,
      recruiterEmail: inv.recruiterEmail || ""
    };
    rt.analyzed = {}; rt.autoStartedFor = {};
    state.questions = inv.questions.slice();
    state.answers = {}; state.idx = 0; state.report = null; state.audioUrls = {};
    state.code = inv.code || "";
    state.interviewId = inv.id || "";
    state.candidateEmail = emailIn;
    state.candidateName = nameIn;
    state.interviewMode = "candidate";
    state.autoSendState = "idle"; state.autoSendError = null;
    state.micDenied = false;
    state.consentAt = new Date().toISOString(); // registro del consentimiento aceptado
    // El "un solo uso" ya NO se marca al ingresar (así un corte de micrófono o una
    // recarga no dejan al candidato bloqueado sin haber respondido). Se marca al terminar.
    state.error = null; state.screen = "interview";
    render();
  }

  // Pedimos permiso de micrófono ahora (con el gesto del botón) para que después
  // cada pregunta pueda grabar sola sin volver a preguntar.
  state.error = null; state.screen = "loading"; render();
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      enter();
    }).catch(function(){
      state.error = "Necesitamos permiso para usar el micrófono. Activalo en el navegador y volvé a tocar “Comenzar entrevista”.";
      state.screen = "invite-landing"; render();
    });
  } else {
    enter();
  }
}

function loadForCandidate(emailRaw, raw){
  var code = (raw||"").toUpperCase().trim();
  var emailIn = (emailRaw||"").trim();
  if (!emailIn){ state.error="Ingresá el email al que te enviaron la invitación."; render(); return; }
  if (!code){ state.error="Ingresá el código."; render(); return; }
  state.error=null; state.screen="loading"; render();
  setTimeout(function(){
    var iv = lget("voz_iv_"+code);
    if (!iv || !iv.questions || !iv.questions.length){ state.error="No encontramos una entrevista con ese código en este navegador."; state.screen="cand-code"; render(); return; }
    if (iv.candidateEmail && !emailsMatch(iv.candidateEmail, emailIn)){
      state.error="Ese email no coincide con el que recibió la invitación para este código."; state.screen="cand-code"; render(); return;
    }
    state.config = { position:iv.position, company:iv.company, focus:iv.focus||"", level:iv.level||"Semi-Senior", language:iv.language||"es", includeEnglish:false, count:"auto", followups: iv.followups !== false };
    rt.analyzed = {};
    state.questions = iv.questions; state.answers = {}; state.idx = 0;
    state.code = code; state.candidateEmail = emailIn; state.interviewMode = "candidate"; state.screen = "interview";
    render();
  }, 350);
}

function loadResults(raw){
  var code = (raw||"").toUpperCase().trim();
  if (!code){ state.error="Ingresá el código."; render(); return; }
  state.error=null; state.screen="loading"; render();
  setTimeout(function(){
    var iv = lget("voz_iv_"+code), ans = lget("voz_ans_"+code);
    if (!iv){ state.error="No encontramos esa entrevista en este navegador."; state.screen="results-code"; render(); return; }
    if (!ans){ state.error="La entrevista existe, pero el candidato todavía no respondió (en este navegador)."; state.screen="results-code"; render(); return; }
    state.config = { position:iv.position, company:iv.company, focus:iv.focus||"", level:iv.level||"Semi-Senior", language:iv.language||"es", includeEnglish:false, count:"auto", followups:true };
    var qs = (ans.questions && ans.questions.length) ? ans.questions : iv.questions;
    var rebuilt = {};
    Object.keys(ans.answers||{}).forEach(function(qid){
      var a = ans.answers[qid];
      rebuilt[qid] = { blobUrl: a.audio || null, transcript: a.transcript || "", signals: a.signals || null };
    });
    state.questions = qs; state.answers = rebuilt; state.report = null; state.code = code; state.audioOmitted = !!ans.audioOmitted;
    state.screen = "review";
    render();
  }, 350);
}

function submitAnswers(){
  state.screen = "submitting"; render();
  var budget = 3200000, used = 0, omitted = false;
  var qs = state.questions.slice();
  var out = {};
  function processNext(i){
    if (i >= qs.length){ finish(); return; }
    var q = qs[i], a = state.answers[q.id];
    if (!a){ processNext(i+1); return; }
    if (a.blobUrl && a.blobUrl.indexOf("blob:")===0){
      fetch(a.blobUrl).then(function(r){ return r.blob(); }).then(function(blob){
        var fr = new FileReader();
        fr.onload = function(){
          var d = fr.result;
          if (used + d.length <= budget){ out[q.id] = { transcript:a.transcript||"", signals:a.signals||null, audio:d }; used += d.length; }
          else { out[q.id] = { transcript:a.transcript||"", signals:a.signals||null, audio:null }; omitted = true; }
          processNext(i+1);
        };
        fr.onerror = function(){ out[q.id] = { transcript:a.transcript||"", signals:a.signals||null, audio:null }; omitted=true; processNext(i+1); };
        fr.readAsDataURL(blob);
      }).catch(function(){ out[q.id] = { transcript:a.transcript||"", signals:a.signals||null, audio:null }; omitted=true; processNext(i+1); });
    } else {
      out[q.id] = { transcript:a.transcript||"", signals:a.signals||null, audio:null };
      processNext(i+1);
    }
  }
  function finish(){
    var strip = qs.map(function(q){ return { id:q.id, text:q.text, category:q.category, seconds:q.seconds, lang:q.lang, isFollowup:!!q.isFollowup, rootId:q.rootId, depth:q.depth||0, reason:q.reason||"" }; });
    lset("voz_ans_"+state.code, { questions: strip, answers: out, submittedAt: Date.now(), audioOmitted: omitted, candidateEmail: state.candidateEmail||"" });
    try{ state.report = evaluateLocally(state.questions, state.answers, state.config); }catch(e){ state.report = null; }
    state.audioOmitted = omitted;
    finalizeCandidate();
  }
  processNext(0);
}

/* Sube audios, pide el análisis con IA, guarda en la base y/o envía por mail. */
/* Envuelve una promesa con un límite de tiempo, para que un fetch colgado no trabe la UI. */
function withTimeout(p, ms){
  return new Promise(function(resolve, reject){
    var to = setTimeout(function(){ reject(new Error("timeout")); }, ms || 30000);
    Promise.resolve(p).then(function(v){ clearTimeout(to); resolve(v); }, function(e){ clearTimeout(to); reject(e); });
  });
}
function safeLocalReport(){ try{ return evaluateLocally(state.questions, state.answers, state.config); }catch(e){ return null; } }

function finalizeCandidate(){
  state.autoSendState = "sending"; state.autoSendError = null; state.screen = "cand-autosend"; render();
  var settled = false;
  function finish(screen, st, markUsed){
    if (settled) return; settled = true;
    if (markUsed){ try{ markInterviewUsed(state.code, state.candidateEmail); }catch(e){} }
    state.autoSendState = st || "sent"; state.screen = screen; render();
  }
  // Respaldo por si toda la cadena tarda demasiado (audios + transcripción + IA + guardado): no dejamos al candidato colgado.
  var hardStop = setTimeout(function(){ finish("cand-send", "error", false); }, 120000);

  // Subimos los audios y (en paralelo) transcribimos con IA cada respuesta en su idioma.
  Promise.all([
    withTimeout(uploadAllAudios(), 60000).catch(function(){ /* audios best-effort */ }),
    withTimeout(transcribeAnswersWithAI(), 55000).catch(function(){ /* transcripción best-effort */ })
  ])
    .then(function(){
      return withTimeout(analyzeWithAI(), 45000)
        .then(function(ai){ state.report = reportFromAI(ai); })
        .catch(function(){ state.report = state.report || safeLocalReport(); });
    })
    .then(function(){
      if (rt.audioError && (!state.audioUrls || !Object.keys(state.audioUrls).length)){
        state.report = state.report || {}; state.report.audioError = rt.audioError;
      }
      if (state.consentAt){ state.report = state.report || {}; state.report.consent = { accepted:true, at: state.consentAt }; }
      return withTimeout(submitToDB(), 30000).catch(function(){ return false; });
    })
    .then(function(dbSaved){
      var hasDB = !!state.interviewId;
      var needsSend = autoSendConfigured();
      var emailP = needsSend ? withTimeout(sendResultsAuto(), 30000).then(function(){ return true; }).catch(function(){ return false; }) : Promise.resolve(false);
      return emailP.then(function(emailSent){
        clearTimeout(hardStop);
        var delivered = (hasDB && dbSaved) || emailSent;
        if (delivered){ finish("cand-done", "sent", true); }        // entregado: recién acá marcamos "un solo uso"
        else if (!hasDB && !needsSend){ finish("cand-send", "idle", false); }
        else { state.autoSendError = { message: "No se pudieron entregar los resultados automáticamente." }; finish("cand-send", "error", false); }
      });
    })
    .catch(function(){ clearTimeout(hardStop); finish("cand-send", "error", false); });
}

/* ---- recording ---- */
function pickMime(){
  var types = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"];
  for (var i=0;i<types.length;i++){ if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(types[i])) return types[i]; }
  return "";
}
function startRecording(q){
  state.error=null; state.micDenied=false;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    state.micDenied = true;
    state.error = "Tu navegador no permite grabar audio. Abrí el enlace directamente en Chrome o Safari (no dentro de otra app como Instagram o LinkedIn) y sobre una conexión segura (https).";
    render(); return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    rt.stream = stream;
    var mime = pickMime();
    var mr = new MediaRecorder(stream, mime?{mimeType:mime}:undefined);
    rt.chunks = []; rt.activeQ = q; rt.finalText = ""; state.live = "";
    mr.ondataavailable = function(e){ if (e.data.size>0) rt.chunks.push(e.data); };
    mr.onstop = function(){
      var blob = new Blob(rt.chunks, {type: mr.mimeType});
      var url = URL.createObjectURL(blob);
      var qid = rt.activeQ ? rt.activeQ.id : null;
      var dur = (Date.now() - rt.startTime)/1000;
      var s = rt.sig;
      var signals = { longestSilence: +s.longest.toFixed(1), totalSilence: +s.total.toFixed(1), spoke: s.spoke, durationSec: +dur.toFixed(1) };
      if (qid) state.answers[qid] = { blob: blob, blobUrl:url, mime:mr.mimeType, transcript: rt.finalText.trim(), signals: signals };
      if (rt.stream) rt.stream.getTracks().forEach(function(t){ t.stop(); });
      stopMeter();
      render();
    };
    rt.recorder = mr; mr.start();
    startMeter(stream); rt.startTime = Date.now();
    startRecognition(q);
    state.recording = true;
    if (state.interviewMode === "candidate"){
      // El cronómetro ya viene corriendo desde que apareció la pregunta.
      if (!state.qTiming) startQuestionTimer(q);
      render();
    } else {
      // Preview del reclutador: el reloj arranca al grabar la primera vez.
      // Si ya está corriendo (por ejemplo al regrabar), NO se reinicia.
      if (!state.qTiming){ state.timeLeft = questionTime(q, false); state.timeTotal = state.timeLeft; state.qTiming = true; render(); tick(); }
      else render();
    }
  }).catch(function(){ state.micDenied = true; render(); });
}
/* Cronómetro de la pregunta: arranca cuando la pregunta aparece (modo candidato). */
function startQuestionTimer(q){
  clearTimeout(rt.timerId);
  state.timeLeft = questionTime(q, state.interviewMode === "candidate");
  state.timeTotal = state.timeLeft;
  state.qTiming = true;
  render();
  tick();
}
function onQuestionTimeUp(){
  state.qTiming = false;
  var q = state.questions[state.idx];
  if (state.recording){ stopRecorderOnly(); return; } // onstop guarda la respuesta grabada
  if (q && !state.answers[q.id]){
    state.answers[q.id] = { noAnswer:true, transcript:"", signals:{ durationSec:0, longestSilence:0, totalSilence:0, spoke:false } };
  }
  render();
}
function startRecognition(q){
  if (!hasSpeech) return;
  try{
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var r = new SR();
    r.lang = RECOG_LANG[q.lang] || "es-AR"; r.continuous = true; r.interimResults = true;
    r.onresult = function(e){
      var interim = "";
      for (var i=e.resultIndex;i<e.results.length;i++){
        var t = e.results[i][0].transcript;
        if (e.results[i].isFinal) rt.finalText += t + " "; else interim += t;
      }
      state.live = (rt.finalText+interim).trim();
      // Actualiza solo el cuadro de transcripción en vivo, sin re-dibujar la pantalla
      // (evita que el botón Detener se reconstruya y se pierdan los toques en el celular).
      if (state.recording){
        var lb = document.getElementById("liveBox");
        if (lb){ lb.textContent = state.live; lb.style.display = state.live ? "" : "none"; }
        else render();
      }
    };
    r.onerror = function(){};
    rt.recog = r; r.start();
  } catch(e){}
}
function startMeter(stream){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
    var ctx = new Ctx(); rt.audioCtx = ctx; if (ctx.resume) ctx.resume();
    var src = ctx.createMediaStreamSource(stream);
    var an = ctx.createAnalyser(); an.fftSize = 2048; src.connect(an);
    var buf = new Uint8Array(an.fftSize);
    rt.sig = { longest:0, cur:0, total:0, spoke:false };
    rt.meterId = setInterval(function(){
      an.getByteTimeDomainData(buf);
      var sum=0; for (var i=0;i<buf.length;i++){ var d=(buf[i]-128)/128; sum+=d*d; }
      var rms = Math.sqrt(sum/buf.length), dt=0.1;
      if (rms < 0.02){ rt.sig.cur += dt; rt.sig.total += dt; if (rt.sig.cur > rt.sig.longest) rt.sig.longest = rt.sig.cur; }
      else { rt.sig.cur = 0; rt.sig.spoke = true; }
    }, 100);
  } catch(e){}
}
function stopMeter(){ clearInterval(rt.meterId); try{ if (rt.audioCtx) rt.audioCtx.close(); }catch(e){} rt.audioCtx=null; }
function stopRecorderOnly(){
  try{ if (rt.recorder && rt.recorder.state !== "inactive") rt.recorder.stop(); }catch(e){}
  try{ if (rt.recog) rt.recog.stop(); }catch(e){}
  state.recording = false;
}
function stopRecording(){
  stopRecorderOnly();
  // El reloj NO se detiene al parar la grabación (ni en candidato ni en preview):
  // así se puede eliminar y volver a grabar sin que el tiempo se reinicie.
}
/* Actualiza SOLO el número del reloj y el anillo, sin volver a dibujar la pantalla.
   Esto evita que el botón de grabar/detener se "reconstruya" cada segundo y se pierdan
   los toques en el celular (el bug de tener que tocar 3 veces). */
function updateTimerUI(){
  if (state.screen !== "interview") return;
  var q = state.questions[state.idx]; if (!q) return;
  var ring = 2*Math.PI*54;
  var progress = state.qTiming ? state.timeLeft/(state.timeTotal || q.seconds) : 1;
  var overtime = state.qTiming && state.timeLeft <= 10;
  var col = overtime ? "var(--brick)" : "var(--teal)";
  var r = document.getElementById("recRing");
  if (r){ r.setAttribute("stroke-dashoffset", ring*(1-progress)); r.setAttribute("stroke", col); }
  var c = document.getElementById("recCount"); if (c) c.textContent = fmt(state.timeLeft);
  var rem = document.getElementById("recRemain"); if (rem) rem.textContent = fmt(state.timeLeft);
  var hint = document.getElementById("recHint"); if (hint) hint.style.color = overtime ? "var(--brick)" : "var(--ink)";
}
function tick(){
  clearTimeout(rt.timerId);
  if (!state.qTiming) return;
  if (state.timeLeft <= 0){ onQuestionTimeUp(); return; }
  rt.timerId = setTimeout(function(){ state.timeLeft -= 1; updateTimerUI(); tick(); }, 1000);
}

function maybeFollowup(){
  if (state.screen !== "interview") return;
  var q = state.questions[state.idx];
  if (!q || !state.config.followups) return;
  if ((q.depth||0) >= 2) return;
  var a = state.answers[q.id]; if (!a || !a.blobUrl) return;
  if (rt.analyzed[q.id]) return;
  rt.analyzed[q.id] = true;
  var hasContent = a.transcript && a.transcript.length >= 8;
  var hesitant = isHesitant(a);
  if (!hasContent && !hesitant) return;
  runAnalyze(q, false);
}
function runAnalyze(q, force, done){
  state.analyzingId = q.id; render();
  var a = state.answers[q.id] || {};
  var hesitant = isHesitant(a);
  var m = speechMetrics(a.transcript||"");
  var shortContent = m.words < 10;
  var shouldFollow = force || hesitant || shortContent;
  function finish(){ state.analyzingId = null; if (typeof done === "function") done(); else render(); }
  if (!shouldFollow){ finish(); return; }
  var reasonKind = hesitant && !shortContent ? "delivery" : "content";
  var tmpl = makeFollowup(q, reasonKind); // respaldo por plantilla (nunca falla)
  function insert(fu){
    var i = state.questions.findIndex(function(x){ return x.id === q.id; });
    if (i >= 0) state.questions.splice(i+1, 0, fu);
    finish();
  }
  // Intento con IA una repregunta puntual según lo que dijo el candidato; si falla o tarda, uso la plantilla.
  withTimeout(fetchFollowupAI(q, a.transcript||""), 9000).then(function(txt){
    if (txt){ tmpl.text = txt; tmpl.reason = "Repregunta generada por IA según la respuesta del candidato."; }
    insert(tmpl);
  }).catch(function(){ insert(tmpl); });
}
/* Pide a la IA una repregunta puntual. Devuelve "" si no hay contenido o falla (se usa plantilla). */
function fetchFollowupAI(q, transcript){
  transcript = (transcript||"").trim();
  if (transcript.length < 8) return Promise.resolve("");
  return fetch(AI_ANALYZE_ENDPOINT, { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ task:"followup", question:q.text, answer:transcript, position:state.config.position, level:state.config.level, language:(q.lang||state.config.language) }) })
    .then(function(r){ return r.json(); })
    .then(function(j){ return (j && j.ok && j.followup) ? String(j.followup) : ""; })
    .catch(function(){ return ""; });
}

function reRecord(q){
  // En modo candidato solo se puede regrabar mientras quede tiempo.
  if (state.interviewMode === "candidate" && !state.qTiming) return;
  var a = state.answers[q.id];
  if (a && a.blobUrl && a.blobUrl.indexOf("blob:")===0) URL.revokeObjectURL(a.blobUrl);
  delete state.answers[q.id];
  startRecording(q);  // el reloj sigue corriendo (no se reinicia): regrabar consume tiempo
}
function nextQuestion(){
  if (state.analyzingId) return; // ya estamos analizando esta respuesta; evitar doble avance
  if (state.recording) stopRecording();
  // Cortar el reloj de la pregunta actual antes de pasar a la siguiente (el de la nueva arranca solo).
  clearTimeout(rt.timerId); state.qTiming = false;
  // Repreguntas con IA (solo candidato, si están activadas): analizamos la respuesta y, si es floja
  // o genérica, insertamos una repregunta puntual antes de avanzar.
  var cq = state.questions[state.idx];
  if (state.interviewMode === "candidate" && state.config.followups && cq && !rt.analyzed[cq.id] && (cq.depth||0) < 2){
    var a = state.answers[cq.id];
    if (a && (a.blobUrl || a.blob || (a.transcript && a.transcript.length >= 8))){
      rt.analyzed[cq.id] = true;
      state.screen = "cand-followup"; render();
      runAnalyze(cq, false, function(){ state.screen = "interview"; advanceQuestion(); });
      return;
    }
  }
  advanceQuestion();
}
function advanceQuestion(){
  if (state.idx < state.questions.length-1){ state.idx += 1; render(); }
  else if (state.interviewMode === "candidate") submitAnswers();
  else { state.screen = "review"; render(); }
}
function evaluate(){
  state.screen = "evaluating"; state.error=null; render();
  function fallback(){
    try{ state.report = evaluateLocally(state.questions, state.answers, state.config); state.screen = "report"; }
    catch(e){ state.error = "No pude generar la evaluación. Probá de nuevo."; state.screen = "review"; }
    render();
  }

function copyText(txt, cb){
  function fallback(){
    try{
      var ta=document.createElement("textarea"); ta.value=txt;
      ta.style.position="fixed"; ta.style.top="0"; ta.style.left="0"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      try{ document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
    }catch(e){}
    if (cb) cb();
  }
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(cb).catch(fallback); }
  else fallback();
}

  });
  if ((f=document.getElementById("f_level"))) f.addEventListener("change", function(e){ state.config.level=e.target.value; });
  if ((f=document.getElementById("f_lang"))) f.addEventListener("change", function(e){ state.config.language=e.target.value; render(); });
  if ((f=document.getElementById("f_count"))) f.addEventListener("change", function(e){ state.config.count=e.target.value; });
  if ((f=document.getElementById("f_validdays"))) f.addEventListener("change", function(e){ state.config.validDays=parseInt(e.target.value,10); });
  if ((f=document.getElementById("f_english"))) f.addEventListener("change", function(e){ state.config.includeEnglish=e.target.checked; });
  if ((f=document.getElementById("f_followups"))) f.addEventListener("change", function(e){ state.config.followups=e.target.checked; });
  if ((f=document.getElementById("genBtn"))) f.addEventListener("click", function(){ if (state.config.position.trim() && state.config.company.trim()) generate(); });
  if ((f=document.getElementById("bulkBtn"))) f.addEventListener("click", function(){ if (state.config.position.trim() && state.config.company.trim()) startBulkSend(); });
  function syncGenBtn(){ var b=document.getElementById("genBtn"); if (b) b.disabled = !(state.config.position.trim() && state.config.company.trim()); }

  /* pin screens */
  if ((f=document.getElementById("pin1"))){
    var p1=document.getElementById("pin1"), p2=document.getElementById("pin2"), btn=document.getElementById("pinSetBtn");
    function syncPin(){ var v1=p1.value.replace(/\D/g,"").slice(0,8); var v2=p2.value.replace(/\D/g,"").slice(0,8); if(p1.value!==v1)p1.value=v1; if(p2.value!==v2)p2.value=v2; btn.disabled = !(v1.length>=4 && v1===v2); }
    p1.addEventListener("input", syncPin); p2.addEventListener("input", syncPin);
    btn.addEventListener("click", function(){ if (!btn.disabled) setPin(p1.value); });
  }
  if (document.getElementById("pinE")){
    (function(){
      var pinEl = document.getElementById("pinE");
      pinEl.addEventListener("input", function(){ pinEl.value = pinEl.value.replace(/\D/g,"").slice(0,8); });
      document.getElementById("pinEnterBtn").addEventListener("click", function(){ checkPin(pinEl.value); });
      pinEl.addEventListener("keydown", function(e){ if (e.key==="Enter") checkPin(pinEl.value); });
    })();
  }

  /* invite landing (candidate opened a shared link) */
  if (document.getElementById("inviteStartBtn")){
    (function(){
      var em = document.getElementById("inviteEmail");
      var cd = document.getElementById("inviteCode");
      var nm = document.getElementById("inviteName");
      var cons = document.getElementById("inviteConsent");
      var startBtn = document.getElementById("inviteStartBtn");
      // El botón "Comenzar" se habilita solo cuando el candidato tilda el consentimiento.
      function syncConsent(){ var ok = !!(cons && cons.checked); if(startBtn){ startBtn.disabled = !ok; startBtn.style.opacity = ok ? "1" : ".5"; } }
      if (cons) cons.addEventListener("change", syncConsent);
      syncConsent();
      if (cd) cd.addEventListener("input", function(){ cd.value = cd.value.toUpperCase().slice(0,8); });
      var go = function(){ if(cons && !cons.checked){ state.error="Para continuar, tenés que aceptar el consentimiento."; render(); return; } startInviteInterview(em ? em.value : "", cd ? cd.value : "", nm ? nm.value : ""); };
      startBtn.addEventListener("click", go);
      if (nm) nm.addEventListener("keydown", function(e){ if (e.key==="Enter") go(); });
      if (em) em.addEventListener("keydown", function(e){ if (e.key==="Enter") go(); });
      if (cd) cd.addEventListener("keydown", function(e){ if (e.key==="Enter") go(); });
      if (nm) nm.focus();
    })();
  }

  /* auth screens (Supabase) */
  if (document.getElementById("loginBtn")){
    (function(){
      var em=document.getElementById("authEmail"), pw=document.getElementById("authPass");
      var tsToken="";
      if(captchaConfigured() && document.getElementById("cf-turnstile")){
        ensureTurnstile(function(){
          try{
            window.turnstile.render("#cf-turnstile", {
              sitekey: TURNSTILE_SITE_KEY,
              callback: function(t){ tsToken=t; },
              "expired-callback": function(){ tsToken=""; },
              "error-callback": function(){ tsToken=""; }
            });
          }catch(e){}
        });
      }
      var go=function(){ doLogin(em?em.value:"", pw?pw.value:"", tsToken); };
      document.getElementById("loginBtn").addEventListener("click", go);
      if(pw) pw.addEventListener("keydown",function(e){ if(e.key==="Enter") go(); });
      if(em) em.focus();
    })();
  }
  if (document.getElementById("signupBtn")){
    (function(){
      var em=document.getElementById("authEmail"), pw=document.getElementById("authPass"), pw2=document.getElementById("authPass2");
      var tsToken="";
      if(captchaConfigured() && document.getElementById("cf-turnstile")){
        ensureTurnstile(function(){
          try{
            window.turnstile.render("#cf-turnstile", {
              sitekey: TURNSTILE_SITE_KEY,
              callback: function(t){ tsToken=t; },
              "expired-callback": function(){ tsToken=""; },
              "error-callback": function(){ tsToken=""; }
            });
          }catch(e){}
        });
      }
      var go=function(){
        if(pw&&pw2&&pw.value!==pw2.value){ state.error="Las contraseñas no coinciden."; render(); return; }
        if(captchaConfigured() && !tsToken){ state.error="Completá la verificación de seguridad."; render(); return; }
        doSignup(em?em.value:"", pw?pw.value:"", tsToken);
      };
      document.getElementById("signupBtn").addEventListener("click", go);
      if(pw2) pw2.addEventListener("keydown",function(e){ if(e.key==="Enter") go(); });
      if(em) em.focus();
    })();
  }

  /* code screens */
  if (document.getElementById("codeVal")){
    (function(){
      var codeEl = document.getElementById("codeVal");
      var emailEl = document.getElementById("emailVal");
      codeEl.addEventListener("input", function(){ codeEl.value = codeEl.value.toUpperCase().slice(0,8); });
      var submitCode = function(){
        var v = codeEl.value;
        if (state.screen==="cand-code") loadForCandidate(emailEl ? emailEl.value : "", v);
        else loadResults(v);
      };
      document.getElementById("codeBtn").addEventListener("click", submitCode);
      codeEl.addEventListener("keydown", function(e){ if (e.key==="Enter") submitCode(); });
      if (emailEl) emailEl.addEventListener("keydown", function(e){ if (e.key==="Enter") submitCode(); });
      (emailEl || codeEl).focus();
    })();
  }

  /* share screen */
  function syncMailHref(){ var m=document.getElementById("mailBtn"); if (m) m.setAttribute("href", mailtoHref()); var g=document.getElementById("gmailComposeBtn"); if (g) g.setAttribute("href", gmailComposeHref()); }
  function applyCandidateEmailFromCV(mail){
    mail = String(mail||"").trim();
    if(!mail || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return false;
    state.candidateEmail = mail;
    var em = document.getElementById("f_email"); if(em) em.value = mail;
    try{ syncMailHref(); persistCandidateEmail(); }catch(e){}
    return true;
  }
  function persistCandidateEmail(){
    if (!state.code) return;
    var iv = lget("voz_iv_"+state.code);
    if (!iv) return;
    iv.candidateEmail = state.candidateEmail || "";
    lset("voz_iv_"+state.code, iv);
  }
  if ((f=document.getElementById("f_email"))) f.addEventListener("input", function(e){ state.candidateEmail=e.target.value; syncMailHref(); persistCandidateEmail(); });
  if ((f=document.getElementById("f_link"))) f.addEventListener("input", function(e){ state.shareLink=e.target.value; syncMailHref(); });

  /* edit questions screen */
  app.querySelectorAll("textarea.q-edit").forEach(function(t){
    t.addEventListener("input", function(){ var i=parseInt(t.getAttribute("data-idx"),10); if(state.questions[i]) state.questions[i].text=t.value; });
  });
  if ((f=document.getElementById("createIvBtn"))) f.addEventListener("click", function(){
    // capturar valores actuales por si acaso
    app.querySelectorAll("textarea.q-edit").forEach(function(t){ var i=parseInt(t.getAttribute("data-idx"),10); if(state.questions[i]) state.questions[i].text=t.value; });
    createInterview();
  });
  if ((f=document.getElementById("bulkSendBtn"))) f.addEventListener("click", function(){
    app.querySelectorAll("textarea.q-edit").forEach(function(t){ var i=parseInt(t.getAttribute("data-idx"),10); if(state.questions[i]) state.questions[i].text=t.value; });
    bulkFinalizeSend();
  });
  // Carga perezosa del banco de preguntas al entrar a la edición.
  if (state.screen==="edit-questions" && state.qbank.items===null && !state.qbank.loading) loadQuestionBank();

  /* review screen */
  if ((f=document.getElementById("evalBtn"))) f.addEventListener("click", evaluate);

  /* candidate: the clock starts as soon as the question appears (recording is manual) */
  if (state.screen === "interview" && state.interviewMode === "candidate"){
    var cq = state.questions[state.idx];
    if (cq && !state.answers[cq.id] && !state.qTiming && !rt.autoStartedFor[cq.id]){
      rt.autoStartedFor[cq.id] = true;
      startQuestionTimer(cq);
    }
  }
}

/* ---- marca (white-label) guardada en este navegador ---- */
(function loadBrand(){ try{ var b=lget("voz_brand"); if(b&&(b.name||b.logo)){ state.brand={ name:b.name||"", logo:b.logo||"" }; } }catch(e){} })();
function saveBrand(){ try{ lset("voz_brand", { name:state.brand.name||"", logo:state.brand.logo||"" }); }catch(e){} }

/* ---- entrada por link de invitación ---- */
// 1) Link autocontenido viejo (#e=...): trae todo embebido.
(function initFromHash(){
  try{
    var h = (window.location && window.location.hash) || "";
    var m = h.match(/[#&]e=([^&]+)/);
    if (!m) return;
    var inv = decodePayload(m[1]);
    if (inv && inv.questions && inv.questions.length){
      state.invite = inv;
      state.screen = "invite-landing";
    }
  } catch(e){}
})();
// 2) Link corto nuevo (?c=CODIGO o #c=CODIGO): carga la entrevista desde el servidor.
var pendingCode = (function(){
  try{
    var loc = window.location || {};
    var mq = (loc.search || "").match(/[?&]c=([^&]+)/);
    if (mq) return decodeURIComponent(mq[1]).toUpperCase();
    var mh = (loc.hash || "").match(/[#&]c=([^&]+)/);
    if (mh) return decodeURIComponent(mh[1]).toUpperCase();
  }catch(e){}
  return "";
})();
// Código del aviso público del portal (?job=CODIGO o #job=CODIGO).
var pendingJob = (function(){
  try{
    var loc = window.location || {};
    var mq = (loc.search || "").match(/[?&]job=([^&]+)/);
    if (mq) return decodeURIComponent(mq[1]).toUpperCase();
    var mh = (loc.hash || "").match(/[#&]job=([^&]+)/);
    if (mh) return decodeURIComponent(mh[1]).toUpperCase();
  }catch(e){}
  return "";
})();
// Código del fichador (?fichar=CODIGO o #fichar=CODIGO).
var pendingFichar = (function(){
  try{
    var loc = window.location || {};
    var mq = (loc.search || "").match(/[?&]fichar=([^&]+)/);
    if (mq) return decodeURIComponent(mq[1]).toUpperCase();
    var mh = (loc.hash || "").match(/[#&]fichar=([^&]+)/);
    if (mh) return decodeURIComponent(mh[1]).toUpperCase();
  }catch(e){}
  return "";
})();

// Ruteo de arranque:
if (handleOAuthRedirect()){
  // Volvimos de "Iniciar sesión con Google": ya guardamos la sesión y los tokens de Gmail.
  state.screen = "loading"; render();
  fetchSupaUser().then(function(){ routeAfterAuth(); });
} else if (pendingFichar){
  loadFichador(pendingFichar);      // empleado fichando (fichador público)
} else if (pendingJob){
  loadJobByCode(pendingJob);        // persona en búsqueda laboral: aviso público del portal
} else if (state.screen === "invite-landing"){
  render();                         // candidato con link viejo (#e=)
} else if (pendingCode){
  loadInviteByCode(pendingCode);    // candidato con link corto (?c=)
} else {
  enterRecruiter();   // reclutador: login o panel
}
})();
</script>
