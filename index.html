          (f.uploading?('<p style="margin:6px 0 0;font-size:12px;color:var(--teal)">'+ic('loader',12,'spin')+' Subiendo…</p>'):(f.file_url?('<p style="margin:6px 0 0;font-size:12px;color:var(--green)">'+ic('check',12)+' Adjunto: '+esc(f.file_name||"archivo")+'</p>'):(!audioUploadConfigured()?'<p style="margin:6px 0 0;font-size:12px;color:var(--muted)">Para adjuntar falta configurar Cloudinary.</p>':''))) +
        '</div>' +
      '</div>' +
      '<label class="field"><span class="field-label">Tipo</span><select class="bare" id="f_doc_type">'+Object.keys(DOC_TYPES).map(function(k){ return '<option value="'+k+'"'+(f.type===k?' selected':'')+'>'+esc(DOC_TYPES[k].label)+'</option>'; }).join('')+'</select></label>' +
      '<label class="field"><span class="field-label">Descripción / título</span><div class="input-row"><input id="f_doc_title" value="'+esc(f.title||"")+'" placeholder="Ej: Contrato a plazo fijo, Recibo marzo 2026…"></div></label>' +
      '<div class="grid2" style="gap:12px">' +
        '<label class="field"><span class="field-label">Fecha del documento</span><div class="input-row"><input id="f_doc_date" type="date" value="'+esc(f.doc_date||"")+'"></div></label>' +
        '<label class="field"><span class="field-label">Vencimiento (opcional)</span><div class="input-row"><input id="f_doc_exp" type="date" value="'+esc(f.expiry_date||"")+'"></div></label>' +
      '</div>' +
      '<label class="check-row" style="border-color:'+(f.signed?'var(--teal)':'var(--border)')+'"><input type="checkbox" id="f_doc_signed"'+(f.signed?' checked':'')+'><span><span class="check-title">Firmado digitalmente</span><span class="check-sub">Marcá si el documento tiene firma digital / está firmado.</span></span></label>' +
      '<label class="field"><span class="field-label">Detalle (opcional)</span><div class="input-row" style="align-items:flex-start"><textarea id="f_doc_detail" rows="2" placeholder="Notas del documento">'+esc(f.detail||"")+'</textarea></div></label>' +
      '<div style="display:flex;gap:8px"><button class="btn btn-primary btn-sm" data-action="doc-save" data-e="'+esc(e.id)+'"'+((s.saving||f.uploading)?' disabled':'')+'>'+(s.saving?(ic('loader',13,'spin')+' Guardando…'):'Guardar')+'</button><button class="btn btn-ghost btn-sm" data-action="doc-cancel">Cancelar</button></div>' +
      '</div></div>';
  }
  var fD=function(ts){ if(!ts) return "—"; try{ var d=new Date(ts); return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear(); }catch(x){ return "—"; } };
  var rowDoc=function(t){
    var ty2=DOC_TYPES[t.type]||{label:t.type,color:"var(--muted)"};
    var meta=[];
    if(t.doc_date) meta.push("Fecha: "+fD(t.doc_date));
    var chips="";
    if(t.signed){ chips+='<span class="badge" style="background:var(--surface);color:var(--green)">'+ic('check',11)+' Firmado</span>'; }
    if(t.expiry_date){ var du=daysUntil(t.expiry_date); var col=(du==null?"var(--muted)":(du<0?"var(--brick)":(du<=30?"var(--amber)":"var(--green)"))); var txt=(du<0?("VENCIDO "+fD(t.expiry_date)):("Vence "+fD(t.expiry_date)+" · "+du+"d")); chips+='<span class="badge" style="background:var(--surface);color:'+col+'">'+ic('clock',11)+' '+txt+'</span>'; }
    var certRow = t.file_url ? ('<div style="margin-top:8px"><a href="'+esc(t.file_url)+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--teal);text-decoration:none;background:var(--surface);border-radius:8px;padding:6px 10px">'+ic('file',13)+' Ver documento'+(t.file_name?(' ('+esc(t.file_name)+')'):'')+'</a></div>') : '';
    var actions='<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center">' +
      '<button class="btn btn-sm '+(t.signed?'btn-teal':'btn-ghost')+'" data-action="doc-sign" data-id="'+esc(t.id)+'" data-v="'+(t.signed?'0':'1')+'" style="font-size:11px;padding:5px 9px">'+(t.signed?'Firmado ✓':'Marcar firmado')+'</button>' +
      '<label class="dl-audio" style="display:inline-flex;align-items:center;gap:5px;color:var(--teal);cursor:pointer;font-size:11px">'+ic('file',12)+' '+(t.file_url?"Reemplazar":"Adjuntar")+'<input type="file" accept=".pdf,application/pdf,image/*" data-docfile="'+esc(t.id)+'" style="display:none"></label>' +
      '<button class="dl-audio" data-action="doc-del" data-id="'+esc(t.id)+'" style="background:none;border:none;color:var(--brick);cursor:pointer;font-size:11px;margin-left:auto">'+ic('trash',12)+' eliminar</button></div>';
    return '<div style="padding:10px 12px;background:var(--surface-2);border-radius:10px;border-left:3px solid '+ty2.color+'">' +
      '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><b style="font-size:13px;color:var(--ink)">'+esc(t.title||ty2.label)+'</b>'+(meta.length?(' <span style="font-size:12px;color:var(--muted)">· '+meta.join(" · ")+'</span>'):'')+'</div><div style="display:flex;gap:6px;flex-wrap:wrap">'+chips+'</div></div>' +
      (t.detail?('<p style="margin:6px 0 0;font-size:12.5px;color:var(--muted);white-space:pre-wrap">'+esc(t.detail)+'</p>'):'') +
      certRow + actions +
    '</div>';
  };
  var docSection=function(title, type){
    var arr=items.filter(function(t){ return t.type===type; }).sort(function(a,b){ return new Date(b.created_at||0)-new Date(a.created_at||0); });
    var body=arr.length?('<div style="display:grid;gap:8px">'+arr.map(rowDoc).join('')+'</div>'):'<div style="padding:8px 10px;color:var(--muted);font-size:13px">— sin registros</div>';
    return '<div style="margin-top:16px"><p style="font-size:12.5px;font-weight:800;color:'+(DOC_TYPES[type].color)+';margin:0 0 6px;text-transform:uppercase;letter-spacing:.03em">'+esc(title)+' ('+arr.length+')</p>'+body+'</div>';
  };
  html += docSection("Contratos", "contrato");
  html += docSection("Recibos", "recibo");
  html += docSection("Certificados", "certificado");
  html += docSection("Constancias", "constancia");
  html += docSection("Otros documentos", "otro");
  // Firmas digitales (todos los firmados)
  var firmados=items.filter(function(t){ return t.signed; }).sort(function(a,b){ return new Date(b.created_at||0)-new Date(a.created_at||0); });
  html += '<div style="margin-top:16px"><p style="font-size:12.5px;font-weight:800;color:var(--green);margin:0 0 6px;text-transform:uppercase;letter-spacing:.03em">Firmas digitales ('+firmados.length+')</p>';
  if(!firmados.length){ html += '<div style="padding:8px 10px;color:var(--muted);font-size:13px">— sin documentos firmados</div>'; }
  else { html += '<div style="display:grid;gap:8px">'+firmados.map(rowDoc).join('')+'</div>'; }
  html += '</div>';
  // Vencimientos
  var venc=items.filter(function(t){ return t.expiry_date; }).sort(function(a,b){ return new Date(a.expiry_date)-new Date(b.expiry_date); });
  html += '<div style="margin-top:16px"><p style="font-size:12.5px;font-weight:800;color:var(--brick);margin:0 0 6px;text-transform:uppercase;letter-spacing:.03em">Vencimientos ('+venc.length+')</p>';
  if(!venc.length){ html += '<div style="padding:8px 10px;color:var(--muted);font-size:13px">— sin vencimientos cargados</div>'; }
  else { html += '<div style="display:grid;gap:6px">'+venc.map(function(t){ var du=daysUntil(t.expiry_date); var col=(du<0?"var(--brick)":(du<=30?"var(--amber)":"var(--green)")); return '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--surface-2);border-radius:9px;font-size:13px"><span style="flex:1;min-width:120px;color:var(--ink)"><b>'+esc(t.title||(DOC_TYPES[t.type]||{}).label||t.type)+'</b> <span style="color:var(--muted);font-size:12px">· '+esc((DOC_TYPES[t.type]||{}).label||t.type)+'</span></span><span style="color:'+col+';font-weight:700;white-space:nowrap">'+(du<0?("Vencido "+fD(t.expiry_date)):("Vence "+fD(t.expiry_date)+" · "+du+"d"))+'</span></div>'; }).join('')+'</div>'; }
  html += '</div>';
  // Historial
  var hist=items.slice().sort(function(a,b){ return new Date(b.created_at||0)-new Date(a.created_at||0); });
  var fdt2=function(ts){ try{ var d=new Date(ts); return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear()+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }catch(x){ return ""; } };
  html += '<div style="margin-top:20px"><p style="font-size:12.5px;font-weight:800;color:var(--ink);margin:0 0 6px;text-transform:uppercase;letter-spacing:.03em">Historial (por fecha) ('+hist.length+')</p>';
  if(!hist.length){ html += '<div style="padding:8px 10px;color:var(--muted);font-size:13px">— sin registros</div>'; }
  else { html += '<div style="display:grid;gap:6px">'+hist.map(function(t){ var ty2=DOC_TYPES[t.type]||{label:t.type,color:"var(--muted)"}; return '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 10px;background:var(--surface-2);border-radius:9px;font-size:12.5px"><span class="mono" style="color:var(--muted);white-space:nowrap">'+fdt2(t.created_at)+'</span><span class="badge" style="background:var(--surface);color:'+ty2.color+'">'+esc(ty2.label)+'</span><span style="color:var(--ink);flex:1;min-width:100px">'+esc(t.title||"—")+(t.signed?(' <span style="color:var(--green)">✓ firmado</span>'):'')+'</span></div>'; }).join('')+'</div>'; }
  html += '</div>';
  return html;
};

  '</div>';

  html += '</div>';
  return html;
};

    return html;
  }
  html += '<div style="display:grid;gap:10px">';
  s.items.forEach(function(x){
    var r = Array.isArray(x.results) ? x.results : null;
    var top = (r && r[0]) ? r[0] : null;
    var count = r ? r.length : 0;
    html += '<div class="qa-item" data-action="open-search" data-id="'+esc(x.id)+'" style="cursor:pointer;display:flex;align-items:center;gap:14px">' +
      '<span style="flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--teal);color:#fff">'+ic('briefcase',20)+'</span>' +
      '<div style="flex:1;min-width:0">' +
        '<p style="margin:0;font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(x.title||'(sin título)')+'</p>' +
        '<p style="margin:2px 0 0;font-size:12.5px;color:var(--muted)">'+(r?(count+' candidatos rankeados'+(top?(' · mejor: '+esc(top.name||'#1')+' ('+(top.score!=null?top.score:'-')+')'):'')):'Sin analizar todavía')+'</p>' +
        '<p style="margin:2px 0 0;font-size:11.5px;color:var(--muted)">'+esc(fmtDate(x.analyzed_at||x.created_at))+'</p>' +
      '</div>' + ic('chevron',16) +
    '</div>';
  });
  html += '</div>';
  return html;
};

Screens["cv-bank"] = function(){
  var b = state.cvbank;
  var html = Header();
  html += backlink("go-cvhome","Volver a screening");
  html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--teal)">'+ic('file',19)+'<h2 style="font-size:18px;color:var(--ink)">Repositorio de CVs</h2></div>';
  html += '<p style="font-size:13px;color:var(--muted);margin:0 0 16px">Subí uno o varios CV en PDF y organizalos en <b>carpetas por puesto</b>. Quedan guardados en tu cuenta y se usan en tus búsquedas.</p>';
  if(!audioUploadConfigured()) html += Note("info", "Para guardar el PDF original y poder abrirlo después, configurá Cloudinary. Igual podés subir CVs: se guarda el texto para el análisis.");

  var active = state.cvbank.folder || "";
  // Barra de carpetas (chips): "Todas" + una por cada carpeta con CVs + la carpeta activa recién creada + "Nueva carpeta".
  if (b.cvs && b.cvs.length !== undefined){
    var counts = {}; var total = 0;
    (b.cvs||[]).forEach(function(c){ var f=c.folder||""; counts[f]=(counts[f]||0)+1; total++; });
    var names = Object.keys(counts).filter(function(f){ return f!==""; });
    // Sumamos las carpetas guardadas (persisten aunque estén vacías).
    (state.cvbank.folders||[]).forEach(function(fo){ if(fo && fo.name && names.indexOf(fo.name)<0) names.push(fo.name); });
    if (active && active!=="__none__" && names.indexOf(active)<0) names.push(active);
    names.sort();
    var chip = function(key,label,count,isActive){
      return '<button class="pill-time" data-action="cv-folder" data-f="'+esc(key)+'" style="cursor:pointer;border:none;background:'+(isActive?'var(--teal)':'var(--surface-2)')+';color:'+(isActive?'#fff':'var(--ink)')+';'+(isActive?'font-weight:800':'opacity:.85')+'">'+esc(label)+(count!=null?(' ('+count+')'):'')+'</button>';
    };
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">';
    html += chip("", "Todos los CVs", total, active==="");
    if (counts[""]) html += chip("__none__", "Sin carpeta", counts[""], false); // ver solo los sin carpeta
    names.forEach(function(f){ html += chip(f, f, counts[f]||0, active===f); });
    html += '<button class="pill-time" data-action="cv-newfolder" style="cursor:pointer;border:1px dashed var(--border);background:transparent;color:var(--teal)">'+ic('plus',12)+' Nueva carpeta</button>';
    html += '</div>';
    if (state.cvbank.creatingFolder){
      html += '<div style="display:flex;gap:8px;margin-bottom:12px"><input id="f_newfolder" placeholder="Nombre del puesto (ej: Vendedor)" style="flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--ink);font-family:inherit;font-size:14px">' +
        '<button class="btn btn-primary btn-sm" data-action="cv-newfolder-ok">Crear</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="cv-newfolder-cancel">Cancelar</button></div>';
    }
  }

  var uploadingTo = (active && active!=="__none__") ? active : "";
  html += '<div class="card" style="margin-bottom:16px">' +
    '<p style="margin:0 0 8px;font-size:12.5px;color:var(--muted)">Subiendo a la carpeta: <b style="color:var(--ink)">'+(uploadingTo?esc(uploadingTo):'Sin carpeta')+'</b>'+(uploadingTo?'':' — elegí o creá una carpeta arriba para organizar por puesto')+'</p>' +
    '<label class="btn btn-primary btn-block" style="cursor:pointer;'+(b.uploading?'opacity:.6;pointer-events:none':'')+'">'+ic('plus',15)+' '+(b.uploading?'Subiendo…':'Subir CVs (PDF)')+
      '<input id="f_cvfiles" type="file" accept="application/pdf,.pdf" multiple style="display:none"></label>' +
    (b.msg? '<p id="cvUpMsg" style="margin:10px 0 0;font-size:12.5px;color:var(--muted)">'+esc(b.msg)+'</p>' : '<p id="cvUpMsg" style="margin:10px 0 0;font-size:12.5px;color:var(--muted)"></p>') +
  '</div>';
  // Importar CVs desde Gmail (rutea por el asunto a la carpeta del puesto).
  if (googleConnected()){
    html += '<div class="card" style="margin-bottom:16px;border:1px dashed var(--teal)">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--teal)">'+ic('mail',16)+'<b style="font-size:13.5px;color:var(--ink)">Importar CVs desde tu Gmail</b></div>' +
      '<p style="margin:0 0 10px;font-size:12.5px;color:var(--muted)">Traigo los mails que tengan un <b>CV en PDF adjunto</b> y cuyo <b>asunto contenga el nombre de una de tus carpetas</b>, y lo guardo en esa carpeta. Los mails sin PDF se ignoran.</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
        '<label style="flex:1;min-width:130px;font-size:12px;color:var(--muted)">Desde<input id="f_impfrom" type="date" value="'+esc(b.impFrom||"")+'" style="width:100%;margin-top:3px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 10px;color:var(--ink);font-family:inherit;font-size:13px"></label>' +
        '<label style="flex:1;min-width:130px;font-size:12px;color:var(--muted)">Hasta<input id="f_impto" type="date" value="'+esc(b.impTo||"")+'" style="width:100%;margin-top:3px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 10px;color:var(--ink);font-family:inherit;font-size:13px"></label>' +
      '</div>' +
      '<p style="margin:0 0 10px;font-size:11.5px;color:var(--muted)">Si no elegís fechas, busco los últimos 180 días.</p>' +
      '<button class="btn btn-ghost btn-block" data-action="gmail-import" '+(b.importing?'disabled':'')+'>'+(b.importing?ic('loader',15,'spin')+' Importando…':ic('mail',15)+' Importar CVs desde Gmail')+'</button>' +
      (b.importMsg?'<p style="margin:10px 0 0;font-size:12.5px;color:var(--teal)">'+esc(b.importMsg)+'</p>':'') +
    '</div>';
  }
  if (b.loading || b.cvs===null){ html += '<div class="center-block">'+ic('loader',26,'spin')+'<p>Cargando…</p></div>'; return html; }
  if (b.error){ html += Note("err", esc(b.error)); return html; }
  if (!b.cvs.length){ html += '<div class="center-block" style="padding:24px 12px">'+ic('file',24)+'<p>Todavía no subiste ningún CV.</p></div>'; return html; }

  // Filtro por carpeta activa.
  var shownCvs = b.cvs.filter(function(c){
    if (active==="") return true;
    if (active==="__none__") return !c.folder;
    return c.folder===active;
  });
  var label = active==="" ? "Todos los CVs" : active==="__none__" ? "CVs sin carpeta" : 'Carpeta "'+active+'"';
  var isRealFolder = (active && active!=="__none__");
  html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px">' +
    '<p style="font-size:12.5px;color:var(--muted);margin:0">'+esc(label)+' · '+shownCvs.length+' CV(s)</p>' +
    (isRealFolder ? '<button class="btn btn-ghost btn-sm" data-action="cv-delfolder" style="color:var(--brick)">'+ic('trash',12)+' Eliminar carpeta</button>' : '') +
  '</div>';
  if (isRealFolder) html += '<p style="font-size:11.5px;color:var(--muted);margin:-4px 0 10px">Al eliminar la carpeta, los CVs no se borran: pasan a "Sin carpeta" y siguen en "Todos los CVs".</p>';
  if (!shownCvs.length){ html += '<div class="center-block" style="padding:20px 12px">'+ic('file',22)+'<p>No hay CVs en esta carpeta.</p></div>'; return html; }
  html += '<div style="display:grid;gap:8px">';
  shownCvs.forEach(function(c){
    html += '<div class="qa-item" style="display:flex;align-items:center;gap:12px">' +
      '<span style="flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted)">'+ic('file',18)+'</span>' +
      '<div style="flex:1;min-width:0">' +
        '<p style="margin:0;font-weight:600;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(c.candidate_name||c.file_name||'CV')+'</p>' +
        '<p style="margin:1px 0 0;font-size:11.5px;color:var(--muted)">'+(c.folder?('📁 '+esc(c.folder)+' · '):'')+esc(fmtDate(c.created_at))+(c.cv_text?'':' · sin texto legible')+'</p>' +
      '</div>' +
      (c.cv_url? '<a href="'+esc(c.cv_url)+'" target="_blank" rel="noopener" class="dl-audio" style="color:var(--teal);text-decoration:none;font-size:12px">abrir</a>' : '') +
      '<button class="dl-audio" data-action="del-cv" data-id="'+esc(c.id)+'" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px">quitar</button>' +
    '</div>';
  });
  html += '</div>';
  return html;
};

Screens["cv-newsearch"] = function(){
  var ns = state.newsearch;
  var allcvs = state.cvbank.cvs;
  var folder = ns.folder || "";
  var totalAll = (allcvs!=null) ? allcvs.length : null;
  var filtered = (allcvs!=null) ? allcvs.filter(function(c){ return cvInFolder(c, folder); }) : null;
  var nCv = (filtered!=null) ? filtered.length : null;
  // Chips de carpeta (para elegir qué CVs entran al análisis).
  var folderChips = "";
  if (allcvs && allcvs.length !== undefined){
    var fcounts={}; (allcvs||[]).forEach(function(c){ var f=c.folder||""; fcounts[f]=(fcounts[f]||0)+1; });
    var fnames=Object.keys(fcounts).filter(function(f){ return f!==""; });
    (state.cvbank.folders||[]).forEach(function(fo){ if(fo&&fo.name&&fnames.indexOf(fo.name)<0) fnames.push(fo.name); });
    fnames.sort();
    var fchip=function(key,label,count,isActive){
      return '<button type="button" class="pill-time" data-action="ns-folder" data-f="'+esc(key)+'" style="cursor:pointer;border:none;background:'+(isActive?'var(--teal)':'var(--surface-2)')+';color:'+(isActive?'#fff':'var(--ink)')+';'+(isActive?'font-weight:800':'opacity:.85')+'">'+esc(label)+(count!=null?(' ('+count+')'):'')+'</button>';
    };
    var chipsHtml='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">';
    chipsHtml+=fchip("","Todas las carpetas",totalAll||0,folder==="");
    if(fcounts[""]) chipsHtml+=fchip("__none__","Sin carpeta",fcounts[""],folder==="__none__");
    fnames.forEach(function(f){ chipsHtml+=fchip(f,f,fcounts[f]||0,folder===f); });
    chipsHtml+='</div>';
    folderChips = '<label class="field"><span class="field-label">Carpeta a analizar</span>'+chipsHtml+'<span class="field-hint">Elegí una carpeta para rankear solo esos CVs, o dejá «Todas las carpetas».</span></label>';
  }
  var html = Header();
  html += backlink("go-cvhome","Volver a screening");
  html += '<div class="card">' +
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--teal)">'+ic('plus',18)+'<h2 style="font-size:17px;color:var(--ink)">Nueva búsqueda</h2></div>' +
    '<p style="font-size:13px;color:var(--muted);margin:0 0 18px">Describí el puesto lo más claro posible: la IA va a usar esta descripción para decidir qué CVs encajan mejor.</p>' +
    (state.searches.error2 ? Note("err", esc(state.searches.error2)) : '') +
    '<div style="display:grid;gap:16px">' +
      ((state.jobs.items && state.jobs.items.length) ? (
        '<label class="field" style="background:var(--teal-tint);border-radius:12px;padding:12px 14px"><span class="field-label" style="color:var(--teal)">Copiar de un aviso del portal (opcional)</span>' +
          '<select class="bare" id="f_ns_fromjob">' +
            '<option value="">— No copiar, cargar a mano —</option>' +
            state.jobs.items.map(function(jp){ return '<option value="'+esc(jp.id)+'"'+((ns.fromJob===jp.id)?' selected':'')+'>'+esc(jp.position||'(sin puesto)')+'</option>'; }).join('') +
          '</select>' +
          '<span class="field-hint">Trae automáticamente el puesto, la descripción y los requisitos de ese aviso (y selecciona su carpeta si existe).</span>' +
        '</label>'
      ) : '') +
      folderChips +
      '<label class="field"><span class="field-label">Puesto a cubrir</span>'+fieldInput("f_searchtitle","Ej: Vendedor de mostrador, Desarrollador backend Ssr", ns.title, "briefcase")+'</label>' +
      '<label class="field"><span class="field-label">Descripción del puesto y qué buscás</span>' +
        '<div class="input-row" style="align-items:flex-start"><span style="color:var(--muted);margin-top:2px">'+ic('list',15)+'</span><textarea id="f_searchdesc" rows="5" placeholder="Ej: Buscamos alguien con experiencia en atención al cliente, orientación comercial y trabajo en equipo. Tareas: caja, reposición, asesoramiento.">'+esc(ns.description)+'</textarea></div>' +
        '<span class="field-hint">Descripción general del rol y las tareas.</span>' +
      '</label>' +
      '<label class="field"><span class="field-label" style="color:var(--brick)">Requisitos excluyentes (opcional)</span>' +
        '<div class="input-row" style="align-items:flex-start"><span style="color:var(--brick);margin-top:2px">'+ic('alert',15)+'</span><textarea id="f_searchmust" rows="3" placeholder="Ej: 2+ años en retail presencial. Disponibilidad full time. Secundario completo.">'+esc(ns.must)+'</textarea></div>' +
        '<span class="field-hint">Si un CV no los cumple, la IA lo manda al fondo del ranking (puntaje muy bajo).</span>' +
      '</label>' +
      '<label class="field"><span class="field-label" style="color:var(--green)">Requisitos que suman puntos (opcional)</span>' +
        '<div class="input-row" style="align-items:flex-start"><span style="color:var(--green);margin-top:2px">'+ic('sparkle',15)+'</span><textarea id="f_searchnice" rows="3" placeholder="Ej: Experiencia con sistemas de caja, inglés, manejo de redes sociales.">'+esc(ns.nice)+'</textarea></div>' +
        '<span class="field-hint">No excluyen: suman al puntaje del candidato que los tenga.</span>' +
      '</label>' +
    '</div>' +
    (nCv===0
      ? ((totalAll>0)
          ? Note("info","No hay CVs en esta carpeta. Elegí otra carpeta arriba o subí CVs.") + '<button class="btn btn-ghost btn-block" data-action="go-cvbank" style="margin-top:12px">'+ic('file',15)+' Ir a cargar CVs</button>'
          : Note("info","Todavía no tenés CVs en el repositorio. Cargá algunos primero.") + '<button class="btn btn-ghost btn-block" data-action="go-cvbank" style="margin-top:12px">'+ic('file',15)+' Ir a cargar CVs</button>')
      : '<button class="btn btn-primary btn-block" id="analyzeBtn" style="margin-top:20px" '+(state.searches.analyzing?'disabled':'')+'>'+(state.searches.analyzing?ic('loader',15,'spin')+' Analizando '+ (nCv!=null?nCv:'') +' CVs…':ic('sparkle',15)+' Analizar y rankear'+(nCv!=null?(' ('+nCv+' CVs)'):''))+'</button>') +
  '</div>';
  return html;
};

Screens["cv-ranking"] = function(){
  var x = state.searches.current;
  if(!x) return Header() + Centered(ic('alert',26), "No encontré la búsqueda", "Volvé a screening.");
  var r = Array.isArray(x.results) ? x.results : [];
  var html = Header();
  html += backlink("go-cvhome","Volver a screening");
  html += '<div class="report-hero">' +
    '<div class="report-eyebrow">Búsqueda</div>' +
    '<h2 style="font-size:20px;margin:6px 0 0">'+esc(x.title||'(sin título)')+'</h2>' +
    (x.description?'<p style="margin-top:10px;font-size:13px;opacity:.85;line-height:1.6">'+esc(x.description)+'</p>':'') +
    (x.must_have?'<p style="margin-top:8px;font-size:12px;opacity:.85"><strong>Excluyentes:</strong> '+esc(x.must_have)+'</p>':'') +
    (x.nice_to_have?'<p style="margin-top:4px;font-size:12px;opacity:.85"><strong>Suman:</strong> '+esc(x.nice_to_have)+'</p>':'') +
    '<p style="margin-top:10px;font-size:11.5px;opacity:.6">'+(r.length?(r.length+' candidatos · analizado '+esc(fmtDate(x.analyzed_at))):'Sin analizar')+'</p>' +
  '</div>';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px">' +
    '<button class="btn btn-ghost btn-sm" data-action="reanalyze" '+(state.searches.analyzing?'disabled':'')+'>'+(state.searches.analyzing?ic('loader',14,'spin')+' Analizando…':ic('rotate',14)+' Re-analizar con los CVs actuales')+'</button>' +
    '<button class="btn btn-ghost btn-sm" data-action="del-search" data-id="'+esc(x.id)+'">'+ic('trash',14)+' Eliminar búsqueda</button>' +
  '</div>';
  if (state.searches.error2) html += Note("err", esc(state.searches.error2));
  if (state.searches.note) html += Note("info", esc(state.searches.note));
  if (!r.length){ html += '<div class="center-block" style="padding:24px 12px">'+ic('alert',24)+'<p>Esta búsqueda no tiene ranking todavía. Tocá "Re-analizar".</p></div>'; return html; }
  var sel = state.searches.rankSel || [];
  html += '<p style="font-size:12.5px;color:var(--muted);margin:0 0 12px">Tocá <b>Elegir</b> en varios candidatos para invitarlos a todos juntos (a cada uno le llega su propio mail con el CV reconocido), o usá <b>Invitar</b> para uno solo.</p>';
  // Dejamos espacio abajo para que la barra fija de acción no tape la última tarjeta.
  html += '<div style="display:grid;gap:12px'+(sel.length?';padding-bottom:84px':'')+'">';
  r.forEach(function(c, i){
    var sc = (typeof c.score==='number')?c.score:0;
    var pros = Array.isArray(c.pros)?c.pros:[];
    var cons = Array.isArray(c.cons)?c.cons:[];
    var isSel = (c.id && sel.indexOf(c.id)>=0);
    var pickBtn = c.id
      ? '<button type="button" data-action="rank-toggle" data-cvid="'+esc(c.id)+'" title="Elegir para invitar a varios" style="flex-shrink:0;display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:11px 18px;font-size:14px;font-weight:800;cursor:pointer;transition:all .12s;border:2px solid '+(isSel?'var(--green)':'var(--teal)')+';box-shadow:0 2px 8px rgba(0,0,0,.18);'+(isSel?'background:var(--green);color:#fff':'background:var(--teal);color:#fff')+'">'+(isSel?ic('check',16)+' Elegido':ic('plus',16)+' Elegir')+'</button>'
      : '';
    html += '<div class="qa-item"'+(isSel?' style="border:2px solid var(--teal);background:var(--teal-tint)"':'')+'>' +
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
        pickBtn +
        '<span class="mono" style="flex-shrink:0;width:22px;text-align:center;font-weight:800;font-size:15px;color:var(--muted)">'+(i+1)+'</span>' +
        '<span style="flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;background:'+fitTintVar(sc)+';color:'+fitColorVar(sc)+'" class="mono">'+sc+'</span>' +
        '<div style="flex:1;min-width:80px">' +
          '<p style="margin:0;font-weight:700;font-size:14.5px;color:var(--ink)">'+esc(c.name||('Candidato '+(i+1)))+'</p>' +
          '<p style="margin:1px 0 0;font-size:12px;color:'+fitColorVar(sc)+';font-weight:600">Encaje '+esc(c.fit||'')+(isSel?' · <span style="color:var(--teal)">✓ elegido</span>':'')+'</p>' +
        '</div>' +
        '<button class="btn btn-primary btn-sm" data-action="invite-from-cv" data-pos="'+esc(x.title||'')+'" data-cvid="'+esc(c.id||'')+'" style="flex-shrink:0">'+ic('mic',13)+' Invitar</button>' +
      '</div>' +
      (c.summary?'<p style="margin:10px 0 0;font-size:13px;color:var(--ink);line-height:1.5">'+esc(c.summary)+'</p>':'') +
      ((pros.length||cons.length)?'<div class="grid2" style="margin-top:10px;gap:10px">' +
        (pros.length?'<div>'+ReportList("A favor", pros, "var(--green)")+'</div>':'') +
        (cons.length?'<div>'+ReportList("En contra", cons, "var(--brick)")+'</div>':'') +
      '</div>':'') +
    '</div>';
  });
  html += '</div>';
  // Barra de acción FIJA abajo (siempre visible mientras haya candidatos elegidos).
  if (sel.length){

Screens["interview-detail"] = function(){
  var x = state.dash.detail;
  if (!x) return Header() + Centered(ic('alert',26), "No encontré la entrevista", "Volvé al panel.");
  var sc = (typeof x.score==='number')?x.score:null;
  var r = x.report || {};
  var answers = Array.isArray(x.answers) ? x.answers : [];
  var html = Header();
  html += backlink("go-recruiterhome","Volver al panel");
  html += '<div class="report-hero">' +
    '<div class="report-eyebrow">'+esc(x.candidate_name||'(sin nombre)')+' · '+esc(x.position||'')+'</div>' +
    '<div style="display:flex;align-items:flex-end;gap:14px;margin-top:8px;flex-wrap:wrap">' +
      (sc!=null?'<div class="report-score">'+sc+'<span style="font-size:20px;opacity:.6">/10</span></div>':'') +
      (x.recommendation?'<span class="rec-tag" style="background:'+verdictColor(x.recommendation)+';color:#fff;border:none">'+esc(x.recommendation)+'</span>':'') +
    '</div>' +
    (r.overall?'<p style="margin-top:14px;font-size:13.5px;opacity:.85;line-height:1.6">'+esc(r.overall)+'</p>':'') +
    '<p style="margin-top:10px;font-size:11.5px;opacity:.6">'+esc(x.candidate_email||'')+' · '+esc(fmtDate(x.completed_at))+(x.report&&x.report.consent&&x.report.consent.accepted?' · ✓ consentimiento aceptado'+(x.report.consent.at?(' ('+esc(fmtDate(x.report.consent.at))+')'):''):'')+'</p>' +
  '</div>';
  html += '<div class="grid2" style="margin-top:16px">' + ReportList("Fortalezas", r.strengths, "var(--green)") + ReportList("A mejorar", r.improve, "var(--amber)") + '</div>';
  html += LanguageBox(r.language);
  if (r.probes && r.probes.length) html += '<div style="margin-top:16px">'+ReportList("Repreguntas sugeridas", r.probes, "var(--teal)")+'</div>';
  var perMap = {}; if (r.perQuestion) r.perQuestion.forEach(function(p){ if(p&&p.n!=null) perMap[p.n]=p; });
  html += '<div style="display:flex;align-items:center;gap:8px;margin:20px 0 10px;color:var(--teal)">'+ic('mic',18)+'<h3 style="font-size:15px;color:var(--ink)">Respuestas</h3></div>';
  if (r && r.audioError) html += Note("warn","Los audios de esta entrevista no se pudieron guardar (se muestra la transcripción). Diagnóstico: "+esc(r.audioError));
  html += '<div style="display:grid;gap:12px">';
  answers.forEach(function(a){
    var p = perMap[a.n];
    var pScore = (p && typeof p.score==="number") ? p.score : null;
    var label = a.isFollowup ? 'Repregunta' : ('Pregunta '+esc(String(a.n||'')));
    html += '<div class="qa-item"'+(a.isFollowup?' style="border-left:3px solid var(--purple);background:var(--purple-tint)"':'')+'>' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
        (pScore!=null?'<span class="mono" style="flex-shrink:0;min-width:40px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:'+scoreTintVar(pScore)+';color:'+scoreColorVar(pScore)+'">'+pScore+'<span style="font-size:9px;opacity:.6">/10</span></span>':'') +
        '<p style="margin:0;font-size:12px;font-weight:700;color:'+(a.isFollowup?'var(--purple)':'var(--muted)')+'">'+label+'</p>' +
      '</div>' +
      '<p class="qa-text" style="margin-top:6px">'+esc(a.text||'')+'</p>' +
      (a.audio ? '<audio controls src="'+esc(a.audio)+'" style="width:100%;margin-top:8px"></audio>' : '') +
      (p&&p.assessment ? '<p style="margin:8px 0 0;font-size:13px;color:var(--ink)"><strong style="color:var(--muted)">IA:</strong> '+esc(p.assessment)+'</p>' : '') +
      (!a.audio && a.transcript ? '<p style="margin:8px 0 0;font-size:13px;color:var(--muted)">'+esc(a.transcript)+'</p>' : '') +
    '</div>';
  });
  html += '</div>';
  return html;
};

/* ---------------- análisis con IA (Gemini vía función serverless /api/analyze) ---------------- */
var AI_ANALYZE_ENDPOINT = "/api/analyze";
function analyzeWithAI(){
  // Mapa id -> número de pregunta (para vincular cada repregunta con su pregunta madre).
  var idToN = {}; state.questions.forEach(function(q,i){ idToN[q.id] = i+1; });
  var payload = {
    position: state.config.position, company: state.config.company, focus: state.config.focus,
    level: state.config.level, language: state.config.language,
    questions: state.questions.map(function(q,i){
      var a = state.answers[q.id] || {};
      var isFu = !!q.isFollowup;
      return { n:i+1, text:q.text, category:q.category, lang:q.lang||"es", transcript:(a.transcript||""), durationSec:(a.signals&&a.signals.durationSec)||0,
               isFollowup:isFu, parentN: isFu ? (idToN[q.rootId]||null) : null };
    })
  };
  return fetch(AI_ANALYZE_ENDPOINT, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j && j.ok && j.analysis) return j.analysis; throw new Error((j && j.error) || "sin_analisis"); });
}
/* ---- Transcripción por IA del audio (server-side): más confiable y multi-idioma que
   la del navegador. Solo REEMPLAZA la transcripción si la IA devuelve texto; si falla
   o viene vacía, se conserva lo que hubiera (no rompe el flujo). ---- */
function blobToBase64(blob){
  return new Promise(function(resolve){
    try{
      var fr = new FileReader();
      fr.onload = function(){ var s = String(fr.result||""); var i = s.indexOf(","); resolve(i>=0 ? s.slice(i+1) : ""); };
      fr.onerror = function(){ resolve(""); };
      fr.readAsDataURL(blob);
    }catch(e){ resolve(""); }
  });
}
function transcribeOneAI(q){
  var a = state.answers[q.id];
  if (!a) return Promise.resolve();
  var getBlob = (typeof Blob!=="undefined" && a.blob instanceof Blob) ? Promise.resolve(a.blob)
    : (a.blobUrl && a.blobUrl.indexOf("blob:")===0 ? fetch(a.blobUrl).then(function(r){ return r.blob(); }).catch(function(){ return null; }) : Promise.resolve(null));
  return getBlob.then(function(blob){
    if (!blob) return;
    return blobToBase64(blob).then(function(b64){
      if (!b64) return;
      var mime = (blob.type||"audio/webm").split(";")[0];
      return withTimeout(
        fetch(AI_ANALYZE_ENDPOINT, { method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ task:"transcribe", language:(q.lang||state.config.language||"es"), audio:{ data:b64, mimeType:mime } }) })
          .then(function(r){ return r.json(); }), 30000)
        .then(function(j){ if (j && j.ok && j.transcript && j.transcript.trim()){ state.answers[q.id].transcript = j.transcript.trim(); state.answers[q.id].aiTranscribed = true; } })
        .catch(function(){});
    });
  }).catch(function(){});
}
/* Transcribe (en paralelo) todas las respuestas que tengan audio. Best-effort. */
function transcribeAnswersWithAI(){
  var qs = state.questions.filter(function(q){ var a=state.answers[q.id]; return a && ((typeof Blob!=="undefined" && a.blob instanceof Blob) || (a.blobUrl && a.blobUrl.indexOf("blob:")===0)); });
  if (!qs.length) return Promise.resolve();
  return Promise.all(qs.map(function(q){ return transcribeOneAI(q); }));
}
function generateQuestions(){
  var c = state.config;
  var target = c.count === "auto" ? (c.level==="Junior"?7:c.level==="Senior"?8:c.level==="Gerencial"?9:7) : (parseInt(c.count,10)||7);
  var payload = { task:"questions", position:c.position, company:c.company, focus:c.focus, companyUrl:(c.companyUrl||""), level:c.level, language:c.language, count:target, includeEnglish: !!c.includeEnglish };
  if (rt.cvText && rt.cvText.length > 40) payload.cvText = rt.cvText;
  else if (rt.cvData && rt.cvData.data) payload.cv = { data: rt.cvData.data, mimeType: rt.cvData.mimeType };
  return fetch(AI_ANALYZE_ENDPOINT, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j && j.ok && Array.isArray(j.questions) && j.questions.length) return j.questions; var er=new Error((j && j.error) || "sin_preguntas"); er.detail=(j && j.detail)||""; throw er; });
}
function mapAIQuestions(list, lang){
  return list.slice(0,14).map(function(q,i){
    var cat = q.category || "Experiencia";
    if (!SECONDS_BY_CAT[cat]) cat = "Experiencia";
    var ql = (q.lang==="en") ? "en" : (lang||"es");
    return { id:"q"+i, text:String(q.text||"").trim(), category:cat, seconds: SECONDS_BY_CAT[cat]||120, lang: ql };
  }).filter(function(q){ return q.text; });

/* Veredicto general 1-10 -> etiqueta y color. */
function verdictFromScore(sc){ sc=Number(sc)||0; return sc>=7 ? "Aprobado" : sc>=5 ? "Medio" : "Desaprobado"; }
function verdictColor(v){ v=(v||"").toLowerCase();
  if(v.indexOf("desaprob")>=0 || v.indexOf("no avanzar")>=0) return "var(--brick)";
  if(v.indexOf("medio")>=0 || v.indexOf("reserva")>=0) return "var(--amber)";
  if(v.indexOf("aprob")>=0 || v.indexOf("avanzar")>=0) return "var(--green)";
  return "var(--muted)";
}
function reportFromAI(ai){
  function arr(x){ return Array.isArray(x) ? x.filter(function(v){ return v!=null && String(v).trim(); }).map(String) : []; }
  var sc = Number(ai.score); if (!(sc>=1 && sc<=10)) sc = 1; sc = Math.round(sc*2)/2;
  var per = Array.isArray(ai.perQuestion) ? ai.perQuestion.map(function(p){
    var ps = Number(p.score); ps = (ps>=1 && ps<=10) ? Math.round(ps*2)/2 : null;
    return { n:p.n, score:ps, rating:String(p.rating||""), assessment:String(p.assessment||"") };
  }) : [];
  return {
    score: sc,
    recommendation: String(ai.veredicto || ai.recommendation || verdictFromScore(sc)),
    overall: String(ai.overall||""),
    strengths: arr(ai.strengths),
    improve: arr(ai.improve),
    probes: arr(ai.probes),
    perQuestion: per,
    language: (ai.language && typeof ai.language==="object") ? {
      lang: String(ai.language.lang||""),
      level: String(ai.language.level||""),
      answeredInLanguage: ai.language.answeredInLanguage,
      comment: String(ai.language.comment||"")
    } : null,
    ai: true
  };
}

function langLevelColor(lv){

  if(lv.indexOf("avanz")>=0||lv.indexOf("nativ")>=0||lv.indexOf("biling")>=0) return "var(--green)";
  if(lv.indexOf("interm")>=0) return "var(--amber)";

}

/* ---------------- envío automático de resultados (sin acción del candidato) ----------------
   Se usa Web3Forms (https://web3forms.com), gratis y sin backend. Pegá tu Access Key
   abajo para activarlo. Los resultados llegan al email dueño de esa Access Key.
   Si queda vacío, la app cae al envío manual (botón) como respaldo. */
var WEB3FORMS_KEY = "bc827930-037b-41dd-b03b-63d59d485c53";

/* ---------------- audios: subida a Cloudinary (unsigned, sin backend) ----------------
   Completá estos dos datos de tu cuenta gratuita de Cloudinary para que los audios
   del candidato se suban y te lleguen como enlaces para escuchar. Si quedan vacíos,
   el mail cae a la transcripción como respaldo. */
var CLOUDINARY_CLOUD_NAME = "memtugeu";
var CLOUDINARY_UPLOAD_PRESET = "ml_default";
function audioUploadConfigured(){ return !!(CLOUDINARY_CLOUD_NAME && CLOUDINARY_UPLOAD_PRESET); }
function uploadAudioToCloudinary(blob, publicId){
  function attempt(withPid){
    var fd = new FormData();
    fd.append("file", blob);
    fd.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    // public_id único: evita que las subidas con el mismo nombre de archivo
    // se pisen entre sí (todas terminaban apuntando al mismo asset/URL).
    if (withPid && publicId) fd.append("public_id", publicId);
    return fetch("https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/auto/upload", { method:"POST", body: fd })
      .then(function(r){ return r.json(); })
      .then(function(j){ if (j && j.secure_url) return j.secure_url; throw new Error((j && j.error && j.error.message) || "Falló la subida"); });
  }
  // Si el preset no permite public_id, reintentamos sin él (el nombre de archivo único ya ayuda).
  if (publicId) return attempt(true).catch(function(){ return attempt(false); });
  return attempt(false);
}
/* Sube todos los audios grabados y guarda las URLs en state.audioUrls (best-effort). */
function uploadAllAudios(){
  rt.audioError = "";
  if (!audioUploadConfigured()) { rt.audioError = "Cloudinary no está configurado para subir audios."; return Promise.resolve(); }
  var qs = state.questions.slice();
  var chain = Promise.resolve();
  state.audioUrls = state.audioUrls || {};
  qs.forEach(function(q){
    var a = state.answers[q.id];
    if (!a) return;
    var hasBlob = (typeof Blob !== "undefined") && (a.blob instanceof Blob);
    var hasUrl = a.blobUrl && a.blobUrl.indexOf("blob:") === 0;
    if (!hasBlob && !hasUrl) return;
    chain = chain.then(function(){
      // Preferimos el Blob en memoria (más robusto: Safari a veces pierde la blob: URL).
      var getBlob = hasBlob ? Promise.resolve(a.blob) : fetch(a.blobUrl).then(function(r){ return r.blob(); });
      return getBlob.then(function(blob){
        var ext = /mp4/.test(blob.type) ? ".mp4" : /ogg/.test(blob.type) ? ".ogg" : ".webm";
        // Nombre GLOBALMENTE único: entrevista + pregunta + tiempo + azar.
        // Antes se usaba "respuesta-q0" fijo, y una entrevista pisaba los audios de otra.
        var uniq = (state.code || "iv") + "-" + q.id + "-" + Date.now().toString(36) + "-" + Math.floor(Math.random()*1e9).toString(36);
        var named = blob;
        try{ named = new File([blob], "resp-"+uniq+ext, { type: blob.type || "audio/webm" }); }catch(e){}
        return uploadAudioToCloudinary(named).then(function(url){ state.audioUrls[q.id] = url; })
          .catch(function(e){ if(!rt.audioError) rt.audioError = (e && e.message) || "Falló la subida del audio."; });
      }).catch(function(e){ if(!rt.audioError) rt.audioError = (e && e.message) || "No pude leer el audio grabado."; });
    });
  });
  return chain;
}

function Badge(text, catKey){
  var v = 'var(' + (CATEGORY_VAR[catKey]||'--teal') + ')';
  var t = 'var(' + (CATEGORY_TINT[catKey]||'--teal-tint') + ')';
  return '<span class="badge" style="background:'+t+';color:'+v+'">'+esc(text)+'</span>';
}

Screens.interview = function(){
  var q = state.questions[state.idx];
  if (!q) return Header() + Centered(ic('alert',28), "No hay más preguntas", "Volvé al inicio.");
  var total = state.questions.length;
  var pct = ((state.idx + (state.answers[q.id]?1:0)) / total) * 100;
  var root = q.rootId || q.id;
  var nx = state.questions[state.idx+1];
  var nextIsFollowup = !!(nx && nx.isFollowup && nx.rootId === root);
  var answer = state.answers[q.id];
  var answered = !!(answer && answer.blobUrl);
  var timedOut = !!(answer && answer.noAnswer);
  var isCandidate = state.interviewMode === "candidate";
  var lastLabel = isCandidate ? "Enviar respuestas" : "Terminar entrevista";

  var ring = 2*Math.PI*54;
  var progress = state.qTiming ? state.timeLeft/(state.timeTotal || q.seconds) : 1;
  var overtime = state.qTiming && state.timeLeft <= 10;

  var html = Header();
  if (state.config.position) html += '<p style="font-size:12px;color:var(--muted);font-weight:600;margin:0 0 8px">Entrevista · '+esc(state.config.position)+'</p>';
  html += '<div style="margin-bottom:22px">' +
    '<div class="progress-top"><span>Pregunta '+(state.idx+1)+' de '+total+'</span><span>'+Math.round(pct)+'% completo</span></div>' +
    '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>' +
  '</div>';

  html += '<div class="card">';
  html += '<div class="qa-meta">' + Badge(q.category, q.category) +
    '<span class="pill-time">'+ic('clock',12)+' '+fmt(questionTime(q, isCandidate))+(isCandidate?' en total':' para responder')+'</span>' +
    (q.lang!=="es" ? Badge(LANG_LABEL[q.lang], q.lang==="en"?"Inglés":"Otro idioma") : '') +
  '</div>';
  html += '<p style="font-size:17px;line-height:1.55;font-family:Fraunces,Georgia,serif;font-weight:500;margin:0">'+esc(q.text)+'</p>';
  // Aviso claro: si la pregunta está en otro idioma que el principal, hay que responder en ESE idioma.
  var mainLang = state.config.language || "es";
  if (q.lang && q.lang !== mainLang){
    var lname = q.lang==="en" ? "inglés" : q.lang==="pt" ? "portugués" : (LANG_LABEL[q.lang]||"otro idioma");
    html += '<div class="note note-warn" style="margin-top:12px">'+ic('alert',15)+'<span><strong>Respondé esta pregunta en '+lname+'.</strong> Sirve para evaluar tu nivel en ese idioma: si respondés en otro idioma, no se puede evaluar.</span></div>';
  }

  html += '<div class="rec-wrap"><div class="rec-ring">' +
    '<svg width="168" height="168" viewBox="0 0 128 128">' +
      '<circle cx="64" cy="64" r="54" fill="none" stroke="var(--border)" stroke-width="6"/>' +
      '<circle id="recRing" cx="64" cy="64" r="54" fill="none" stroke="'+(overtime?'var(--brick)':'var(--teal)')+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+ring+'" stroke-dashoffset="'+(ring*(1-progress))+'" style="transition:stroke-dashoffset 1s linear"/>' +
    '</svg>';
  var canReRecord = isCandidate && answered && state.qTiming && !state.recording;
  if (state.recording){
    html += '<button class="rec-btn rec-active" data-action="stop-rec">'+ic('square',18)+'<span style="font-size:12px;font-weight:700">Detener</span><span class="mono" id="recCount" style="font-size:13px;font-weight:600">'+fmt(state.timeLeft)+'</span></button>';
  } else if (answered){
    html += '<div class="rec-btn rec-done">'+ic('check',24)+'<span style="font-size:12px;font-weight:600">Grabado</span></div>';
  } else if (timedOut){
    html += '<div class="rec-btn rec-done" style="color:var(--brick)">'+ic('alert',24)+'<span style="font-size:11px;font-weight:600">Sin respuesta</span></div>';
  } else if (state.micDenied){
    html += '<button class="rec-btn rec-idle" data-action="retry-rec" style="color:var(--brick)">'+ic('mic',22)+'<span style="font-size:11px;font-weight:600">Reintentar</span></button>';
  } else {
    html += '<button class="rec-btn rec-idle" data-action="start-rec">'+ic('mic',22)+'<span style="font-size:12px;font-weight:600">Grabar</span></button>';
  }
  html += '</div>';
  // Reloj visible (el tiempo corre desde que apareció la pregunta y no se frena al detener)
  if (state.qTiming && !state.recording && !timedOut){
    html += '<p class="rec-hint" id="recHint" style="font-weight:700;color:'+(overtime?'var(--brick)':'var(--ink)')+'"><span class="mono" id="recRemain">'+fmt(state.timeLeft)+'</span> restantes'+(answered?'':' — tocá <strong>Grabar</strong> cuando estés listo')+'</p>';
  }
  var hintTxt;
  if (state.recording) hintTxt = isCandidate ? "Estás grabando. Cuando termines de responder, tocá el botón <strong>Detener</strong>." : "Grabando… tocá el cuadrado para terminar antes.";
  else if (answered) hintTxt = canReRecord ? "Grabaste tu respuesta. Si te equivocaste, tocá <strong>Eliminar y grabar de nuevo</strong> — ojo, el tiempo sigue corriendo." : (isCandidate ? "Respuesta guardada. Continuá con la siguiente pregunta." : "Podés escuchar tu respuesta o volver a grabar.");
  else if (timedOut) hintTxt = "Se acabó el tiempo de esta pregunta sin una respuesta grabada. Podés continuar.";
  else if (state.micDenied) hintTxt = "Necesitamos el micrófono para grabar. Dale permiso al navegador y tocá Reintentar.";
  else if (isCandidate) hintTxt = "El tiempo ya corre. Leé y pensá la respuesta; cuando estés listo, tocá <strong>Grabar</strong>. Mientras quede tiempo podés eliminar y grabar de nuevo.";
  else hintTxt = "Tocá el micrófono y el cronómetro arranca. Se corta solo al llegar a 0.";
  html += '<p class="rec-hint">' + hintTxt + '</p></div>';

  if (answer && answer.blobUrl && !state.recording && !isCandidate){
    html += '<div class="transcript-box"><audio controls src="'+esc(answer.blobUrl)+'"></audio>';
    if (answer.transcript) html += '<div style="margin-top:12px"><div class="transcript-label">'+ic('msg',12)+' Transcripción aproximada</div><p style="margin:0;font-size:13.5px">'+esc(answer.transcript)+'</p></div>';
    html += '</div>';
  }
  if (state.recording) html += '<div id="liveBox" class="transcript-box" style="margin-top:12px;color:var(--muted);'+(state.live?'':'display:none')+'">'+esc(state.live)+'</div>';
  html += '</div>';

  html += '<div class="flex-actions">';
  if (answer && answer.blobUrl && !state.recording){
    if (!isCandidate) html += '<button class="btn btn-ghost btn-sm" data-action="re-record">'+ic('rotate',14)+' Volver a grabar</button>';
    else if (state.qTiming) html += '<button class="btn btn-ghost btn-sm" data-action="re-record" style="color:var(--brick)">'+ic('trash',14)+' Eliminar y grabar de nuevo</button>';
  }
  var showNext = isCandidate ? (answered || timedOut) : true;
  if (showNext) html += '<button class="btn btn-primary" data-action="next-q" style="margin-left:auto">' +
    (state.idx < total-1 ? "Siguiente pregunta "+ic('chevron',15) : esc(lastLabel)+" "+ic('chevron',15)) +
  '</button>';
  html += '</div>';
  return html;
};

Screens.review = function(){
  var qs = state.questions, answers = state.answers, c = state.config;
  var answeredN = qs.filter(function(q){ return answers[q.id] && (answers[q.id].transcript || answers[q.id].blobUrl); }).length;
  var canEvaluate = Object.values(answers).some(function(a){ return a && a.transcript && a.transcript.length > 8; });
  var html = Header();
  html += '<div class="card" style="margin-bottom:20px">' +
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;color:var(--teal)">'+ic('users',18)+'<h2 style="font-size:17px;color:var(--ink)">Respuestas del candidato</h2></div>' +
    '<p style="font-size:13px;color:var(--muted);margin:0">'+esc(c.position)+' · código '+esc(state.code)+' · '+answeredN+' de '+qs.length+' respondidas.</p>' +
    (state.audioOmitted ? Note("warn","Algunos audios eran muy pesados para guardarse localmente. Las transcripciones completas sí están disponibles (es lo que usa la evaluación).") : "") +
    ErrBox() +
    '<div class="flex-actions" style="margin-top:16px">' +
      '<button class="btn btn-teal" id="evalBtn" '+(canEvaluate?'':'disabled')+'>'+ic('sparkle',15)+' Generar evaluación</button>' +
      '<button class="btn btn-ghost" data-action="go-recruiterhome">'+ic('back',14)+' Volver al panel</button>' +
    '</div>' +
    (!canEvaluate ? '<p style="margin:12px 0 0;font-size:12px;color:var(--muted)">La evaluación necesita transcripción de al menos una respuesta. Igual podés escuchar los audios disponibles.</p>' : '') +
  '</div>';
  html += '<div style="display:grid;gap:12px">';
  qs.forEach(function(q,i){
    var a = answers[q.id]; var isF = q.isFollowup;
    var m = a ? speechMetrics(a.transcript||"") : null;
    var sig = a && a.signals ? ('pausa máx '+ (a.signals.longestSilence||0) +'s · duró '+(a.signals.durationSec||0)+'s') : '';
    html += '<div class="qa-item'+(isF?' followup':'')+'">' +
      '<div class="qa-meta">' + (isF ? '<span style="font-size:12px;font-weight:700;color:var(--purple)">↳ Repregunta</span>' : '<span style="font-size:12px;font-weight:700;color:var(--muted)">P'+(i+1)+'</span>') +
      (!isF ? Badge(q.category, q.category) : '') + (q.lang!=='es'?Badge(LANG_LABEL[q.lang],'Repregunta'):'') +
      (sig ? '<span style="font-size:11.5px;color:var(--muted)" class="mono">'+sig+'</span>' : '') + '</div>' +
      '<p class="qa-text">'+esc(q.text)+'</p>' +
      (a && a.blobUrl ? '<audio controls src="'+esc(a.blobUrl)+'"></audio>' : '') +
      (a && a.transcript ? '<p style="margin-top:10px;font-size:13.5px;color:'+(a.blobUrl?'var(--muted)':'var(--ink)')+'">'+esc(a.transcript)+'</p>' : (!a || !a.blobUrl) ? '<p style="font-style:italic;color:var(--muted);font-size:13px">Sin responder</p>' : '') +
      (a && a.blobUrl ? '<button class="dl-audio" data-action="download-audio" data-qid="'+esc(q.id)+'" data-name="respuesta-'+(i+1)+extForAnswer(a)+'" style="display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:600;color:var(--teal);background:none;border:none;padding:0;cursor:pointer;font-family:inherit">'+ic('download',13)+' <span>Descargar audio</span></button>' : '') +
    '</div>';
  });
  html += '</div>';
  return html;
};

Screens.report = function(){

  html += '<div class="report-hero">' +
    '<div class="report-eyebrow">'+(r.ai?'Análisis con IA (entrevistador senior)':'Evaluación por reglas')+' · '+esc(c.position)+' · solo visible para vos</div>' +
    '<div style="display:flex;align-items:flex-end;gap:14px;margin-top:8px;flex-wrap:wrap">' +
      '<div class="report-score">'+r.score+'<span style="font-size:20px;opacity:.6">/10</span></div>' +
      '<span class="rec-tag" style="background:rgba(255,255,255,.14);color:inherit;border:1px solid rgba(255,255,255,.25)">'+esc(r.recommendation)+'</span>' +
    '</div>' +
    '<p style="margin-top:14px;font-size:13.5px;opacity:.85;line-height:1.6">'+esc(r.overall)+'</p>' +

    ReportList("A mejorar", r.improve, "var(--amber)") +
  '</div>';
  html += LanguageBox(r.language);
  if (r.perQuestion && r.perQuestion.length){
    html += '<div class="card" style="padding:20px;margin-top:16px"><p style="font-size:13.5px;font-weight:700;color:var(--ink);margin:0 0 12px">Puntaje por pregunta</p><div style="display:grid;gap:12px">';
    r.perQuestion.forEach(function(p){
      var hasScore = (typeof p.score==="number");
      var col = hasScore ? scoreColorVar(p.score) : "var(--muted)";
      html += '<div style="display:flex;align-items:flex-start;gap:12px;border-left:3px solid '+col+';padding-left:12px">'+
        (hasScore ? '<span class="mono" style="flex-shrink:0;min-width:44px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;background:'+scoreTintVar(p.score)+';color:'+col+'">'+p.score+'<span style="font-size:10px;opacity:.6">/10</span></span>' : '') +
        '<div style="flex:1;min-width:0">'+
          '<p style="margin:0;font-size:12.5px;font-weight:700;color:var(--muted)">Pregunta '+esc(String(p.n||''))+(p.rating?(' · '+esc(p.rating)):'')+'</p>'+
          '<p style="margin:3px 0 0;font-size:13px;line-height:1.5">'+esc(p.assessment||'')+'</p>'+
        '</div>'+
      '</div>';
    });
    html += '</div></div>';
  }
  if (r.probes && r.probes.length) html += '<div style="margin-top:16px">' + ReportList("Repreguntas sugeridas para la próxima ronda", r.probes, "var(--teal)") + '</div>';
  html += '<div class="flex-actions">' +
    '<button class="btn btn-ghost" data-action="back-review">'+ic('back',14)+' Volver a las respuestas</button>' +
    '<button class="btn btn-primary" data-action="go-recruiterhome">'+ic('home',15)+' Volver al panel</button>' +
  '</div>';
  return html;
};
function ReportList(title, items, color){

    items.map(function(it){ return '<li style="display:flex;gap:9px;font-size:13.5px;line-height:1.5"><span style="margin-top:7px;width:6px;height:6px;border-radius:50%;background:'+color+';flex-shrink:0"></span><span>'+esc(it)+'</span></li>'; }).join('') +
  '</ul></div>';
}

function hmToMin(hm){ var m=/^(\d{1,2}):(\d{2})/.exec(String(hm||"").trim()); if(!m) return null; return parseInt(m[1],10)*60+parseInt(m[2],10); }
function tsDayKey(ts){ try{ var d=new Date(ts); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }catch(e){ return ""; } }
function tsHM(ts){ try{ var d=new Date(ts); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }catch(e){ return ""; } }
function tsMinOfDay(ts){ try{ var d=new Date(ts); return d.getHours()*60+d.getMinutes(); }catch(e){ return null; } }
function dayWeekNum(dayStr){ try{ var p=dayStr.split("-"); var d=new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)); var wd=d.getDay(); return wd===0?7:wd; }catch(e){ return null; } } // 1=Lun..7=Dom
function parseYMD(str){ try{ var p=String(str).split("-"); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)); }catch(e){ return null; } }
function rotationWeekIndex(startStr, dayStr, len){
  try{ var s=parseYMD(startStr), d=parseYMD(dayStr); if(!s||!d||!len) return 0; var diff=Math.floor((d.getTime()-s.getTime())/(24*3600*1000)); var wk=Math.floor(diff/7); wk=((wk%len)+len)%len; return wk; }catch(e){ return 0; }
}
function cycleDayIndex(startStr, dayStr, cyc){
  var s=parseYMD(startStr), d=parseYMD(dayStr); if(!s||!d||!cyc) return -1;
  var diff=Math.floor((d.getTime()-s.getTime())/(24*3600*1000));
  return ((diff%cyc)+cyc)%cyc;
}
/* Turno vigente de un empleado para una fecha: {in, out, works}. Soporta fijo y rotativo. */
function effectiveShift(e, dayStr){
  var wd=dayWeekNum(dayStr);
  function inCsv(csv){ return String(csv||"").split(",").map(function(s){return s.trim();}).indexOf(String(wd))>=0; }
  if((e.schedule_type||"fijo")!=="rotativo"){
    return { in:(e.shift_in||""), out:(e.shift_out||""), works: inCsv(e.work_days) };
  }
  var pat=e.rotation_pattern||"semanal";
  if(pat==="semanal"){
    var ws=(e.week_shifts && typeof e.week_shifts==="object") ? e.week_shifts : {};
    var hasWs=Object.keys(ws).length>0;
    if(!hasWs && Array.isArray(e.rotation) && e.rotation.length && e.rotation_start){
      var lwk=rotationWeekIndex(e.rotation_start, dayStr, e.rotation.length);
      var lr=e.rotation[lwk]||e.rotation[0]||{};
      return { in:(lr.in||""), out:(lr.out||""), works: inCsv(lr.days) };
    }
    var sh=ws[String(wd)];
    if(sh) return { in:(sh.in||""), out:(sh.out||""), works:true };
    return { in:"", out:"", works:false };
  }
  if(pat==="corrido"){
    var n=parseInt(e.work_n,10)||0, m=parseInt(e.off_n,10)||0, cyc=n+m;
    if(cyc>0 && e.rotation_start){
      var idx=cycleDayIndex(e.rotation_start, dayStr, cyc);
      var works=(idx>=0 && idx<n);
      return { in:works?(e.shift_in||""):"", out:works?(e.shift_out||""):"", works:works };
    }
    return { in:(e.shift_in||""), out:(e.shift_out||""), works: inCsv(e.work_days) };
  }
  // Compatibilidad: rotación por semanas (versión anterior).
  if(Array.isArray(e.rotation) && e.rotation.length && e.rotation_start){
    var wk=rotationWeekIndex(e.rotation_start, dayStr, e.rotation.length);
    var r=e.rotation[wk]||e.rotation[0]||{};
    return { in:(r.in||""), out:(r.out||""), works: inCsv(r.days) };
  }
  return { in:(e.shift_in||""), out:(e.shift_out||""), works: inCsv(e.work_days) };
}

function leaveDays(s, e){ var a=parseYMD(String(s||"").slice(0,10)), b=parseYMD(String(e||"").slice(0,10)); if(!a||!b) return 0; var d=Math.floor((b.getTime()-a.getTime())/(24*3600*1000))+1; return d>0?d:0; }
/* Vacaciones por antigüedad (Ley de Contrato de Trabajo, art. 150 y 153). */
function vacScaleDays(y){ if(y>20) return 35; if(y>10) return 28; if(y>5) return 21; return 14; }
function vacRegimeText(y){ return y>20?"más de 20 años":(y>10?"más de 10 y hasta 20 años":(y>5?"más de 5 y hasta 10 años":"hasta 5 años")); }
function countBusinessDays(a, b){ var d=new Date(a.getFullYear(),a.getMonth(),a.getDate()), n=0; while(d<=b){ var w=d.getDay(); if(w>=1&&w<=5) n++; d.setDate(d.getDate()+1); } return n; }
function antigText(hire, ref){ var months=(ref.getFullYear()-hire.getFullYear())*12+(ref.getMonth()-hire.getMonth()); if(ref.getDate()<hire.getDate()) months--; if(months<0) months=0; var y=Math.floor(months/12), m=months%12; if(y===0&&m===0) return "menos de 1 mes"; return (y>0?(y+" año"+(y===1?"":"s")):"")+((y>0&&m>0)?" y ":"")+(m>0?(m+" mes"+(m===1?"":"es")):""); }
function fmtDMY(d){ return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear(); }
/* Devuelve el proporcional automático de vacaciones para el año dado, según el legajo. */
function vacationEntitlement(emp, year){
  year=year||new Date().getFullYear();
  var jan1=new Date(year,0,1), dec31=new Date(year,11,31);
  var hire=emp.hire_date?parseYMD(String(emp.hire_date).slice(0,10)):null;
  if(!hire || isNaN(hire.getTime())) return { auto:14, hasHire:false, note:"Sin fecha de ingreso en el legajo: se usa el mínimo legal (14 días). Cargá la fecha de ingreso para el cálculo automático por antigüedad." };
  if(hire>dec31) return { auto:0, hasHire:true, note:"La fecha de ingreso es posterior a este año." };
  var seniority=(dec31-hire)/(365.25*24*3600*1000);
  var startInYear=hire>jan1?hire:jan1;
  var bWorked=countBusinessDays(startInYear, dec31), bYear=countBusinessDays(jan1, dec31);
  var reachedMin=bWorked>=(bYear/2);
  if(hire<=jan1 || reachedMin){
    var days=vacScaleDays(seniority);
    return { auto:days, hasHire:true, proportional:false, note:"Antigüedad al 31/12/"+year+": "+antigText(hire,dec31)+" → "+days+" días ("+vacRegimeText(seniority)+"), según antigüedad." };
  }
  // Proporcional del primer año (no completó medio año): 1 día cada 20 días corridos trabajados.
  var corridos=Math.floor((dec31-startInYear)/(24*3600*1000))+1;
  var prop=Math.floor(corridos/20);
  return { auto:prop, hasHire:true, proportional:true, note:"Ingreso "+fmtDMY(hire)+": no completó medio año laboral → proporcional de 1 día cada 20 días trabajados = "+prop+" días ("+corridos+" días corridos en "+year+")." };
}

  if(e.hire_date) leg.push("Ingreso: "+String(e.hire_date).slice(0,10));
  if(e.collective_agreement) leg.push("Convenio: "+e.collective_agreement);
  if(e.contract_type) leg.push("Contrato: "+e.contract_type);
  if(leg.length) L.push("LEGAJO: "+leg.join(" · "));
  var items=perfEmpItems(e.id);
  function fD(ts){ try{ var d=new Date(ts); return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear(); }catch(x){ return ""; } }
  ["objetivo","competencia","evaluacion","feedback","mejora"].forEach(function(ty){
    var arr=items.filter(function(p){ return p.type===ty; });
    if(!arr.length) return;
    L.push("");
    L.push((PERF_TYPES[ty]?PERF_TYPES[ty].label.toUpperCase():ty)+":");
    arr.forEach(function(p){
      var parts=[];
      if(p.title) parts.push(p.title);
      if(p.period) parts.push("período "+p.period);
      if(p.rating&&(ty==="competencia"||ty==="evaluacion")) parts.push("puntaje "+p.rating+"/5");
      if((ty==="objetivo"||ty==="mejora")){ parts.push("estado "+(PERF_STATUS[p.status||"pendiente"])); if(p.created_at) parts.push("cargado "+fD(p.created_at)); if(p.completed_at){ var dd=Math.max(0,Math.round((new Date(p.completed_at)-new Date(p.created_at))/(864e5))); parts.push("cumplido "+fD(p.completed_at)+" ("+dd+" días)"); } }
      if(p.detail) parts.push("detalle: "+p.detail);
      L.push("- "+parts.join(" · "));
    });
  });
  if(items.length===0) L.push("(Sin registros de desempeño todavía.)");
  return L.join("\n");
}

/* Ranking de empleados por tiempo de demora del proceso (objetivos/planes cumplidos). */
function perfRanking(){
  var emps=(state.emp.items||[]).filter(function(e){ return (e.status||"activo")==="activo"; });
  var rows=emps.map(function(e){
    var items=perfEmpItems(e.id).filter(function(p){ return p.type==="objetivo"||p.type==="mejora"; });
    var done=items.filter(function(p){ return p.status==="cumplido" && p.completed_at; });
    var pend=items.filter(function(p){ return p.status!=="cumplido"; });
    var avg=null;
    if(done.length){ var sum=done.reduce(function(a,p){ return a+Math.max(0,(new Date(p.completed_at)-new Date(p.created_at))/(864e5)); },0); avg=sum/done.length; }
    return { emp:e, total:items.length, done:done.length, pending:pend.length, avgDays:avg };
  }).filter(function(r){ return r.total>0; });
  rows.sort(function(a,b){ if(a.avgDays==null && b.avgDays==null) return b.done-a.done; if(a.avgDays==null) return 1; if(b.avgDays==null) return -1; return a.avgDays-b.avgDays; });
  return rows;
}

function autofillStateFor(domain){ return domain==="salud"?state.hs:(domain==="documentacion"?state.doc:state.cap); }
function autofillFromFile(file, domain, applyFn){
  var isPdf = /pdf/i.test(file.type||"") || /\.pdf$/i.test(file.name||"");
  var st = autofillStateFor(domain); var form = st.form;
  if(!form) return;
  if(!isPdf){ return; } // solo PDFs se leen automáticamente
  form.reading=true; render();
  extractPdfText(file).then(function(text){
    if(!text || text.replace(/\s/g,"").length<20){ form.reading=false; render(); return; } // PDF escaneado / sin texto
    fetch("/api/analyze", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ task:"form_extract", domain:domain, text:text }) })
      .then(function(r){ return r.json(); })
      .then(function(j){ form.reading=false; if(j&&j.ok&&j.fields){ applyFn(j.fields); st.msg="Datos leídos del PDF. Revisá y guardá."; } render(); })
      .catch(function(){ form.reading=false; render(); });
  }).catch(function(){ form.reading=false; render(); });
}
function capApplyFields(fx){

function hsApplyFields(fx){
  var f=state.hs.form; if(!f||!fx) return;

  var sub=hsSubOptions(f.type); if(sub && fx.subtype && sub[fx.subtype]) f.subtype=fx.subtype;

/* Habilita arrastrar-y-soltar un archivo en una zona; onFile recibe el File. */
function wireDropzone(zoneId, onFile){
  var z=document.getElementById(zoneId); if(!z) return;
  var hi=function(){ z.style.borderColor="var(--teal)"; z.style.background="var(--teal-tint)"; };
  var lo=function(){ z.style.borderColor="var(--border)"; z.style.background="var(--surface)"; };
  ["dragenter","dragover"].forEach(function(ev){ z.addEventListener(ev, function(e){ e.preventDefault(); e.stopPropagation(); hi(); }); });
  ["dragleave","dragend"].forEach(function(ev){ z.addEventListener(ev, function(e){ e.preventDefault(); e.stopPropagation(); lo(); }); });
  z.addEventListener("drop", function(e){ e.preventDefault(); e.stopPropagation(); lo(); var file=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if(file) onFile(file); });
}

/* Resumen del día: por cada empleado, primera entrada / última salida / horas / estado. */
function asistDaySummary(dayArg){
  var day=dayArg||state.asist.day||todayISO();
  var punches=(state.asist.items||[]).filter(function(p){ return tsDayKey(p.punched_at)===day; });
  var emps=state.emp.items||[];
  var empById={}; emps.forEach(function(e){ empById[e.id]=e; });
  var groups={};
  punches.forEach(function(p){
    var key=p.employee_id||("n:"+(p.name_entered||"")+"|"+(p.legajo_number||""));
    if(!groups[key]) groups[key]={ emp: p.employee_id?empById[p.employee_id]:null, name:(p.employee_id&&empById[p.employee_id]?empFullName(empById[p.employee_id]):(p.name_entered||"(sin nombre)")), legajo:(p.legajo_number||""), matched:!!p.employee_id, entradas:[], salidas:[] };
    if(p.type==="entrada") groups[key].entradas.push(p); else if(p.type==="salida") groups[key].salidas.push(p);
  });
  var wd=dayWeekNum(day);
  var rows=Object.keys(groups).map(function(k){
    var g=groups[k];
    g.entradas.sort(function(a,b){ return new Date(a.punched_at)-new Date(b.punched_at); });
    g.salidas.sort(function(a,b){ return new Date(a.punched_at)-new Date(b.punched_at); });
    var entrada=g.entradas[0]||null; var salida=g.salidas[g.salidas.length-1]||null;
    var workedMin=null; if(entrada&&salida){ workedMin=(new Date(salida.punched_at)-new Date(entrada.punched_at))/60000; }
    var late=null, extra=null, estadoKind=null, hasShiftIn=false, early=null, worksToday=null;
    var e=g.emp;
    if(e){
      var eff=effectiveShift(e, day);
      worksToday=eff.works;
      var si=hmToMin(eff.in), so=hmToMin(eff.out), tol=parseInt(e.tolerance_min,10); if(isNaN(tol)) tol=5;
      if(si!=null) hasShiftIn=true;
      if(entrada&&si!=null){ var em=tsMinOfDay(entrada.punched_at); if(em!=null){ if(em>si+tol){ late=em-si; estadoKind="tarde"; } else { estadoKind="atiempo"; } } }
      // Horas extra: se cuentan al fichar la SALIDA, según cuánto se quedó pasado su horario de salida (15 min de gracia).
      if(salida&&si!=null&&so!=null&&so>si){ var somx=tsMinOfDay(salida.punched_at); if(somx!=null && somx>so+15) extra=somx-so; }
      // Salida anticipada: la última salida ocurrió antes del horario de salida (con 5 min de gracia).
      if(salida&&si!=null&&so!=null&&so>si){ var sm=tsMinOfDay(salida.punched_at); if(sm!=null && sm < so-5){ early={ min: so-sm, salidaId: salida.id, justification:(salida.justification||"") }; } }
    }
    var lateInfo=(estadoKind==="tarde"&&entrada)?{ min:late, entradaId:entrada.id, justification:(entrada.justification||"") }:null;
    var punchIds=g.entradas.concat(g.salidas).map(function(p){ return p.id; }).filter(Boolean);
    return { name:g.name, legajo:g.legajo, matched:g.matched, empId:(e?e.id:null), works:worksToday, entrada:entrada, salida:salida, workedMin:workedMin, late:late, extra:extra, estadoKind:estadoKind, hasShiftIn:hasShiftIn, early:early, lateInfo:lateInfo, punchIds:punchIds, punches:g.entradas.length+g.salidas.length };
  });
  // Ausentes: empleados activos cuyo día laborable es hoy y no ficharon.
  var presentIds={}; Object.keys(groups).forEach(function(k){ if(groups[k].emp) presentIds[groups[k].emp.id]=true; });
  var absent=[];
  if(wd){
    emps.forEach(function(e){
      if((e.status||"activo")!=="activo") return;
      if(effectiveShift(e, day).works && !presentIds[e.id]) absent.push(e);
    });
  }
  return { rows:rows, absent:absent, day:day, count:punches.length };
}

/* Control mensual: por cada empleado del mes, junta llegadas tarde, ausencias,
   horas extra y días de franco trabajados. mk = "YYYY-MM". */
function asistMonthControl(mk){
  var emps=(state.emp.items||[]);
  var empById={}; emps.forEach(function(e){ empById[e.id]=e; });
  var y=parseInt(mk.slice(0,4),10), mo=parseInt(mk.slice(5,7),10);
  if(!y||!mo) return [];
  var dim=new Date(y, mo, 0).getDate();
  var today=todayISO();
  var byEmp={};
  function slot(id){ if(!byEmp[id]) byEmp[id]={ emp:empById[id]||null, late:[], absent:[], extra:[], franco:[], early:[], rest:[] }; return byEmp[id]; }
  for(var d=1; d<=dim; d++){
    var dayISO=mk+"-"+("0"+d).slice(-2);
    if(today && dayISO>today) continue; // no contamos días futuros
    var sum=asistDaySummary(dayISO);
    var presentToday={};
    sum.rows.forEach(function(r){
      if(!r.empId) return; // fichadas sin match no entran al control
      presentToday[r.empId]=true;
      var s=slot(r.empId);
      if(r.works===false){
        // Día franco: sólo cuenta como "trabajó franco" (no aplican tarde/extra/salida anticipada).
        if(r.entrada) s.franco.push({ date:dayISO, hm:tsHM(r.entrada.punched_at) });
      } else {
        if(r.estadoKind==="tarde" && r.late!=null) s.late.push({ date:dayISO, min:r.late, just:(r.lateInfo&&r.lateInfo.justification)||"" });
        // Horas extra: se contabilizan al fichar la salida, según el horario.
        if(r.extra!=null) s.extra.push({ date:dayISO, min:r.extra, out:(r.salida?tsHM(r.salida.punched_at):"") });
        // Salida anticipada (se fue antes): se carga con su justificación.
        if(r.early) s.early.push({ date:dayISO, min:r.early.min, just:(r.early.justification||""), out:(r.salida?tsHM(r.salida.punched_at):"") });
      }
    });
    sum.absent.forEach(function(e){ var an=absNoteFor(e.id, dayISO); slot(e.id).absent.push({ date:dayISO, note:(an&&an.note)||"" }); });
    // Francos según el legajo: días de descanso programados (no le tocaba trabajar) sin fichaje.
    (function(dISO){
      emps.forEach(function(e){
        if((e.status||"activo")!=="activo") return;
        if(presentToday[e.id]) return; // ese día trabajó/fichó → no es descanso
        var eff=effectiveShift(e, dISO);
        if(eff && eff.works===false){ slot(e.id).rest.push({ date:dISO }); }
      });
    })(dayISO);
  }
  // Todos los empleados activos tienen su carpeta (aunque no tengan novedades).
  emps.forEach(function(e){ if((e.status||"activo")==="activo" && !byEmp[e.id]) slot(e.id); });
  var list=Object.keys(byEmp).map(function(id){ return byEmp[id]; }).filter(function(s){ return s.emp; });
  // "count" (novedades) NO incluye los francos programados: son días normales de descanso.
  list.forEach(function(s){ s.count=s.late.length+s.absent.length+s.extra.length+s.franco.length+s.early.length; });
  list.sort(function(a,b){ return empFullName(a.emp).localeCompare(empFullName(b.emp)); });
  return list;
}

// Video persistente: un ÚNICO <video> que sobrevive a los re-render, para que

// Dibuja un frame (video o bitmap) a un canvas y devuelve el blob JPEG.
function frameToBlob(src, w, h, resolve){
  try{
    var cw=Math.min(640, w||640), ch=Math.round(cw*((h||480)/(w||640)));
    var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
    cv.getContext("2d").drawImage(src,0,0,cw,ch);
    cv.toBlob(function(blob){ resolve(blob||null); }, "image/jpeg", 0.82);
  }catch(e){ resolve(null); }
}
// Captura desde el <video> (fallback para navegadores sin ImageCapture, ej. iOS).
function captureFromVideo(resolve){
  var v=rt.camVideo || document.getElementById("ficamvideo");
  if(!v || !rt.camStream){ resolve(null); return; }
  var done=false;
  var draw=function(){ if(done) return; done=true; frameToBlob(v, v.videoWidth||640, v.videoHeight||480, resolve); };
  var tries=0;
  var waitReady=function(){
    if(v.videoWidth && v.videoHeight && v.readyState>=2){
      if(typeof v.requestVideoFrameCallback==="function"){ try{ v.requestVideoFrameCallback(function(){ draw(); }); return; }catch(e){} }
      setTimeout(draw, 60); return;
    }
    if(tries++ < 25){ setTimeout(waitReady, 100); } else { resolve(null); }
  };
  try{ v.play && v.play().catch(function(){}); }catch(e){}
  waitReady();
}
function captureFichadorPhoto(){
  return new Promise(function(resolve){
    try{
      if(!rt.camStream){ resolve(null); return; }
      var track=(rt.camStream.getVideoTracks&&rt.camStream.getVideoTracks()[0])||null;
      // Preferimos ImageCapture: toma el frame EN VIVO directo de la cámara,
      // sin depender del <video> del DOM (que a veces queda congelado tras un re-render).
      if(track && typeof ImageCapture!=="undefined"){
        try{
          var ic=new ImageCapture(track);
          ic.grabFrame().then(function(bmp){
            frameToBlob(bmp, bmp.width, bmp.height, function(blob){ try{ bmp.close&&bmp.close(); }catch(e){} if(blob) resolve(blob); else captureFromVideo(resolve); });
          }).catch(function(){ captureFromVideo(resolve); });
          return;
        }catch(e){ /* seguimos con el fallback */ }
      }
      captureFromVideo(resolve);
    }catch(e){ resolve(null); }
  });
}
// Devuelve la ubicación: la que ya teníamos, o la pide en el momento (con un límite de espera).
function ensureFichadorGeo(){
  return new Promise(function(resolve){
    try{
      var f=state.fichador;
      if(f && f.geo){ resolve(f.geo); return; }
      if(!(navigator.geolocation && navigator.geolocation.getCurrentPosition)){ resolve(null); return; }
      var settled=false;
      var done=function(g){ if(settled) return; settled=true; resolve(g); };
      navigator.geolocation.getCurrentPosition(function(pos){
        var g={ lat:pos.coords.latitude, lng:pos.coords.longitude, acc:pos.coords.accuracy };
        if(state.fichador){ state.fichador.geo=g; state.fichador.geoErr=""; }
        done(g);
      }, function(){ if(state.fichador && !state.fichador.geo) state.fichador.geoErr="No pudimos obtener la ubicación (dá permiso)."; done(null); }, { enableHighAccuracy:true, timeout:7000, maximumAge:60000 });
      setTimeout(function(){ done((state.fichador&&state.fichador.geo)||null); }, 7500);
    }catch(e){ resolve(null); }
  });
}
function doFichar(type){
  var f=state.fichador; if(!f||f.sending) return;
  if(!(f.first||"").trim() && !(f.last||"").trim()){ f.error="Cargá tu nombre y apellido."; render(); return; }
  if(!(f.dni||"").replace(/\D/g,"")){ f.error="Cargá tu número de documento (DNI)."; render(); return; }
  f.error=null;
  // IMPORTANTE: capturamos la foto ANTES de re-renderizar (el video sigue en vivo).
